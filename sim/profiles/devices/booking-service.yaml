# yaml-language-server: $schema=schema.json
# Booking Service, a room-booking platform's first-party integration (#1743)
#
# An outside actor, not a device on the network: a scheduling platform
# that reports the bookings of the places it manages by pushing them to
# Omniglass, as a first-party integration does. It has no interface to
# poll. Its push face holds a bearer token for a user granted
# telemetry:push alone on the systems it books, reads those systems off
# its own grant (GET /auth/me), and posts each one's batch through
# POST /telemetry:push every 30 seconds. A scenario declares it as a
# pusher; the lab seeds its user and mints its token per run.
#
# Pushed datapoints (per system it is granted):
#   booking-count  (metric)   , booked meetings left in the day, the one running included
#   booking-state  (property) , booked while a booked meeting holds the room, free between
#
# The sim is; Omniglass learns (#2757, #2765). Every reading is the lab
# calendar's booked entries for the room the system sits in, resolved through
# the world the simulator holds (ownerBookings), on the device's clock. A
# walk-in is no booking, and a no-show is: its slot reads booked.
#
# A system the world does not place (the dev fleet has no world file) has no
# calendar, and keeps the service's previous behavior exactly: the meeting day
# in configuration.calendar.bookings, windows in UTC that repeat every day.

name: booking-service
manufacturer: Shinra Cloud
model: "Booking Service (integration)"
device_type: cloud-service
slug_prefix: booking

doc:
  summary: "Room-booking platform's integration: pushes each booked location's day, read off the lab calendar, through /telemetry:push"
  description: |
    A scheduling platform's first-party integration. It pushes each
    system it is granted its booking count (meetings left today) and
    booking state (booked or free) through POST /telemetry:push with a
    bearer token, read off the lab calendar's booked meetings for the
    system's room (a fixed meeting day where the system has no calendar). No interface: nothing polls it, it reports.
  tags: [cloud, scheduling, integration, push]

interfaces: []

push:
  every: 30s
  body: |
    {{- $count := 0 -}}{{- $state := "free" -}}
    {{- if ownerRoom .Owner -}}
      {{- $b := ownerBookings .Owner -}}{{- $count = $b.remaining -}}{{- $state = $b.state -}}
    {{- else -}}
      {{- $b := bookingsAt .Now .State.configuration.calendar.bookings -}}{{- $count = $b.Remaining -}}{{- $state = $b.State -}}
    {{- end -}}
    {"owner":{"kind":"system","ref":{{ marshal .Owner }}},
     "source":"sim-booking-service",
     "metrics":[{"name":"booking-count","value":{{ $count }}}],
     "properties":[{"name":"booking-state","value":{{ marshal $state }}}]}

computed:
  - { path: status.device.uptime, kind: elapsed, since: status.device.boot_epoch }

defaults:
  status:
    device:
      boot_epoch: 0
  configuration:
    calendar:
      bookings: ["09:00-10:00", "10:30-11:30", "13:00-14:00", "15:00-16:30"]
