# yaml-language-server: $schema=schema.json
# Newtron Core CP-3, control processor
#
# The processor a room's control program runs on: it holds the program that
# starts a meeting and selects sources, drives the devices wired to its
# control ports (serial, IR, relays), and serves the touch panels that
# connect to it. A touch panel's surface is a subset of its own, so the
# panel's room and source control is the shared nvp-room surface (#896), and
# the program, ports and connected panels are the processor's alone.
#
# It starts and ends the room's meetings off the lab calendar (#2757, #2776):
# the room's system power is on from two minutes before a booked meeting
# someone attends (at the start of a walk-in) to five minutes after it ends,
# the same window the displays wake in, and standby otherwise; the start-meeting
# macro runs as it goes on and the end-meeting macro as it goes to standby, the
# last one and when it ran held beside it. A no-show runs nothing. A processor
# whose room has no calendar runs no macro and leaves the room as it was.

name: newtron-core-3
manufacturer: Newtron
model: "Core CP-3"
device_type: control-processor
slug_prefix: control-processor

doc:
  summary: "Newtron Core CP-3, room control processor"
  description: |
    Runs a room's control program. Answers the NVP line protocol with the
    touch panel's room and source control, and with its program state, its
    control ports and the panels connected to it.

interfaces:
  # NVP: the newtron-core-nvp driver's line protocol (TCP 51325, CRLF lines,
  # no banner). GET PROGRAM reports whether the control program runs and SET
  # PROGRAM starts or stops it (the sim matches whole lines, so each state is
  # listed); SUBSCRIBE PROGRAM pushes "EVT PROGRAM <state>" on change. GET
  # PORTS lists the control ports with their states, GET PANELS counts the
  # touch panels connected.
  - name: nvp
    protocol: tcp
    port: 51325
    doc:
      summary: "NVP line protocol: room control, program state, control ports and connected panels"
      tags: [control, persistent-session, raw-tcp]
    api_surface: newtron-nvp
    persistent: true
    line_ending: "\r\n"
    include: [nvp-room]
    subjects:
      - match: "status.control.program"
        path: "status.control.program"
        publish_token: "PROGRAM"
        push_format: "EVT PROGRAM {{ .Raw }}"
    commands:
      - match: "GET PROGRAM"
        response: 'PROGRAM {{ .State | get "status" | get "control" | get "program" }}'
      - match: "SET PROGRAM running"
        response: "PROGRAM running"
        mutations:
          - { path: status.control.program, value: "running" }
      - match: "SET PROGRAM stopped"
        response: "PROGRAM stopped"
        mutations:
          - { path: status.control.program, value: "stopped" }
      - match: "GET PORTS"
        response: 'PORTS {{ .State | get "status" | get "control" | get "ports" }}'
      - match: "GET PANELS"
        response: 'PANELS {{ .State | get "status" | get "control" | get "panels" }}'
      # The room's system power (on or standby) and the last macro run, with
      # the unix second it ran: "MACRO start-meeting 1793700000", or
      # "MACRO none 0" before the first.
      - match: "GET ROOMPOWER"
        response: 'ROOMPOWER {{ .State | get "status" | get "control" | get "room_power" }}'
      # The room's temperature in degrees Celsius: "ROOMTEMP 21.6".
      - match: "GET ROOMTEMP"
        response: 'ROOMTEMP {{ .State | get "status" | get "room" | get "temperature_c" }}'
      - match: "GET MACRO"
        response: 'MACRO {{ .State | get "status" | get "control" | get "macro" }} {{ .State | get "status" | get "control" | get "macro_at" }}'
      - match: "SUBSCRIBE PROGRAM"
        action: subscribe
        subject: "status.control.program"
        token: "PROGRAM"
        response: "OK"
      - match: "UNSUBSCRIBE PROGRAM"
        action: unsubscribe
        subject: "status.control.program"
        response: "OK"

  - name: icmp
    protocol: icmp
    doc: { summary: "ICMP ping reachability", tags: [monitoring] }

# Read-derived uptime: now - boot_epoch, seeded at device start. No timer.
computed:
  - { path: status.device.uptime, kind: elapsed, since: status.device.boot_epoch }

behaviors:
  # The macro ran this tick, then the power it left the room in: the macro is
  # chosen against the power the room had, so it fires on the edge only.
  - name: room_meeting
    schedule:
      interval: 30s
      on_start: true
    mutations:
      - path: status.control.macro
        value: '{{ $c := .State.status.control }}{{ if hasCalendar }}{{ $on := (roomPhase).in_use }}{{ if and $on (eq $c.room_power "standby") }}start-meeting{{ else if and (not $on) (eq $c.room_power "on") }}end-meeting{{ else }}{{ $c.macro }}{{ end }}{{ else }}{{ $c.macro }}{{ end }}'
      - path: status.control.macro_at
        value: '{{ $c := .State.status.control }}{{ if hasCalendar }}{{ $on := (roomPhase).in_use }}{{ if or (and $on (eq $c.room_power "standby")) (and (not $on) (eq $c.room_power "on")) }}{{ now }}{{ else }}{{ $c.macro_at }}{{ end }}{{ else }}{{ $c.macro_at }}{{ end }}'
      - path: status.control.room_power
        value: '{{ if hasCalendar }}{{ if (roomPhase).in_use }}on{{ else }}standby{{ end }}{{ else }}{{ .State.status.control.room_power }}{{ end }}'

  # The room's climate: the underlying temperature (climate_c) moves a fifth of
  # the way to its target each tick, the target being the setpoint plus 0.25 C
  # per attendee (to at most 4 C) while the room is in use and the setpoint
  # otherwise; the reading (temperature_c) is that value with 0.1 C of noise.
  - name: room_climate
    schedule:
      interval: 30s
      on_start: true
    mutations:
      - path: status.room.temperature_c
        value: '{{ round 1 (randStep 0.1 .State.status.room.climate_c) }}'
      - path: status.room.climate_c
        value: '{{ $r := .State.status.room }}{{ $c := $r.climate_c }}{{ $t := $r.setpoint_c }}{{ if hasCalendar }}{{ $p := roomPhase }}{{ if $p.in_use }}{{ $t = add $r.setpoint_c (clamp 0.0 4.0 (mul $r.load_c_per_person $p.attendees)) }}{{ end }}{{ round 3 (add $c (mul 0.2 (sub $t $c))) }}{{ else }}{{ $r.setpoint_c }}{{ end }}'

defaults:
  status:
    device:
      # Anchor for the computed uptime field; 0 is seeded to the start time.
      boot_epoch: 0
    panel:
      occupancy: false
    room:
      scene: "idle"
      source: "none"
      # The room's temperature in degrees Celsius, and the underlying value the
      # reading is taken from (see room_climate).
      temperature_c: 21.5
      climate_c: 21.5
      # The setpoint the room settles at, and the warmth each person in a held
      # meeting adds toward it (to at most 4 C).
      setpoint_c: 21.5
      load_c_per_person: 0.25
    diagnostics:
      log: ""
    video:
      input: "hdmi1"
    control:
      # Whether the control program runs: running or stopped.
      program: "running"
      ports: "com1=connected com2=connected ir1=idle relay1=open"
      panels: 3
      # The room's system power, on or standby, and the last macro the program
      # ran (start-meeting, end-meeting or none) with the unix second it ran.
      room_power: "standby"
      macro: "none"
      macro_at: 0
  configuration:
    device:
      serial: ""
      model: "Core CP-3"
      manufacturer: "Newtron"
    firmware:
      version: "4.1.2"
