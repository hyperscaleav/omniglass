# yaml-language-server: $schema=schema.json
# Scheduling Service, Cloud Room-Booking Platform
#
# A centralized cloud service that owns room bookings and panel config
# (think a calendaring / room-resource backend). Standalone HTTP
# service, token auth, no SNMP / CLI / raw-TCP. ICMP kept for the
# network band.
#
# Course datapoints (HTTP, token auth, one way in):
#   status.bookings.today        , booked meetings today across the rooms it serves
#   status.bookings.remaining    , of those, the ones not over (the one running included)
#   status.bookings.in_progress  , rooms a booked meeting holds now
#   configuration.rooms_served   , rooms the platform speaks for
#   configuration.sync_ok        , last config sync succeeded
#
# The sim is; Omniglass learns (#2757, #2765). The counts are the lab
# calendar's booked entries (a walk-in is no booking, a no-show is one) for
# the rooms the world says this service speaks for (a service the world
# covers rooms for) or, placed in a room, that room (servedRooms), recomputed
# each tick on the device's clock. A service the world covers no room for (the
# dev fleet has no world file) has no calendar and keeps its previous
# behavior exactly: today's count stays the fixed 8.
#
# Auth: header token. public_paths exempts the dashboard root.

name: scheduling-service
manufacturer: Shinra Cloud
model: "Scheduling Platform"
device_type: cloud-service
slug_prefix: sched-svc

doc:
  summary: "Cloud room-booking / scheduling platform (bookings + config)"
  description: |
    Centralized scheduling cloud service that owns room bookings and
    pushes panel config. Exposes an HTTP admin API (token auth)
    reporting today's bookings and config-sync health. HTTP + ICMP
    only, no SNMP or CLI.
  tags: [cloud, scheduling, service]

interfaces:
  - name: http-api
    protocol: http
    port: 443
    tls: true
    doc:
      summary: "Scheduling admin HTTP API + dashboard"
      tags: [management, api, cloud]
    auth:
      type: header
      header: "X-Sched-Token"
      api_key: "sched-lab-token"
      enforce: true
      public_paths: ["/"]
    api_surface: scheduling-service
    routes:
      - match: "GET /"
        template: web/scheduling-service/index.gotempl
        doc: { summary: "Scheduling service dashboard" }

      - match: "GET /api/status"
        template: api/scheduling-service/status.json.gotempl
        doc: { summary: "Service status (today's bookings, sync health)", tags: [api, status] }

      - match: "GET /api/bookings"
        template: api/scheduling-service/bookings.json.gotempl
        doc: { summary: "Today's bookings + config sync flag", tags: [api, bookings] }

  - name: icmp
    protocol: icmp
    doc: { summary: "ICMP ping reachability", tags: [monitoring] }

computed:
  - { path: status.device.uptime, kind: elapsed, since: status.device.boot_epoch }

behaviors:
  - name: bookings_sync
    schedule:
      interval: 30s
    mutations:
      - path: status.bookings.today
        value: '{{ if servedRooms }}{{ $n := 0 }}{{ range servedRooms }}{{ $n = add $n (roomBookings .site .building .room).today }}{{ end }}{{ $n }}{{ else }}{{ .State.status.bookings.today }}{{ end }}'
      - path: status.bookings.remaining
        value: '{{ $n := 0 }}{{ range servedRooms }}{{ $n = add $n (roomBookings .site .building .room).remaining }}{{ end }}{{ $n }}'
      - path: status.bookings.in_progress
        value: '{{ $n := 0 }}{{ range servedRooms }}{{ if (roomBookings .site .building .room).booked }}{{ $n = add $n 1 }}{{ end }}{{ end }}{{ $n }}'
      - path: configuration.rooms_served
        value: '{{ len servedRooms }}'

defaults:
  status:
    device:
      boot_epoch: 0
    bookings:
      today: 8
      remaining: 0
      in_progress: 0
  configuration:
    rooms_served: 0
    sync_ok: true
    device:
      serial: ""
      model: "Scheduling Platform"
      manufacturer: "Shinra Cloud"
    firmware:
      version: "cloud-2026.06"
    network:
      hostname: ""
