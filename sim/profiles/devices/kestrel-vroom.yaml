# yaml-language-server: $schema=schema.json
# Kestrel VRoom, Video Conferencing Bar (UCC appliance)
#
# Kestrel is the lab's fictional VC hardware vendor. The VRoom is an
# all-in-one meeting-room video bar: codec, camera, microphone array,
# and speakers in a single horizontal bar under a display. In the
# course it is the HTTP-JSON teaching device, every datapoint a
# trainee monitors comes in over the HTTP JSON API, and nowhere else.
#
# ONE teaching interface: HTTP JSON. The five course datapoints
#   status.app.mode              , UCC platform the bar is running
#   status.app.ucc_signin        , signed-in UCC account (or "")
#   status.peripherals.touch_pair, paired touch controller (or "")
#   status.presentation.local_active, local (HDMI) presentation active
#   status.logs.recent           , recent device log lines
# are reachable ONLY over HTTP (GET /api/app, GET /api/status, and the
# PRIVATE GET /api/logs). There is no SNMP, SSH, Telnet, or raw-TCP
# surface on this device: the older generic-codec control bands were
# removed so the bar is HTTP + ICMP only. ICMP stays (network band
# needs every device pingable) and the web admin UI stays (it is the
# "hacking" surface).
#
# PRIVATE-API teaching point: status.logs.recent is served by the
# undocumented GET /api/logs route. The web admin page's "Recent logs"
# card DOES fetch it (client JS), so the call shows up in the browser's
# network tab, that is the breadcrumb. A student spots the request,
# then calls GET /api/logs directly (e.g. wiring a collector HTTP item to
# it). The route is a real HTTP endpoint; it is just not advertised in
# the public API docs. Contrast with newtron's configuration.room.
# config_version, which is a WEB-DRIVER datapoint: no endpoint at all,
# just a base64 blob embedded in GET / that only a real browser decodes.
#
# Auth pattern: HTTP Basic over TLS (port 443). admin / kestrel.

name: kestrel-vroom
manufacturer: Kestrel
model: "VRoom"
device_type: video-codec
# Case-study hostname slot ("video-bar"). slug_prefix only seeds the
# stable internal HostID slug; hostnames come from the system-profile
# suffix.
slug_prefix: video-bar

doc:
  summary: "Kestrel VRoom video conferencing bar"
  description: |
    All-in-one meeting room video bar: 4K camera, beamforming
    microphone array, stereo speakers, and an embedded UCC client.
    The course's HTTP-JSON device, app mode, UCC sign-in, touch-panel
    pairing, local presentation, and recent logs are all read over the
    HTTP JSON API (and nowhere else). HTTP + ICMP only; no SNMP/CLI.

interfaces:
  - name: http-api
    protocol: http
    port: 443
    tls: true
    doc:
      summary: "Kestrel HTTP JSON API + web admin UI"
      tags: [management, api]
    auth:
      type: basic
      default_user: admin
      default_password: kestrel
      realm: "Kestrel VRoom"
      enforce: true
    # The live feed the web admin page updates from (#1038): every change
    # to the call's state and participant count, the volume, the mute and
    # the power state, one numbered event each
    # (event: change, its data the path and the value as JSON), behind the
    # same basic auth, beside the named events the routes and the call cycle
    # report (call-started, participant-joined, log and the rest). A
    # reconnect's Last-Event-ID replays from that event, and the console
    # drops every stream by firing POST at drop_path.
    events:
      path: /api/events
      retry_ms: 2000
      paths: [status.audio.volume, status.audio.mic_mute, status.call.active, status.call.participants, status.device.power]
      drop_path: /api/admin/streams/drop
    api_surface: kestrel-vroom
    routes:
      - match: "GET /"
        template: web/kestrel-vroom/index.gotempl
        doc: { summary: "Codec dashboard" }

      # Whole-device status snapshot. Carries the five course datapoints
      # (app mode, UCC sign-in, touch pairing, local presentation) plus
      # the codec's call/audio/video state. This is the public read
      # surface a monitoring template polls.
      - match: "GET /api/status"
        template: api/kestrel-vroom/status.json.gotempl
        doc: { summary: "Full status snapshot (app, call, audio, video)", tags: [api, status] }

      # Application / UCC band, the course datapoints, broken out.
      - match: "GET /api/app"
        template: api/kestrel-vroom/app.json.gotempl
        doc: { summary: "App mode, UCC sign-in, touch pairing, local presentation", tags: [api, app, ucc] }

      # PRIVATE route. Recent device logs are served here. The route is
      # NOT advertised as a public API, but the web admin page's "Recent
      # logs" card DOES fetch it from client JS, so the request is
      # visible in the browser network tab. visibility: private flags it
      # so docgen / the console can badge or hide it; runtime serving is
      # unchanged. This is the course's "private API" hacking datapoint:
      # the student spots GET /api/logs in the network tab and then calls
      # it directly (e.g. a collector HTTP item). Undocumented, but a real
      # endpoint, contrast newtron's web-driver-only config_version.
      - match: "GET /api/logs"
        template: api/kestrel-vroom/logs.json.gotempl
        visibility: private
        doc: { summary: "Recent device logs (private; undocumented direct-call route)", tags: [api, logs, private] }

      - match: "GET /api/call"
        template: api/kestrel-vroom/call.json.gotempl
        doc: { summary: "Current call state", tags: [api, call] }

      - match: "GET /api/audio"
        template: api/kestrel-vroom/audio.json.gotempl
        doc: { summary: "Audio state (volume, mute)", tags: [api, audio] }

      - match: "GET /api/system"
        template: api/kestrel-vroom/system.json.gotempl
        doc: { summary: "System unit info (serial, firmware, uptime)", tags: [api, info] }

      - match: "POST /api/audio/volume"
        template: api/kestrel-vroom/audio-ack.json.gotempl
        doc: { summary: "Set speaker volume", tags: [api, control] }
        example: |
          {"volume": 50}
        mutate:
          status.audio.volume: "{{ .Request.Body.volume }}"
          status.audio.speaker_level: "{{ .Request.Body.volume }}"

      - match: "POST /api/audio/mute"
        template: api/kestrel-vroom/audio-ack.json.gotempl
        doc: { summary: "Set microphone mute", tags: [api, control] }
        example: |
          {"mute": true}
        mutate:
          status.audio.mic_mute: "{{ .Request.Body.mute }}"

      - match: "POST /api/video/camera"
        template: api/kestrel-vroom/audio-ack.json.gotempl
        doc: { summary: "Toggle camera privacy shutter", tags: [api, control] }
        example: |
          {"camera_on": true}
        mutate:
          status.video.camera_on: "{{ .Request.Body.camera_on }}"

      - match: "POST /api/system/standby"
        template: api/kestrel-vroom/system-ack.json.gotempl
        doc: { summary: "Set codec standby state", tags: [api, control] }
        example: |
          {"power": "standby"}
        mutations:
          - path: status.device.power
            value: "{{ .Request.Body.power }}"
            enum: ["on", "off", "standby"]

      # A call starts and ends as named occurrences on the live feed
      # (#1145), as a codec's xAPI reports CallSuccessful and CallDisconnect
      # with the call's id, beside the state changes the feed streams: a
      # driver maps each to one event. The id is the caller's to choose, so
      # a test or a demo names the call it places.
      - match: "POST /api/call/dial"
        template: api/kestrel-vroom/system-ack.json.gotempl
        doc: { summary: "Place a call (the room joins a meeting)", tags: [api, control] }
        example: |
          {"id": "c9001", "participants": 3}
        # A dialed call starts now, whatever the lab calendar holds (#2754): a
        # meeting running under it is skipped, and the call runs until it is
        # hung up or for the default length (status.sim.dial_length minutes
        # of call_cycle ticks).
        mutations:
          - { path: status.call.id, value: "{{ .Request.Body.id }}", pattern: "^[A-Za-z0-9-]{1,32}$" }
          - { path: status.call.active, value: true }
          - { path: status.call.participants, value: "{{ or .Request.Body.participants 2 }}", pattern: "^([1-9]|[1-5][0-9]|6[0-4])$" }
          - { path: status.sim.dialed, value: true }
          - { path: status.sim.dial_ticks, value: 0 }
        events:
          - name: call-started
            data: '{"id":"{{ .Request.Body.id }}","participants":{{ or .Request.Body.participants 2 }}}'
          - name: log
            data: '{"severity":"INFO","facility":"kvroom.call","text":"Call started (id={{ .Request.Body.id }}, protocol=sip, peers={{ or .Request.Body.participants 2 }}, dialed)"}'

      - match: "POST /api/call/disconnect"
        template: api/kestrel-vroom/system-ack.json.gotempl
        doc: { summary: "Disconnect active call", tags: [api, control] }
        example: "{}"
        # A hang-up ends the call now, dialed or on the calendar, and the
        # next tick marks the meeting it ended as skipped, so the bar does not
        # join it again; the room's next meeting is joined as it comes.
        mutate:
          status.call.active: false
          status.call.participants: 0
          status.sim.dialed: false
          status.sim.dial_ticks: 0
          status.sim.hungup: true
          status.sim.start_at: 0
          status.sim.end_at: 0
          status.sim.plan_at: 0
        events:
          - name: call-ended
            data: '{"id":"{{ .State | get "status" | get "call" | get "id" }}"}'
          - name: log
            data: '{"severity":"INFO","facility":"kvroom.call","text":"Call ended (id={{ .State | get "status" | get "call" | get "id" }}, reason=local-hangup)"}'

      # Reboot resets uptime and a small set of volatile call/audio
      # state back to declared defaults. HTTP-only now (the SSH/Telnet
      # xAPI reboot verbs that used to alias this list were removed with
      # the CLI interfaces). The anchor is kept so factory-reset and any
      # future surface can reuse it.
      - match: "POST /api/admin/reboot"
        template: api/kestrel-vroom/reboot-ack.json.gotempl
        doc: { summary: "Reboot codec (clears call + uptime)", tags: [api, admin] }
        example: "{}"
        mutations:
          - { path: status.device.boot_epoch, value: "{{ now }}" }
          - { path: status.call.active, value: false }
          - { path: status.call.participants, value: 0 }
          - { path: status.sim.dialed, value: false }
          - { path: status.audio.mic_mute, value: "{{ .Defaults.status.audio.mic_mute }}" }
          - { path: status.audio.volume, value: "{{ .Defaults.status.audio.volume }}" }
          - { path: status.presentation.local_active, value: "{{ .Defaults.status.presentation.local_active }}" }

      - match: "POST /api/admin/factory-reset"
        template: api/kestrel-vroom/factory-reset-ack.json.gotempl
        doc: { summary: "Factory reset (resets every status path to defaults)", tags: [api, admin] }
        example: "{}"
        mutations:
          - { path: status.device.power, value: "{{ .Defaults.status.device.power }}" }
          - { path: status.device.boot_epoch, value: "{{ now }}" }
          - { path: status.call.active, value: "{{ .Defaults.status.call.active }}" }
          - { path: status.call.participants, value: "{{ .Defaults.status.call.participants }}" }
          - { path: status.sim.dialed, value: false }
          - { path: status.audio.volume, value: "{{ .Defaults.status.audio.volume }}" }
          - { path: status.audio.mic_mute, value: "{{ .Defaults.status.audio.mic_mute }}" }
          - { path: status.audio.speaker_level, value: "{{ .Defaults.status.audio.speaker_level }}" }
          - { path: status.video.camera_on, value: "{{ .Defaults.status.video.camera_on }}" }
          - { path: status.video.resolution, value: "{{ .Defaults.status.video.resolution }}" }
          - { path: status.app.mode, value: "{{ .Defaults.status.app.mode }}" }
          - { path: status.app.ucc_signin, value: "{{ .Defaults.status.app.ucc_signin }}" }
          - { path: status.peripherals.touch_pair, value: "{{ .Defaults.status.peripherals.touch_pair }}" }
          - { path: status.presentation.local_active, value: "{{ .Defaults.status.presentation.local_active }}" }

  # The control socket the room's touch panel drives the bar over (#1034):
  # a JSON message per text frame, behind the same basic auth as the web
  # API but its own port. A subscribe is acknowledged and then pushes every
  # change to the subscribed paths; a get or a set is answered by a result
  # carrying the id the request sent, after any push it causes. The console
  # drops every socket by firing POST at drop_path.
  - name: ws-api
    protocol: websocket
    port: 9443
    tls: true
    doc:
      summary: "Kestrel control socket (JSON over a websocket): subscribe, get, set"
      tags: [management, api, control]
    auth:
      type: basic
      default_user: admin
      default_password: kestrel
      realm: "Kestrel VRoom"
      enforce: true
    websocket:
      path: /api/ws
      paths: [status.audio.volume, status.audio.mic_mute, status.call, status.device.power]
      settable: [status.audio.volume, status.audio.mic_mute]
      drop_path: /api/admin/sockets/drop

  - name: icmp
    protocol: icmp
    doc: { summary: "ICMP ping reachability", tags: [monitoring] }

# Read-derived fields, computed on every read rather than written by a
# timer. uptime = now - boot_epoch (seconds). No goroutine, no event.
# boot_epoch is seeded at device start and re-set to "{{ now }}" by the
# reboot / factory-reset routes above.
computed:
  - { path: status.device.uptime, kind: elapsed, since: status.device.boot_epoch }

# The bar talks on its own, off the lab calendar (#2757, #2767): its calls are
# the meetings its room holds (meetingNow), so the scheduling panel, the
# booking service, the meeting platform and the codec beside it all say the
# same thing of one room. One call per
# held meeting (none for a no-show), starting and ending at the first tick on
# or after the meeting does, participants joining and leaving inside it (never
# more than the meeting's actual, from the device's own draws), content shared
# now and then, its call stats drifting and its log stream. A meeting that
# starts as the last one ends moves the call on in one tick (turn). With no
# calendar (a bar in no room, the dev fleet with no world) the bar keeps
# #2754's own schedule, its plan and slot bookkeeping below, exactly as it was. No tick is faster than 15 s
# (#1360's cost rule: richness from more kinds of signal, not more samples),
# and a tick streams only what it changed, so the live feed carries a call's
# transitions, not a heartbeat. A dial (POST /api/call/dial) makes it talk now
# and a hang-up leaves the meeting it ended: the calendar yields to both.
behaviors:
  # One tick a minute reads the calendar once into status.sim.want (the call
  # the room should be in, "c<start>", empty for none) and want_n (who came),
  # and the rest of the tick reads those. status.sim.event names what the tick
  # did (start, end, turn, join, leave, or nothing); the events and log lines
  # read it. The bookkeeping (status.sim) is the simulator's, outside the
  # paths the live feed streams. status.sim.skip is the start of a meeting a
  # dial overtook or a hang-up ended: it is not joined.
  - name: call_cycle
    schedule:
      interval: 60s
    mutations:
      - path: status.sim.participants_prev
        value: '{{ .State.status.call.participants }}'
      - path: status.sim.id_prev
        value: '{{ .State.status.call.id }}'
      # A bar whose room has a calendar follows it; one with none (the dev fleet
      # has no world) keeps #2754's own schedule below, as it always did. Once a
      # calendar has shown itself the bar keeps following it.
      - path: status.sim.cal
        value: '{{ if or .State.status.sim.cal meetingNow meetingNext }}true{{ else }}false{{ end }}'
      - path: status.sim.skip
        value: '{{ $s := .State.status.sim }}{{ $skip := $s.skip }}{{ if or $s.dialed $s.hungup }}{{ with meetingNow }}{{ $skip = .start }}{{ end }}{{ end }}{{ $skip }}'
      - path: status.sim.hungup
        value: 'false'
      - path: status.sim.want
        value: '{{ $skip := .State.status.sim.skip }}{{ with meetingNow }}{{ if and (ne .outcome "no-show") (ne .start $skip) }}c{{ .start }}{{ end }}{{ end }}'
      - path: status.sim.want_n
        value: '{{ $skip := .State.status.sim.skip }}{{ with meetingNow }}{{ if and (ne .outcome "no-show") (ne .start $skip) }}{{ .actual }}{{ else }}0{{ end }}{{ else }}0{{ end }}'
      - path: status.sim.event
        value: '{{ if .State.status.sim.cal }}{{ $s := .State.status.sim }}{{ $n := .State.status.call.participants }}{{ $a := $s.want_n }}{{ if $s.dialed }}{{ $a = 8 }}{{ end }}{{ $move := "" }}{{ if chance 0.08 }}{{ if and (lt $n $a) (gt $n 1) }}{{ if chance 0.5 }}{{ $move = "join" }}{{ else }}{{ $move = "leave" }}{{ end }}{{ else if lt $n $a }}{{ $move = "join" }}{{ else if gt $n 1 }}{{ $move = "leave" }}{{ end }}{{ end }}{{ if .State.status.call.active }}{{ if $s.dialed }}{{ if ge (add $s.dial_ticks 1) $s.dial_length }}end{{ else }}{{ $move }}{{ end }}{{ else if eq $s.want "" }}end{{ else if ne $s.want .State.status.call.id }}turn{{ else }}{{ $move }}{{ end }}{{ else if and (ne $s.want "") (not $s.dialed) }}start{{ end }}{{ else }}{{ $now := now }}{{ $s := .State.status.sim }}{{ $n := .State.status.call.participants }}{{ $move := "" }}{{ if chance 0.08 }}{{ if or (le $n 2) (and (lt $n 8) (chance 0.5)) }}{{ $move = "join" }}{{ else }}{{ $move = "leave" }}{{ end }}{{ end }}{{ if .State.status.call.active }}{{ if $s.dialed }}{{ if ge (add $s.dial_ticks 1) $s.dial_length }}end{{ else }}{{ $move }}{{ end }}{{ else if ge $now $s.end_at }}end{{ else }}{{ $move }}{{ end }}{{ else if and (gt $s.start_at 0) (ge $now $s.start_at) (lt $now $s.end_at) }}start{{ end }}{{ end }}'
      - path: status.sim.dial_ticks
        value: '{{ $s := .State.status.sim }}{{ if and .State.status.call.active $s.dialed (ne $s.event "end") }}{{ add $s.dial_ticks 1 }}{{ else }}0{{ end }}'
      - path: status.sim.dialed
        value: '{{ if eq .State.status.sim.event "end" }}false{{ else }}{{ .State.status.sim.dialed }}{{ end }}'
      - path: status.call.active
        value: '{{ $e := .State.status.sim.event }}{{ if or (eq $e "start") (eq $e "turn") }}true{{ else if eq $e "end" }}false{{ else }}{{ .State.status.call.active }}{{ end }}'
      - path: status.sim.call_seq
        value: '{{ if eq .State.status.sim.event "start" }}{{ add .State.status.sim.call_seq 1 }}{{ else }}{{ .State.status.sim.call_seq }}{{ end }}'
      - path: status.call.id
        value: '{{ $s := .State.status.sim }}{{ $e := $s.event }}{{ if or (eq $e "turn") (and $s.cal (eq $e "start")) }}{{ $s.want }}{{ else if eq $e "start" }}c{{ add 9000 $s.call_seq }}{{ else }}{{ .State.status.call.id }}{{ end }}'
      # A call opens with half to all of who came, then people join and leave
      # inside it, never past who came.
      - path: status.call.participants
        value: '{{ $s := .State.status.sim }}{{ $e := $s.event }}{{ $n := .State.status.call.participants }}{{ if or (eq $e "turn") (and $s.cal (eq $e "start")) }}{{ $lo := 1 }}{{ if gt $s.want_n 2 }}{{ $lo = round 0 (div $s.want_n 2) }}{{ end }}{{ randInt $lo $s.want_n }}{{ else if eq $e "start" }}{{ randInt 2 6 }}{{ else if eq $e "join" }}{{ add $n 1 }}{{ else if eq $e "leave" }}{{ sub $n 1 }}{{ else if eq $e "end" }}0{{ else }}{{ $n }}{{ end }}'
      # The room shares a laptop in a call: through the stretch of the meeting the
      # calendar says (meetingSharing, #2776) in a room with a calendar, now and
      # then from the device's own draws otherwise or in a dialed call.
      - path: status.presentation.local_active
        value: '{{ if .State.status.call.active }}{{ if and hasCalendar (not .State.status.sim.dialed) }}{{ meetingSharing }}{{ else if chance 0.05 }}{{ not .State.status.presentation.local_active }}{{ else }}{{ .State.status.presentation.local_active }}{{ end }}{{ else }}false{{ end }}'
      # A meeting falling due under a dialed call is skipped.
      - path: status.sim.start_at
        value: '{{ $s := .State.status.sim }}{{ if and .State.status.call.active $s.dialed (gt $s.start_at 0) (ge now $s.start_at) }}0{{ else }}{{ $s.start_at }}{{ end }}'
      # Planning: a free room books (or leaves free) its next slot.
      - path: status.sim.plan
        value: '{{ $s := .State.status.sim }}{{ $now := now }}{{ and (not $s.cal) (not .State.status.call.active) (ge $now $s.plan_at) (or (eq $s.start_at 0) (ge $now $s.end_at)) }}'
      - path: status.sim.slot
        value: '{{ if .State.status.sim.plan }}{{ $r := randInt 1 20 }}{{ if le $r 3 }}15{{ else if le $r 12 }}30{{ else }}60{{ end }}{{ else }}{{ .State.status.sim.slot }}{{ end }}'
      - path: status.sim.boundary
        value: '{{ if .State.status.sim.plan }}{{ if eq .State.status.sim.slot 15 }}{{ nextSlot now 15 }}{{ else }}{{ nextSlot now 30 }}{{ end }}{{ else }}{{ .State.status.sim.boundary }}{{ end }}'
      - path: status.sim.booked
        value: '{{ if .State.status.sim.plan }}{{ chance 0.5 }}{{ else }}{{ .State.status.sim.booked }}{{ end }}'
      - path: status.sim.start_at
        value: '{{ $s := .State.status.sim }}{{ if $s.plan }}{{ if $s.booked }}{{ add $s.boundary (mul 60 (randInt -2 5)) }}{{ else }}0{{ end }}{{ else }}{{ $s.start_at }}{{ end }}'
      - path: status.sim.end_at
        value: '{{ $s := .State.status.sim }}{{ if $s.plan }}{{ if $s.booked }}{{ sub (add $s.boundary (mul 60 $s.slot)) (mul 60 (randInt 0 5)) }}{{ else }}0{{ end }}{{ else }}{{ $s.end_at }}{{ end }}'
      - path: status.sim.plan_at
        value: '{{ $s := .State.status.sim }}{{ if $s.plan }}{{ if $s.booked }}0{{ else }}{{ sub (add $s.boundary (mul 60 $s.slot)) 120 }}{{ end }}{{ else }}{{ $s.plan_at }}{{ end }}'
    events:
      - name: call-ended
        data: '{{ $s := .State.status.sim }}{{ if or (eq $s.event "end") (eq $s.event "turn") }}{"id":"{{ $s.id_prev }}","participants":{{ $s.participants_prev }}}{{ end }}'
      # The codec's log stream (event: log): one line per occurrence, its
      # severity, facility and text as the bar's own log writes them.
      - name: log
        data: '{{ $s := .State.status.sim }}{{ if or (eq $s.event "end") (eq $s.event "turn") }}{"severity":"INFO","facility":"kvroom.call","text":"Call ended (id={{ $s.id_prev }}, peers={{ $s.participants_prev }}, reason=remote-hangup)"}{{ end }}'
      - name: call-started
        data: '{{ $e := .State.status.sim.event }}{{ if or (eq $e "start") (eq $e "turn") }}{"id":"{{ .State.status.call.id }}","participants":{{ .State.status.call.participants }}}{{ end }}'
      - name: participant-joined
        data: '{{ if eq .State.status.sim.event "join" }}{"call_id":"{{ .State.status.call.id }}","participant":"guest-{{ .State.status.call.participants }}","participants":{{ .State.status.call.participants }}}{{ end }}'
      - name: participant-left
        data: '{{ if eq .State.status.sim.event "leave" }}{"call_id":"{{ .State.status.call.id }}","participant":"guest-{{ .State.status.sim.participants_prev }}","participants":{{ .State.status.call.participants }}}{{ end }}'
      - name: log
        data: '{{ $e := .State.status.sim.event }}{{ $n := .State.status.call.participants }}{{ $id := .State.status.call.id }}{{ if or (eq $e "start") (eq $e "turn") }}{"severity":"INFO","facility":"kvroom.call","text":"Call started (id={{ $id }}, protocol=sip, peers={{ $n }})"}{{ else if eq $e "join" }}{"severity":"INFO","facility":"kvroom.call","text":"Participant joined (call={{ $id }}, peers={{ $n }})"}{{ else if eq $e "leave" }}{"severity":"INFO","facility":"kvroom.call","text":"Participant left (call={{ $id }}, peers={{ $n }})"}{{ end }}'

  # A status line every 15 minutes, call or none, so the log stream is not
  # only a call's.
  - name: status_log
    schedule:
      interval: 15m
    events:
      - name: log
        data: '{"severity":"INFO","facility":"kvroom.system","text":"Status: power={{ .State.status.device.power }}, call={{ if .State.status.call.active }}active{{ else }}idle{{ end }}, cpu={{ .State.status.device.cpu_load }}%, temp={{ .State.status.device.temperature }}C, fan={{ .State.status.device.fan_rpm }}rpm"}'

  # The call stats, every 30 s: the media a call carries drifts while one
  # is up and rests at zero when the room is idle; the codec's own load,
  # temperature, fan and memory drift either way (busier in a call). A
  # lossy stretch writes the WARN line a real bar's network log does, and
  # its recovery an INFO line.
  - name: media_stats
    schedule:
      interval: 30s
    mutations:
      - path: status.media.packet_loss
        value: '{{ if .State.status.call.active }}{{ round 4 (clamp 0.0 0.06 (randStep 0.012 .State.status.media.packet_loss)) }}{{ else }}0{{ end }}'
      # The uplink's state, with hysteresis: degraded as loss crosses 3%,
      # recovered once it is back under 2%, so its log lines are its
      # transitions, not a line a tick.
      - path: status.sim.net_event
        value: '{{ $l := clamp 0.0 1.0 .State.status.media.packet_loss }}{{ $was := .State.status.sim.uplink_degraded }}{{ if and (gt $l 0.03) (not $was) }}degraded{{ else if and (le $l 0.02) $was }}recovered{{ end }}'
      - path: status.sim.uplink_degraded
        value: '{{ $e := .State.status.sim.net_event }}{{ if eq $e "degraded" }}true{{ else if eq $e "recovered" }}false{{ else }}{{ .State.status.sim.uplink_degraded }}{{ end }}'
      - path: status.media.jitter_ms
        value: '{{ if .State.status.call.active }}{{ round 1 (clamp 2.0 45.0 (randStep 6.0 .State.status.media.jitter_ms)) }}{{ else }}0{{ end }}'
      - path: status.media.bitrate_kbps
        value: '{{ if .State.status.call.active }}{{ round 0 (clamp 1200.0 4000.0 (randStep 400.0 .State.status.media.bitrate_kbps)) }}{{ else }}0{{ end }}'
      - path: status.media.frame_rate
        value: '{{ if .State.status.call.active }}{{ round 0 (clamp 24.0 30.0 (randStep 3.0 .State.status.media.frame_rate)) }}{{ else }}0{{ end }}'
      - path: status.audio.speaker_level
        value: '{{ if .State.status.call.active }}{{ round 0 (clamp 10.0 85.0 (randStep 15.0 .State.status.audio.speaker_level)) }}{{ else }}0{{ end }}'
      # The microphones' input level, in dBFS: a talking room in a call, a
      # quiet one's -60 when idle.
      - path: status.audio.mic_level_db
        value: '{{ if .State.status.call.active }}{{ round 1 (clamp -50.0 -6.0 (randStep 6.0 .State.status.audio.mic_level_db)) }}{{ else }}-60{{ end }}'
      - path: status.device.cpu_load
        value: '{{ if .State.status.call.active }}{{ round 0 (clamp 35.0 80.0 (randStep 8.0 .State.status.device.cpu_load)) }}{{ else }}{{ round 0 (clamp 8.0 25.0 (randStep 4.0 .State.status.device.cpu_load)) }}{{ end }}'
      - path: status.device.temperature
        value: '{{ round 1 (clamp 38.0 62.0 (randStep 1.5 .State.status.device.temperature)) }}'
      - path: status.device.fan_rpm
        value: '{{ round -1 (clamp 1800.0 3600.0 (randStep 150.0 .State.status.device.fan_rpm)) }}'
      - path: status.device.memory_used
        value: '{{ round 3 (clamp 0.35 0.7 (randStep 0.03 .State.status.device.memory_used)) }}'
    events:
      - name: log
        data: '{{ $e := .State.status.sim.net_event }}{{ $loss := printf "%.1f" (mul 100.0 (clamp 0.0 1.0 .State.status.media.packet_loss)) }}{{ if eq $e "degraded" }}{"severity":"WARN","facility":"kvroom.net","text":"Uplink degraded: packet loss {{ $loss }}%, jitter {{ .State.status.media.jitter_ms }}ms, enabling rate adaptation"}{{ else if eq $e "recovered" }}{"severity":"INFO","facility":"kvroom.net","text":"Uplink recovered: loss {{ $loss }}%, jitter {{ .State.status.media.jitter_ms }}ms, resumed full-rate send"}{{ end }}'

defaults:
  status:
    device:
      power: "on"
      # Anchor for the computed uptime field. 0 means "unset", seeded
      # to the device's start time on load.
      boot_epoch: 0
      # The codec's own load (percent), temperature (C), fan (rpm) and
      # memory in use (a fraction), drifted by media_stats.
      cpu_load: 14
      temperature: 44.0
      fan_rpm: 2400
      memory_used: 0.42
    # ---- Course datapoints (HTTP-only teaching surface) ----
    app:
      # UCC platform the bar is currently hosting.
      mode: "ucc"
      # Signed-in UCC account, or "" when signed out. Templated per room
      # by the fleet compiler ({site}/{building}/{room}), a shared
      # profile must not bake one room's account onto every video bar.
      ucc_signin: "room-{site}-{building}-{room}@shinra.lan"
    peripherals:
      # Paired touch controller (newtron panel) hostname, or "" when
      # unpaired. Resolved to the actual newtron panel in THIS room by the
      # compiler; the panel's hostname suffix is system-specific (TP1 vs
      # touch-panel1), so it's looked up across devices rather than guessed.
      touch_pair: "{room-device:newtron-panel-7}"
    presentation:
      # Local (HDMI/USB-C) presentation active vs idle.
      local_active: false
    logs:
      # Recent device log lines, surfaced over the PRIVATE /api/logs
      # route. The web admin "Recent logs" card fetches this from client
      # JS (the network-tab breadcrumb); the student then calls
      # GET /api/logs directly. Realistic codec-style lines, generic
      # room id (no real hostnames), mix of INFO and WARN.
      recent:
        - "2026-06-13T08:41:02Z INFO  kvroom.app      UCC client signed in (account=room-vc@example.lan, tenant=teams)"
        - "2026-06-13T08:41:05Z INFO  kvroom.pairing  Touch controller paired (model=newtron-panel-7, link=usb-c)"
        - "2026-06-13T09:02:17Z INFO  kvroom.call     Call started (id=c8821, protocol=sip, peers=3)"
        - "2026-06-13T09:14:53Z WARN  kvroom.net      Uplink degraded: packet loss 4.1%, jitter 38ms, enabling rate adaptation"
        - "2026-06-13T09:15:41Z INFO  kvroom.net      Uplink recovered: loss 0.0%, jitter 6ms, resumed 1080p send"
        - "2026-06-13T09:31:08Z WARN  kvroom.audio    Microphone array muted by far-end host during active call"
        - "2026-06-13T09:58:22Z INFO  kvroom.call     Call ended (id=c8821, duration=3365s, reason=local-hangup)"
        - "2026-06-13T10:03:49Z INFO  kvroom.system   Returned to standby after idle timeout (600s)"
    # ---- Codec device state (HTTP control, not course-monitored) ----
    call:
      active: false
      participants: 0
      # The id of the call in progress, or the last one (#1145).
      id: ""
    audio:
      volume: 50
      mic_mute: false
      speaker_level: 50
      # The microphone array's input level, dBFS (media_stats drifts it).
      mic_level_db: -60
    video:
      camera_on: true
      resolution: "3840x2160"
    # The media a call carries (#2754), drifted by media_stats while a call
    # is up and zero when idle: packet loss a ratio (0 to 1), jitter in ms,
    # the send bitrate in kbps and the frame rate.
    media:
      packet_loss: 0
      jitter_ms: 0
      bitrate_kbps: 0
      frame_rate: 0
    # The call cycle's bookkeeping: what this tick did, the call the room's
    # meeting says it should be in and how many came (read off the lab
    # calendar, empty and 0 for none), the start of a meeting a dial overtook
    # or a hang-up ended (skipped), a hang-up waiting for the next tick, a
    # dialed call and its length, and the id and count before this tick. The
    # simulator's, not the codec's: no template serves it.
    sim:
      event: ""
      cal: false
      want: ""
      want_n: 0
      skip: 0
      hungup: false
      plan: false
      slot: 30
      boundary: 0
      booked: false
      start_at: 0
      end_at: 0
      plan_at: 0
      call_seq: 0
      dialed: false
      dial_ticks: 0
      dial_length: 30
      id_prev: ""
      participants_prev: 0
      net_event: ""
      uplink_degraded: false
    network:
      ipv4:
        address: ""
        mac: ""
  configuration:
    device:
      serial: ""
      model: "VRoom"
      manufacturer: "Kestrel"
      hardware_revision: "B2"
    firmware:
      version: "2.7.3"
    network:
      hostname: ""
