# yaml-language-server: $schema=schema.json
# Lyra HX-1, Wireless Microphone System
#
# Lyra is the lab's fictional microphone vendor. The HX-1 is a wireless
# handheld microphone and its networked receiver; the receiver is what
# is on the network, reporting the transmitter it hears. Beside mute and
# level, an operator watches its battery: a wireless mic that dies mid
# lecture is the call the help desk gets.
#
# It reads its room's meeting off the lab calendar (#2774): the pack
# transmits while the room is in use, and its battery is a pure function of
# the calendar, draining in use and recharging between meetings, so the
# charge reads the same at any instant on any run (battery_drain). Noise:
# the level's walk and which moment a mute toggles.

name: lyra-hx-1
manufacturer: Lyra
model: "HX-1"
device_type: wireless-mic
slug_prefix: wireless-mic

doc:
  summary: "Lyra HX-1, wireless microphone system"
  description: |
    Monitored over SNMP on the Lyra enterprise arc (mute, the input
    level, and the transmitter's battery charge); muted and unmuted over
    a small HTTP API behind the Lyra header key.

interfaces:
  - name: http-api
    protocol: http
    port: 80
    doc: { summary: "Lyra control API", tags: [management, api] }
    auth:
      type: header
      header: "X-Lyra-Key"
      api_key: "lyra-lab-key"
      enforce: true
    api_surface: lyra-mic
    routes:
      - match: "GET /api/status"
        template: api/lyra-mic/status.json.gotempl
        doc: { summary: "Microphone identity and state", tags: [api, status] }

      - match: "POST /api/mute"
        template: api/lyra-mic/mute-ack.json.gotempl
        doc: { summary: "Mute or unmute the microphone", tags: [api, control] }
        example: |
          {"mute": true}
        mutations:
          - path: status.mic.mute
            value: "{{ .Request.Body.mute }}"
            enum: ["true", "false"]

  - name: snmp
    protocol: snmp
    port: 161
    doc: { summary: "SNMP monitoring", tags: [monitoring] }
    api_surface: lyra-mic
    auth:
      community: "public"
      refused_community: "revoked"
    # The Lyra arc, 1.3.6.1.4.1.55530: the microphone at .1 (mute, the
    # input level in dBFS), the wireless link at .2, identity at .5.
    oid_map:
      configuration.device.model:     "1.3.6.1.2.1.1.1.0"   # sysDescr
      status.device.uptime:           "1.3.6.1.2.1.1.3.0"
      status.mic.mute:                "1.3.6.1.4.1.55530.1.1.0"
      status.mic.level_db:            "1.3.6.1.4.1.55530.1.2.0"
      status.mic.battery_percent:     "1.3.6.1.4.1.55530.2.1.0"
      configuration.firmware.version: "1.3.6.1.4.1.55530.5.1.0"
      configuration.device.serial:    "1.3.6.1.4.1.55530.5.2.0"

  - name: icmp
    protocol: icmp
    doc: { summary: "ICMP ping reachability", tags: [monitoring] }

computed:
  - { path: status.device.uptime, kind: elapsed, since: status.device.boot_epoch }

# With a calendar for its room, the mic follows the room's meeting (#2774),
# read through the device clock; with none it drifts as it always has. It is it is transmitting while someone is in the room (a
# no-show holds its slot with nobody in it, so the room is not in use), and
# idle between meetings. Mute moves now and then inside a call, a draw of the
# device's own, and is left as it is between meetings, so a mute an operator
# sets (POST /api/mute) holds until the next call; whether the room is in use
# is the calendar's.
behaviors:
  - name: call_state
    schedule:
      interval: 15s
    mutations:
      - path: status.mic.transmitting
        value: '{{ if not hasCalendar }}{{ .State.status.mic.transmitting }}{{ else }}{{ with meetingNow }}{{ gt .actual 0 }}{{ else }}false{{ end }}{{ end }}'
      - path: status.mic.mute
        value: '{{ $m := eq (print .State.status.mic.mute) "true" }}{{ if not hasCalendar }}{{ $m }}{{ else }}{{ with meetingNow }}{{ if gt .actual 0 }}{{ if chance 0.06 }}{{ not $m }}{{ else }}{{ $m }}{{ end }}{{ else }}{{ $m }}{{ end }}{{ else }}{{ $m }}{{ end }}{{ end }}'

  # The input level rides speech where it hears: it walks within a talker's
  # range while the room is in use and the mic open, and sits at its noise
  # floor otherwise, a behavior a scenario can still drive.
  - name: level_drift
    schedule:
      interval: 15s
    mutations:
      - path: status.mic.level_db
        value: '{{ if not hasCalendar }}{{ round 1 (clamp -70.0 -20.0 (randStep 4.0 .State.status.mic.level_db)) }}{{ else }}{{ $v := round 3 .State.status.mic.level_db }}{{ $open := false }}{{ with meetingNow }}{{ if gt .actual 0 }}{{ $open = not (eq (print $.State.status.mic.mute) "true") }}{{ end }}{{ end }}{{ if $open }}{{ if lt $v -55.0 }}{{ $v = -40.0 }}{{ end }}{{ round 1 (clamp -55.0 -20.0 (randStep 4.0 $v)) }}{{ else }}{{ round 1 (clamp -72.0 -66.0 (randStep 1.5 -69.0)) }}{{ end }}{{ end }}'

  # The transmitter's battery. Without a calendar it drains a tenth of a
  # percent a minute, as it always has. With one it is the calendar's, not a
  # walk: it drains in use (0.4 percent a minute, about four hours from full)
  # and recharges on its dock between meetings (0.8 percent a minute, about
  # two hours from empty). Each tick it is computed over the 48 hours before
  # now, full at the start of that window, from the room's meetings alone, so
  # the charge at an instant is the same on every run and for every device of
  # the room, with nothing accumulated in the device. A no-show drains
  # nothing. A scenario pins this path to make a pack die (#2769).
  - name: battery_drain
    schedule:
      interval: 60s
    mutations:
      - path: status.mic.battery_percent
        value: >-
          {{- if not hasCalendar -}}{{- round 1 (clamp 0.0 100.0 (sub .State.status.mic.battery_percent 0.1)) -}}{{- else -}}
          {{- $t1 := now -}}{{- $t0 := sub $t1 172800 -}}{{- $cur := $t0 -}}{{- $lvl := 100.0 -}}
          {{- $drain := div 0.4 60.0 -}}{{- $charge := div 0.8 60.0 -}}
          {{- range meetingsBetween $t0 $t1 -}}
          {{- if gt .actual 0 -}}
          {{- $s := .start -}}{{- if lt $s $cur -}}{{- $s = $cur -}}{{- end -}}
          {{- $e := .end -}}{{- if gt $e $t1 -}}{{- $e = $t1 -}}{{- end -}}
          {{- if gt $e $s -}}
          {{- $lvl = clamp 0.0 100.0 (add $lvl (mul $charge (sub $s $cur))) -}}
          {{- $lvl = clamp 0.0 100.0 (sub $lvl (mul $drain (sub $e $s))) -}}
          {{- $cur = $e -}}
          {{- end -}}{{- end -}}{{- end -}}
          {{- round 1 (clamp 0.0 100.0 (add $lvl (mul $charge (sub $t1 $cur)))) -}}{{- end -}}

defaults:
  status:
    device:
      boot_epoch: 0
    mic:
      mute: false
      level_db: -42
      transmitting: false
      battery_percent: 78.0
    network:
      ipv4:
        address: ""
        mac: ""
  configuration:
    device:
      serial: ""
      model: "HX-1"
      manufacturer: "Lyra"
    firmware:
      version: "1.4.2"
    network:
      hostname: ""
