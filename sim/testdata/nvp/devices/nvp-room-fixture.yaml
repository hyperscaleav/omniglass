# A fixture, not a catalog entry: the NVP faces of the Newtron Panel 7 YAML
# profile as they were before the panel became a Go family (#2833), with the
# nvp-room surface beside it (surfaces/nvp-room.yaml, unchanged). The surface
# parity tests (sim/surface_parity_test.go) serve this declaration and the Go
# one through the same protocol server and compare the bytes.
name: nvp-room-fixture
manufacturer: Newtron
model: "Panel 7"
device_type: touchpanel

interfaces:
  - name: nvp
    protocol: tcp
    port: 51325
    api_surface: newtron-nvp
    persistent: true
    line_ending: "\r\n"
    include: [nvp-room]

  - name: nvp-tls
    protocol: tcp
    port: 51326
    tls: true
    tls_validity_days: 397
    api_surface: newtron-nvp
    persistent: true
    line_ending: "\r\n"
    subjects:
      - match: "status.video.input"
        path: "status.video.input"
        publish_token: "INPUT"
        push_format: "EVT INPUT {{ .Raw }}"

defaults:
  status:
    video: { input: "hdmi1" }
    room: { scene: "idle" }
    diagnostics: { log: "" }
