# Open a page you may not read (#2442): a person with read-only access signs in,
# sees Settings is not in their sidebar, and opening it by address says so: which
# section, the permission it takes, and the way back to Home and Profile, instead
# of a spinner or a silent bounce to Home. The server refuses regardless; the
# console only explains.
#
# It signs in as the lab's single sign-on demo person, Avery Quinn, a viewer
# (internal/lab/sso.go), the same way sign-in-with-sso does.
title: Open a page you may not read
description: As a read-only person, open Settings by address and read why it is closed, what permission opens it, and the way back.
lab: [sso]
steps:
  - goto: /login
    caption: A read-only person signs in through the organization's identity provider.
  - click: { role: button, name: Sign in with SSO }
    caption: Sign in with SSO sends the browser to the identity provider.
  - wait: { selector: '#login' }
    caption: The provider's own login form.
  - type: { target: '#login', text: avery@example.com }
    caption: Sign in as the person you are at the provider.
  - type: { target: '#password', text: lab-demo-password }
    caption: The provider checks the password.
  - click: '#submit-login'
    caption: It sends the browser back to Omniglass.
  - wait: { text: Avery Quinn, exact: true }
    caption: Signed in as a viewer. Settings is not offered in the sidebar.
  - goto: /settings
    caption: Opening Settings by its address anyway.
  - wait: { text: You do not have access to Settings }
    caption: The page says so, and names the permission that opens it.
  - wait: { selector: '[data-testid=denied-needs]' }
    caption: Settings takes settings:read. Home and Profile, where your own access is listed, are one click away.
    poster: true
