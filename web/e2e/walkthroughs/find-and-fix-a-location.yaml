# Find a location and fix it (#927): drill Explore to a location, open the system it
# holds, give the place the label the site uses, and see the label follow.
title: Find a location and fix its label
description: Drill Explore down to a location, open the system it holds, and rename the location from Configure. The new label follows everywhere the location is read.
steps:
  - goto: /explore
    caption: Explore is the outline of every location in the fleet, with what each one holds.
  - click: { role: button, name: Expand Service Depot }
    caption: Open a building. Each location inside reads its type, and the standard its system is built to.
  - click: { role: treeitem, name: Bay 3 }
    caption: Bay 3 holds one system, so opening the location opens that system.
  - wait: { role: dialog, name: Bay 3 }
    caption: The system's panel names the place it sits in, above its own facts.
  - click: { role: button, name: Expand, exact: true }
    caption: Expand the panel to the system's full view.
  - wait: { selector: '[data-testid="page-header"]:has(h1:text-is("Bay 3"))' }
    caption: A location holding one system has no page of its own. The system's view is titled by it, with the location as a card below.
  - click: { role: tab, name: Configure }
    caption: Configure holds the location's form first, then the system's.
  - click: '[data-testid="configure-face-location"] >> role=button[name="Edit"]'
    caption: Edit the location, apart from its system. Its label was rendered by a label rule from its name.
  - click: '[data-testid="configure-face-location"] >> role=textbox[name="Label"]'
    caption: Click the label to take it over from the rule.
  - wait: { text: Labelled by you. }
    caption: The label is yours now; the rule no longer rewrites it.
  - type: { target: '[data-testid="configure-face-location"] >> role=textbox[name="Label"]', text: ' Loading Dock' }
    caption: Say what the site calls it, so operators find it by that word.
  - click: '[data-testid="configure-face-location"] >> role=button[name="Save changes"]'
    caption: Save the location.
  - click: { role: tab, name: Overview }
    caption: Saved. Back on the system's overview, its title already reads the new label.
  - click: '[data-testid="breadcrumb"] >> role=link[name="Explore" s]'
    caption: Back to Explore, opened down to the location you were on.
  - wait: { role: treeitem, name: Bay 3 Loading Dock }
    caption: The outline reads the new label too. One location, one label, wherever it is read.
    hold: 1500
    poster: true
