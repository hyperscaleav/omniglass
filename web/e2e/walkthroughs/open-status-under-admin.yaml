# Nodes and Platform health's sidebar doors (#1767). Both are administration:
# enrolling a node is an admin's job, and whether Omniglass itself is well is
# read off the platform's own components. So both sit under Admin, Platform
# health as Status, one word like every other tab, both behind node:read.
title: Open Nodes and Status from Admin
description: From Home, find Nodes and Status under Admin in the sidebar, open Nodes where a new node is set up, then open Status and read the build the server runs.
steps:
  - goto: /
    caption: The sidebar's Admin group holds the platform's administration, Nodes and Status among it.
    hold: 1500
  - click: 'aside a[href$="/nodes"]'
    caption: Open Nodes under Admin.
  - wait: { text: New node }
    caption: The collection nodes, and New node, where an admin sets one up.
    hold: 1500
  - click: 'aside a[href$="/platform"]'
    caption: Open Status under Admin.
  - wait: { selector: '[data-testid=platform-version]' }
    caption: Platform health, the build and uptime read off the platform's own components. The top bar reads Status.
    poster: true
    hold: 2000
