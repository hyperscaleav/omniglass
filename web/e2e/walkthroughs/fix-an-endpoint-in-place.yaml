# Fix an endpoint in place (#1061): a driver attached with the wrong port
# collects nothing; its port is edited on the endpoint itself, validated
# against the driver's inputs, and samples arrive with no re-attach. The
# walkthrough stack places bay-2-display (a Boreal Edge 55 in Bay 2, SNMP on
# 127.60.9.9) with no endpoint (web/e2e/lib/stack.sh), as set-up-monitoring
# uses it; the node edge-hq checks in every 2s, so the fix lands within a tick.
title: Fix an endpoint in place
description: Attach the SNMP driver on the wrong port, see nothing collected, then edit the port on the endpoint itself and watch samples arrive, with no re-attach.
steps:
  - goto: /components/bay-2-display?tab=configure
    caption: A display mounted in Bay 2, with no endpoint yet.
  - click: { role: button, name: Add endpoint }
    caption: Add an endpoint, the way a node reaches the display.
  - click: { role: tab, name: Attach a driver }
    caption: Attach the SNMP driver.
  - select: { target: '#new-iface-driver', value: snmp-generic }
    caption: The SNMP driver reads the uptime any agent reports.
  - type: { target: '#new-iface-input-host', text: 127.60.9.9 }
    caption: The host is the display's address.
  - type: { target: '#new-iface-input-port', text: '1161' }
    caption: A port typed wrong, the mistake this walkthrough fixes.
  - type: { target: '#new-iface-input-community', text: sim-community }
    caption: The community is a secret's name, never its value.
  - select: { target: '#new-iface-node', value: edge-hq }
    caption: The node edge-hq collects it.
  - click: { role: button, name: Attach driver }
    caption: Attach it. Nothing answers on that port, so nothing is collected.
  - press: Escape
    caption: Close it.
  - click: { role: button, name: Manage snmp }
    caption: Open the endpoint itself.
  - click: 'button:has-text("Edit") >> nth=-1'
    caption: Its inputs edit in place, the same ones the attach asked for.
  - click: '#edit-iface-input-port'
    caption: The port it was attached with.
  - press: Control+A
    caption: Select it.
  - press: Backspace
    caption: Clear it.
  - type: { target: '#edit-iface-input-port', text: '161' }
    caption: Correct the port. The driver checks the value, and the address it derives moves with it.
  - click: 'button:has-text("Save") >> nth=-1'
    caption: Save. The node reconnects on the new address at its next check-in, with no re-attach.
  - wait: { selector: 'text=127.60.9.9:161', timeout: 10000 }
    caption: The endpoint's target now reads the corrected port.
  - press: Escape
    caption: Close it.
  - click: { role: tab, name: Overview }
    caption: Overview reads the display as it is collected.
  - wait: { selector: '[data-testid="leaf-vitals"]:has-text("Uptime")', timeout: 20000 }
    caption: Samples arrived. The uptime the display reports now lands.
    poster: true
