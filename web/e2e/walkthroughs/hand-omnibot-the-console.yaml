# Handing omnibot the console (#2122): Ctrl-J hands it the page, an alt-click
# on a stamped row gathers that row into its tray, and a gathered alarm takes a
# one-click Triage. What lands in the tray is a reference, never what the
# console rendered. The walkthrough stops short of running triage: the lab's
# omnibot replay covers only its tag prompt.
title: Hand omnibot the console
description: Hand omnibot the page with Ctrl-J, alt-click an alarm into its tray, and see the one-click Triage beside it.
steps:
  - goto: /systems/auditorium
    caption: A system page. Omnibot can read all of this through its tools, under your grants, once you say what you mean.
  - press: Control+j
    caption: Ctrl-J (or Cmd-J) hands omnibot the page you are on and opens it.
  - wait: { selector: 'button[aria-label^="Remove page"]' }
    caption: The tray holds the page as its route and query, a reference omnibot looks up, not what the screen shows.
    hold: 1500
  - click: { role: button, name: Close, exact: true }
    caption: Close omnibot. The tray keeps what you gathered for your next prompt.
  - click: '[data-testid=alarm-strip] button'
    caption: Open why the auditorium is alarming.
  - wait: { selector: '[data-testid=blade-why] [data-subject-kind="alarm"]' }
    caption: Every alarm row carries a subject stamp, its component and the rule or time that raised it.
  - click: '[data-testid=blade-why] [data-subject-kind="alarm"] [data-severity]'
    modifiers: [Alt]
    caption: Alt-click the alarm to gather it. Shift-alt-click gathers a range of rows.
  - wait: { selector: 'button[aria-label^="Triage alarm"]' }
    caption: Omnibot opens over the blade with the alarm beside the page, and a gathered alarm takes a one-click Triage.
    hold: 2000
