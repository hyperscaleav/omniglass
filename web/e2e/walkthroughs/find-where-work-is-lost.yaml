# Where work is lost (#1646): Platform health draws the path a sample takes
# from its run to the store as the hops the view serves, each read from the
# same three delivery keys, so one rule (the share of what a hop took in that
# it did not hand on) reads every hop. The walkthrough reads the path at 0,
# opens the ingest hop's explainer, then breaks a simulated panel: the outage
# lands on the panel's own component (it reads down, and its due polls are
# held there), and every hop still reads 0, because a device that does not
# answer is a fact the outpost collects, not work the platform lost. The wait
# is on the panel reading down, not on a poll failure count: once the probe
# reads the panel unreachable its polls are held, never run, so a failure
# lands only when a poll happened to be in flight as it went dark, which is
# chance. Last it follows the outpost's row in the outpost hop to its
# component, where each delivery series lives.
#
# The figures are a report window's (collection.report_seconds); a
# walkthrough lab's seed sets it to 10s, so the first wait allows for that
# first window to land.
title: Find where work is lost
description: Read the platform's pipeline hop by hop at 0, open a hop's explainer, break a simulated panel and watch the outage land on the panel while the outpost hop stays at 0, then follow a component's row to its delivery series.
steps:
  - goto: /platform?open=pipeline
    caption: Platform health draws the path a sample takes from its run to the store, one hop at a time.
  - wait: { selector: '[data-testid=pipeline]:has([data-testid=pipeline-hop-outpost] [data-testid=hop-loss]:text-is("0%")):has([data-testid=pipeline-hop-ingest] [data-testid=hop-loss]:text-is("0%"))', timeout: 30000 }
    caption: Each hop shows what it took in, what it handed on, and the share it lost. 0% is healthy.
    hold: 500
  - click: '[data-testid=pipeline-hop-ingest]'
    caption: Open the ingest hop. It says what counts as lost there, the keys it is read from, and the server component that records it.
  - wait: { selector: '[data-testid=pipeline-hop-detail]' }
    caption: Every hop is read from the same three keys, one series per kind, so one rule reads them all.
    hold: 1000
  - goto: /components/panel-2
    caption: Touch Panel 2 is simulated, so it can be broken on purpose.
  - click: { role: button, name: Open simulation }
    caption: Open its simulation.
  - click: { role: tab, name: Impairments }
    caption: Impairments are set on their own tab.
  - click: '#sim-unplugged'
    caption: Unplug it. It goes dark, so nothing can reach it.
  - click: { role: button, name: Save impairment }
    caption: Save. The simulator applies it on its next pull.
  - press: Escape
    caption: Close the simulation.
  - wait: { selector: 'li:has([data-testid=collection-tcp]:text-is("component reports down"))', timeout: 30000 }
    caption: The outage lands on the panel's own component. It reads down, and its polls are held, not run.
  - goto: /platform?open=pipeline
    caption: Back on Platform health, Where work is lost still open.
  - wait: { selector: '[data-testid=pipeline]:has([data-testid=pipeline-hop-outpost] [data-testid=hop-loss]:text-is("0%")):has([data-testid=pipeline-hop-ingest] [data-testid=hop-loss]:text-is("0%"))' }
    caption: Every hop still reads 0%. A device that did not answer is not work the platform dropped. A hop that does lose a share is tinted, so it stands out.
    poster: true
    hold: 1000
  - click: '[data-testid=pipeline-hop-outpost]'
    caption: Open the outpost hop. Each outpost's own share is a row.
  - click: '[data-testid=pipeline-hop-detail] [data-testid^=pipeline-component-] a'
    caption: Follow the outpost's row to its platform component.
  - wait: { selector: '[data-testid=vital-delivery-loss-ratio]' }
    caption: The outpost's delivery series live on its component, one per kind, like any other metric.
    hold: 1000
