# Delete what you made, from the console alone (#2463). The setup makes a
# pop-up site off camera: a location, and a component placed in it that owns one
# endpoint. The delete is refused while the endpoint still depends on the row, and
# the confirm names what is in the way, with its own Delete, so the cleanup never
# leaves the dialog. The site's own refusal is its own walkthrough,
# delete-a-location-that-holds-a-system, which shares this site (a create that
# already exists counts as made, so either runs first): the two together ran past
# the 60 second budget (#2813), and a demo that will not fit is two demos.
title: Delete what you made
description: Delete a component that still owns an endpoint, clearing the endpoint from the same confirm dialog.
setup:
  - post: /locations
    body: { name: pop-up-site, label: Pop-up site, location_type: campus }
  - post: /components
    body: { name: pop-up-display, label: Pop-up display, product: generic-device, location: pop-up-site }
  - post: /endpoints
    body: { transport: icmp, component: pop-up-display }
steps:
  - goto: /components/pop-up-display?tab=configure
    caption: A display made for a pop-up event. Its Configure tab holds Delete, behind its own permission.
  - click: '[data-testid="tab-rail"] >> role=button[name="More actions"]'
    caption: Delete sits in the actions menu at the right of the tab rail.
  - click: 'role=button[name="Delete"s]'
    caption: Delete it.
  - click: '[role=alertdialog] footer >> role=button[name="Delete component"]'
    caption: The console's one confirm names the thing and says what goes with it. The red button carries the verb.
  - wait: { selector: '[data-testid="delete-blockers"]' }
    caption: Refused. The component still owns an endpoint, and the refusal names it rather than counting it.
    hold: 1500
  - click: '[data-testid="delete-blockers"] >> role=button[name=/^Delete endpoint/]'
    caption: Each blocker has its own Delete. It asks once more on the row.
  - click: '[data-testid="delete-blockers"] >> role=button[name=/^Confirm delete endpoint/]'
    caption: The endpoint goes by its own delete, under its own permission.
  - wait: { selector: '[data-testid="delete-blockers"]:has-text("Nothing left in the way")' }
    caption: Nothing is left in the way.
  - click: '[role=alertdialog] footer >> role=button[name="Delete component"]'
    caption: Try again, from the same dialog.
  - wait: { role: tree, name: Locations }
    caption: The component is gone, and nothing needed the API. The page leaves for Explore.
    hold: 1500
    poster: true
