# Delete what you made, from the console alone (#2463). The setup makes a
# pop-up site off camera: a location, a system placed in it, and a component
# placed in it that owns one endpoint. Each delete is refused while something
# still depends on the row, and the confirm names what is in the way, each
# with its own Delete, so the cleanup never leaves the dialog.
title: Delete what you made
description: Delete a component that still owns an endpoint, then the location that still holds a system, clearing each one's blockers from the same confirm dialog.
setup:
  - post: /locations
    body: { name: pop-up-site, label: Pop-up site, location_type: campus }
  - post: /systems
    body: { name: pop-up-kiosk, label: Pop-up kiosk, location: pop-up-site }
  - post: /components
    body: { name: pop-up-display, label: Pop-up display, product: generic-device, location: pop-up-site }
  - post: /endpoints
    body: { transport: icmp, component: pop-up-display }
steps:
  - goto: /components/pop-up-display?tab=configure
    caption: A display made for a pop-up event. Its Configure tab holds Delete, behind its own permission.
  - click: '[data-testid="tab-rail"] >> role=button[name="More actions"]'
    caption: Delete sits in the actions menu at the right of the tab rail.
  - click: 'role=button[name="Delete"s]'
    caption: Delete it.
  - click: '[role=alertdialog] footer >> role=button[name="Delete component"]'
    caption: The console's one confirm names the thing and says what goes with it. The red button carries the verb.
  - wait: { selector: '[data-testid="delete-blockers"]' }
    caption: Refused. The component still owns an endpoint, and the refusal names it rather than counting it.
    hold: 1500
  - click: '[data-testid="delete-blockers"] >> role=button[name=/^Delete endpoint/]'
    caption: Each blocker has its own Delete. It asks once more on the row.
  - click: '[data-testid="delete-blockers"] >> role=button[name=/^Confirm delete endpoint/]'
    caption: The endpoint goes by its own delete, under its own permission.
  - wait: { selector: '[data-testid="delete-blockers"]:has-text("Nothing left in the way")' }
    caption: Nothing is left in the way.
  - click: '[role=alertdialog] footer >> role=button[name="Delete component"]'
    caption: Try again, from the same dialog.
  - wait: { role: tree, name: Locations }
    caption: The component is gone. The page leaves for Explore.
  - goto: /locations/pop-up-site?tab=configure
    caption: Now the site. It holds one system, so its address opens the system, with the site's own section first.
  - click: '[data-testid="configure-face-location"] >> role=button[name="More actions"]'
    caption: The site's own actions menu.
  - click: 'role=button[name="Delete"s]'
    caption: Its Delete.
  - click: '[role=alertdialog] footer >> role=button[name="Delete location"]'
    caption: Confirm.
  - wait: { selector: '[data-testid="delete-blockers"] a:has-text("Pop-up kiosk")' }
    caption: The kiosk system is still placed here. It links to its own page, in case it should move rather than go.
    hold: 1500
  - click: '[data-testid="delete-blockers"] >> role=button[name=/^Delete system/]'
    caption: This one goes too.
  - click: '[data-testid="delete-blockers"] >> role=button[name=/^Confirm delete system/]'
    caption: The system is deleted by its own delete.
  - click: '[role=alertdialog] footer >> role=button[name="Delete location"]'
    caption: And the site, from the same dialog.
  - wait: { role: tree, name: Locations }
    caption: Everything the pop-up needed is gone, and nothing needed the API.
    hold: 1500
    poster: true
