# Learn: rules and alarms (#2450), lesson 3 of the console's Learn page. The
# lesson is walked on the simulated component the page picks (the first one a
# simulator serves, by name: amp-1 in the dev fleet). Write a threshold on its
# temperature and preview it over the last day of real samples, then unplug
# it from the lesson's own simulation card and watch the official
# reachability-lost rule open an alarm on it, listed live in the lesson.
#
# The wait is real time, as in watch-a-rule-raise-an-alarm: the outpost finds
# the component down on its next check-in, the rule holds its 15s fire sustain,
# and the server's sweep opens the alarm; the lesson's alarms poll shows it.
title: "Learn: rules and alarms"
description: Open lesson 3 of Learn, preview a temperature threshold on a simulated amplifier over its real samples, then unplug it and watch the reachability rule open an alarm in the lesson.
steps:
  - goto: /learn/rules-and-alarms
    caption: Lesson 3 of Learn walks a simulated amplifier from samples to an alarm.
  - select: { target: '[aria-label="Metric"]', value: temperature }
    caption: A rule reads one metric. Pick its temperature.
  - type: { target: '[aria-label="Threshold"]', text: '35' }
    caption: Say when it is bad, above 35 degrees.
  - click: { role: button, name: Preview, exact: true }
    caption: Preview runs it over the last day of real samples, writing nothing.
  - wait: { selector: '[data-testid="preview-result"]', timeout: 15000 }
    caption: What the rule would hold in force now, and the edges it would have written.
  - click: '[data-testid="lesson-live-simulation"] >> role=button[name="Open simulation"]'
    caption: Now trip a shipped rule for real, on the simulated amplifier.
  - click: '#sim-unplugged'
    caption: Unplug it, as if its cable were pulled.
  - click: { role: button, name: Save impairment }
    caption: Save. The simulator applies it on its next pull.
  - press: Escape
    caption: The lesson lists the amplifier's alarms as they land.
  - wait: { selector: '[data-testid="lesson-live-alarms"] [data-alarm-actions]', timeout: 45000 }
    caption: The down held past its 15 second sustain, so reachability-lost opened an alarm, live.
    poster: true
