# Start a whole system from a template (#1329): from a place, create a system
# the way any is created, choose From a template in the create page, read what
# the template creates, and land on the system, which is the operator's own
# from that moment.
title: Start a system from a template
description: From a place, create a new system from a template instead of from scratch, read what the template creates, and land on a system that is yours, with nothing pointing back at the template.
steps:
  - goto: /locations/level-2
    caption: Level 2 of the West Building, a floor of rooms. New systems start from the place they sit in.
  - click: { role: button, name: New, exact: true }
    caption: New creates something here.
  - click: { role: button, name: System, exact: true }
    caption: A system, sitting on this floor.
  - click: { role: button, name: From a template }
    caption: Rather than from scratch, start from one of the examples Omniglass ships.
  - select: { target: 'role=combobox[name="Template"]', value: mr55-system }
    caption: Choose the Meeting Room 55 system template.
  - wait: { selector: '[data-testid="template-create-preview"]' }
    caption: What it creates, read from the template, a component for each role of the standard it is built to.
  - click: { role: button, name: Start system }
    caption: Start it. The system, a component per role and their assignments land together, or not at all.
  - wait: { selector: '[data-testid="template-notice"]' }
    caption: The new system, with its components filled. It is yours now; a release that changes the template never touches it.
    hold: 1500
    poster: true
