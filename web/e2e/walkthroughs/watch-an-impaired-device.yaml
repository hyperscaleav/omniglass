# Watch an impaired device (#1647): with a simulator connected, Platform
# health closes the loop from the far end. Drop every packet toward one
# simulated device in the kernel, from its drawer on /simulation, and watch
# the node's gap for that protocol open on Platform health, read as impaired
# (expected, not lost), while the device's received count falls. Repair it
# and watch the attribution clear once the window slides past the change.
#
# The device is projector-1 (the only component by that name in the seeded
# fleet), polled over snmp only. Snmp rides udp, so a dropped request is gone:
# the node counted it sent and the simulator never saw it. A tcp device would
# not show this gap: the kernel retransmits, or the connect never completes and
# nothing was sent.
#
# The wait is real time, and the 60s budget counts it. The lab runs the
# walkthrough cadence (internal/lab): the server brackets the node every 1s
# into a 10s window, the simulator pulls the impairment every 2s, and the page
# polls every 5s. The gap opens 8 to 12s after Save; the attribution clears
# about 14s after Repair, once the window's start is past the change.
title: Watch an impaired device
description: Drop a simulated device's packets from its drawer, watch Platform health read its protocol's gap as impaired, then repair it and watch the attribution clear as the window slides.
steps:
  - goto: /platform
    caption: With a simulator connected, Platform health closes the loop. Every gap reads 0 and every device is drawing its polls.
  - click: '[data-testid=platform-sim-device] >> role=link[name="projector-1"s]'
    caption: projector-1 is polled over snmp. Open it in its drawer on the Simulation page.
  - type: { target: { role: textbox, name: Loss (%), exact: true }, text: '100' }
    caption: Drop every packet toward it, in the kernel, before the simulated device sees it.
  - click: { role: button, name: Save impairment }
    caption: Save. The simulator applies it on its next pull.
  - goto: /platform
    caption: Back on Platform health, the loop runs on. The window is the last 10 seconds on this lab.
  - wait: { selector: '[data-testid=platform-sim-gap][data-gap=sent-not-received][data-protocol=snmp][data-tone=expected]', timeout: 30000 }
    caption: The node sent snmp requests the simulator never received. The gap opens, read as impaired, not lost.
    poster: true
  - wait: { selector: '[data-testid=platform-sim-device]:has(a:text-is("projector-1")) .badge-info', timeout: 10000 }
    caption: Below, projector-1 reads impaired, and the snmp requests it received fall toward 0.
  - click: '[data-testid=platform-sim-device] >> role=link[name="projector-1"s]'
    caption: Open projector-1 again.
  - click: { role: button, name: Repair }
    caption: Repair it. Every request reaches it again.
  - goto: /platform
    caption: The window still holds the change, so the gap still reads impaired.
  - wait: { selector: '[data-testid=platform-sim-gap][data-gap=sent-not-received][data-protocol=snmp][data-tone=calm]:not(:has(.badge-info))', timeout: 40000 }
    caption: Once the window slides past the change, the gap reads 0 and the attribution clears.
