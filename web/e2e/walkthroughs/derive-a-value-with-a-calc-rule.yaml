# Derive a value with a calc rule (#999, #1018, #1019): in one drawer, author
# a component rule that reads every endpoint's TCP connect time, register the
# metric it writes inline, write the expression that takes the slowest,
# preview it, save it, and follow one owner to its component, where the
# derived value shows among its vitals linked to the rule. Picking the key
# fills its alias, the name the expression uses for the input's list of
# values. The simulated fleet answers TCP on every component, so
# tcp-connect-time has current values on the lab.
title: Derive a value with a calc rule
description: Author a calc rule and the metric it writes in one drawer, write the expression that takes each component's slowest TCP connect time, preview and save it, and find the derived value on a component, linked to its rule.
steps:
  - goto: /calc-rules
    caption: Calc rules derive a value from others, on each component or each system.
  - click: { role: button, name: New rule }
    caption: New rule opens the drawer.
  - type: { target: { role: textbox, name: Name, exact: true }, text: tcp-worst }
    caption: Name the rule.
  - select: { target: { role: combobox, name: Input 1 key, exact: true }, value: tcp-connect-time }
    caption: It reads TCP connect time, one value per endpoint. Its alias, the name the expression uses, fills in from the key.
  - click: { role: button, name: New metric, exact: true }
    caption: It writes a metric of its own. Register it here, without leaving the drawer.
  - type: { target: { role: textbox, name: New metric name, exact: true }, text: tcp-worst }
    caption: Name the metric. Its values are numbers.
  - click: { role: button, name: Create metric, exact: true }
    caption: Create it. The rule now writes it, and the form says no other rule or collector may.
  - type: { target: { role: textbox, name: Reduce, exact: true }, text: max(tcp }
    caption: The alias is a list of the endpoints' values. Fold it with max; the editor offers the alias as it is typed.
  - press: Enter
    caption: Take the alias it offers.
  - type: { target: { role: textbox, name: Reduce, exact: true }, text: ')' }
    caption: Close it. The slowest endpoint wins, and the editor checks that it yields a number.
  - click: { role: button, name: Preview, exact: true }
    caption: Preview computes the draft on each component now, writing nothing.
  - wait: { selector: '[data-testid="calc-preview-result"]', timeout: 15000 }
    caption: The value it would write on each component.
    poster: true
  - click: { role: button, name: Create rule }
    caption: Save it. The rule computes again whenever an input changes.
  - wait: { selector: 'section[aria-label="State"] li span.font-data', timeout: 20000 }
    caption: Its blade shows the value it last computed on each component.
  - click: 'section[aria-label="State"] li a >> nth=0'
    caption: Open one of those components.
  - wait: { selector: '[data-testid="leaf-vitals"] a[href*="/calc-rules?rule="]', timeout: 15000 }
    caption: Among its vitals is the derived value, linked to the calc rule that wrote it.
