# Move a device to another room (#1804): a component's edit face carries
# "Move to...", its own act (component:move), apart from "Also serves...". The
# destination is a list that says where each place is, the move runs at once,
# and the page stays on the device while its breadcrumb follows it.
# Its setup puts a spare microphone in Bay 2, off camera.
title: Move a device to another room
description: Open a spare microphone's Configure, press Move to, choose Bay 4 from the places, and watch the breadcrumb follow the device without leaving its page.
setup:
  - post: /components
    body: { name: spare-mic, label: Spare Mic, product: lyra-arc-a2, location: bay-2 }
steps:
  - goto: /components/spare-mic?tab=configure
    caption: A spare microphone, sitting in Bay 2.
  - click: '[data-testid="configure-face"] >> role=button[name="Edit"]'
    caption: Edit the device. Moving it is its own permission, component:move.
  - click: { role: button, name: Move to... }
    caption: Move to is its own action, apart from the memberships. It never rides on Save.
  - type: { target: 'role=combobox[name="Destination"]', text: Bay 4 }
    caption: Type the room. Each place says where it sits, so two rooms named alike tell apart.
  - wait: { role: option, name: Bay 4 }
    caption: Bay 4, with the places above it beneath.
    hold: 1200
  - click: { role: option, name: Bay 4 }
    caption: Choose it.
  - click: { role: button, name: Move, exact: true }
    caption: Move. It happens at once; the rest of the edit is untouched.
  - wait: { selector: '[data-testid="breadcrumb"]:has-text("Bay 4")' }
    caption: The page stays on the device, and its breadcrumb now reads Bay 4.
    hold: 1500
    poster: true
