# Read every metric at one instant (#2424): a system's view charts each of its
# metrics in one grid over the page's time range, and every chart shares one
# cursor, so resting the pointer on one chart reads all of them at that
# moment. The huddle room holds one system, so its address lands on it.
title: Read every metric at one instant
description: Open a system's view over the last hour, rest the pointer on one metric's chart, and read the crosshair and value every other chart draws at the same instant.
steps:
  - goto: /systems/huddle?range=1h
    caption: A huddle room's system, over the last hour.
  - wait: { selector: '[data-testid=metrics-grid] [data-testid=timeseries-chart]', timeout: 60000 }
    caption: Its metrics grid charts every metric the room declares, a card each with its latest value.
  - hover: '[data-testid=metrics-grid] [data-testid=timeseries-chart] >> nth=0 >> circle.fill-transparent >> nth=-1'
    caption: Rest the pointer on one chart, at its newest bucket.
  - wait: { selector: '[data-testid=metrics-grid] [data-testid=chart-crosshair] >> nth=1' }
    caption: Every chart draws its crosshair at the same instant and reads its own value there.
    hold: 2000
    poster: true
