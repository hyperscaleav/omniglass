# Watch a rule raise an alarm (#921): unplug a simulated component from its
# own page, open the system it serves, and watch the official rule
# reachability-lost wait out its sustain and open a High alarm that moves the
# system, live. The component is panel-2 (Touch Panel 2 in Media Lab, the only
# component by that name in the seeded fleet), which fills the Touch Control
# role of the system Media Lab Classroom 2, so the alarm takes that system to
# degraded.
#
# The wait is real time, and the 60s budget counts it. The node finds the
# panel down on its first check-in after the simulator's next 2s pull (the
# lab's node checks in every 2s, internal/lab) and the
# probe's timeout; the rule then holds for its seeded 15s fire sustain
# (internal/seed/event_rules.yaml) and opens the alarm on the server's 5s
# sweep tick; and the system's view shows it on its next 5s poll.
#
# The system's view refreshes on its own (#940), so it is opened in the page,
# from the panel's Systems it serves, before the alarm opens, and the alarm
# lands in Why while it is open: no reload. Recorded, it runs 44 to 50s.
# Following the alarm's event on Activity to the rule's blade, which lists the
# open alarm, was measured at 57.9s, too near the budget to hold every time,
# and plugging the panel back in to watch the alarm clear is further still
# (the replug is three clicks back on the panel's page, then its own
# detection); the rules guide says both in words.
title: Watch a rule raise an alarm
description: Unplug a simulated touch panel from its page, open the system it serves, and watch the official reachability rule open a High alarm that takes the system to degraded while you look.
steps:
  - goto: /components/panel-2
    caption: Touch Panel 2 fills the Touch Control role of Media Lab Classroom 2. It reads healthy.
  - click: { role: button, name: Open simulation }
    caption: The panel is simulated, so it can be broken on purpose from its own page.
  - click: '#sim-unplugged'
    caption: Unplug it. The simulated panel goes dark on every protocol, as if its cable were pulled.
  - click: { role: button, name: Save impairment }
    caption: Save. The panel is marked unplugged, and the simulator applies it on its next pull.
  - press: Escape
    caption: Close the simulation. The panel's page lists the systems it serves.
  - click: '[data-testid="leaf-memberships"] >> role=button[name="Media Lab Classroom 2"]'
    caption: Open the system it serves. It still reads healthy; the official rule waits for a down to hold 15s, so one failed probe never pages.
  - wait: { selector: '[data-testid="alarm-strip"]:has-text("panel-2")', timeout: 45000 }
    caption: The down held, so the rule opened a High alarm on the panel. The system's view refreshes on its own, so Why names it with no reload.
    poster: true
  - wait: { role: group, name: Touch Control }
    caption: The alarm takes the panel out, so Touch Control is short and the system reads degraded.
