# Keep an outpost's own logs for a day (#1350): an outpost's self-logs follow the
# shared log windows until an admin gives a band a window of its own. Set the
# outpost debug window to one day on the Settings page; a component's debug lines
# keep the shared three days, and the server's next retention pass prunes the
# outpost's debug lines older than a day.
title: Keep an outpost's own logs for a day
description: Give an outpost's own debug log lines a window of their own, one day, on the Settings page, while a component's debug lines keep the shared three days.
steps:
  - goto: /settings
    caption: The retention card says how many days each kind of data is kept. An outpost's own log windows read not set, so an outpost's lines follow the shared ones.
  - click: { role: button, name: Edit }
    caption: Edit turns each value into a field. A field that is not set stays blank, not an error.
  - type: { target: { role: textbox, name: outpost_log_debug_days, exact: true }, text: '1' }
    caption: Keep an outpost's debug lines for a day. log_debug_days, the shared window, stays at 3 for a component's.
  - click: { role: button, name: Save }
    caption: Save it. The server's next retention pass prunes an outpost's debug lines by the new window.
  - click: { role: button, name: Done }
    caption: Done returns the page to reading.
  - wait: { text: Set in console }
    caption: The outpost's debug window now comes from the console. Restoring it puts an outpost's lines back on the shared window.
    poster: true
