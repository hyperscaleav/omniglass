{{- if and (not .Values.encryptionKey.existingSecret) .Values.encryptionKey.generate }}
{{- $name := include "omniglass.encryptionKeySecret" . }}
{{- /*
Generated once, then kept: an upgrade reuses the live value (lookup), and an
uninstall leaves the Secret in place (resource-policy keep), so a reinstall of
the same release adopts it. A new value would orphan every stored secret.
*/}}
{{- $prior := dig "data" "encryption-key" "" (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "omniglass.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  encryption-key: {{ $prior | default (randAlphaNum 32 | b64enc | b64enc) | quote }}
{{- end }}
