apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omniglass.fullname" . }}
  labels:
    {{- include "omniglass.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  # One server owns one bus and one data volume: the old pod stops before the
  # new one starts, so two never share the JetStream store (and a
  # ReadWriteOnce claim is never wanted on two nodes at once).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "omniglass.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "omniglass.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      # The image runs as nonroot (65532); a fresh volume is group-owned by it
      # so the server can write its data directory. Ownership is fixed only
      # when the volume's root is wrong, not re-walked over the JetStream store
      # on every start.
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      # Init containers gate the server on schema (and, for previews, an owner)
      # instead of Helm pre-install hooks: a bundled Postgres in the same release
      # is not up during pre-install, so a hook-Job migrate would race the DB.
      # Both migrate and bootstrap are idempotent, so re-running on every rollout
      # is safe. At replicas > 1 each replica's migrate runs, but they take turns
      # on a Postgres advisory lock: one applies, the rest find nothing to do.
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-db
          image: {{ .Values.postgres.image | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "omniglass.fullname" . }}-postgres -U {{ .Values.postgres.user }}; do echo "waiting for postgres"; sleep 1; done
        {{- end }}
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: OMNIGLASS_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "omniglass.fullname" . }}-dsn
                  key: dsn
        {{- if .Values.bootstrap.enabled }}
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - bootstrap
            - {{ .Values.bootstrap.username | quote }}
            {{- if .Values.bootstrap.email }}
            - --email
            - {{ .Values.bootstrap.email | quote }}
            {{- end }}
            {{- if .Values.bootstrap.label }}
            - --label
            - {{ .Values.bootstrap.label | quote }}
            {{- end }}
          env:
            - name: OMNIGLASS_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "omniglass.fullname" . }}-dsn
                  key: dsn
            {{- include "omniglass.encryptionKeyEnv" . | nindent 12 }}
        {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OMNIGLASS_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "omniglass.fullname" . }}-dsn
                  key: dsn
            - name: OMNIGLASS_SECURE_COOKIES
              value: {{ .Values.server.secureCookies | quote }}
            {{- include "omniglass.encryptionKeyEnv" . | nindent 12 }}
            # The image's data directory, on the data volume, with the embedded
            # JetStream store under it (the lab's layout).
            - name: OMNIGLASS_DATA_DIR
              value: /var/lib/omniglass
            - name: OMNIGLASS_NATS_STORE_DIR
              value: /var/lib/omniglass/nats
          volumeMounts:
            - name: data
              mountPath: /var/lib/omniglass
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omniglass.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
