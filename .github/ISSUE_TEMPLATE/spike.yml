name: Spike / investigation
description: A time-boxed investigation to learn whether something is possible. Not shippable behavior.
title: "[Spike] "
type: Task
body:
  - type: markdown
    attributes:
      value: >-
        The five sections below are the ticket contract the dispatcher launches on
        (docs/contributing/labels.md#the-ticket-contract). A spike is bounded by definition:
        its code is deleted or stabilized with tests before it merges, and it is never a
        standing excuse to skip the failing test.
  - type: input
    id: epic
    attributes:
      label: Parent epic
      description: The epic this informs, if any (e.g. #12).
    validations:
      required: false
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The specific unknown this spike resolves. State what a yes or a no answer looks like.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Spec
      description: How the question is answered (the prototype, the measurement, the reading) and the timebox (e.g. 1 day).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checkbox list of what it produces (a decision note, a deleted prototype, follow-up issues).
      value: |
        - [ ] a decision note is posted on this issue, answering the question
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this spike must not touch (it ships no behavior).
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely touched
      description: Paths, one per line, or "none" for a reading-only spike.
      placeholder: "- ..."
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: The agent seniority the dispatcher assigns, applied as the label.
      options:
        - tier:jr
        - tier:mid
        - tier:sr
      default: 1
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Applied as the label. A spike that touches nothing an operator sees is low.
      options:
        - risk:low
        - risk:high
      default: 0
    validations:
      required: true
