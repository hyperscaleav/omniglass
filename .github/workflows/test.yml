name: test

# The CI test gate. `make test` is the local gate (validate-locally doctrine);
# this is the backstop on every PR and on main, and it runs that same target so
# the two cannot drift (#214): the SPA typecheck and vitest suite, every Go tier,
# then the NET_ADMIN tier. The integration and e2e tiers use testcontainers-go,
# which needs a Docker daemon; ubuntu-latest ships one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Track the toolchain pinned in go.mod so CI never drifts from local.
          go-version-file: go.mod
          cache: true

      # No -tags web: the build-tag-with-fallback embed (internal/webui) serves
      # a placeholder without a real dist/, so the gate needs no SPA build.
      - name: Build
        run: go build ./...

      # The collection tier's icmp probe opens an unprivileged SOCK_DGRAM ICMP
      # socket, which its real-capability test exercises. Runners disallow that by
      # default (net.ipv4.ping_group_range excludes the runner gid), so widen the
      # range to let the gate actually run on CI rather than skip it.
      - name: Allow unprivileged ICMP (for the icmp capability gate)
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      # test-web (inside make test) installs the SPA's dependencies and runs its
      # typecheck and vitest suite, so the job needs node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The local gate itself: test-web, go test over every package, then the
      # NET_ADMIN tier (impairments rewrite the firewall and tc of the network
      # they run in), which make runs in a container with its own network
      # namespace, never on the runner's own network. TEST_PARALLEL defaults to
      # 1 for small workstations; a runner has the memory for one package per
      # core, which is what a bare `go test ./...` ran here before.
      - name: Test (make test)
        run: make test TEST_PARALLEL="$(nproc)"

  # The browser e2e tier (#761): the console driven as an operator would, against
  # the real binary, on a throwaway lab (web/e2e/run.sh on web/e2e/lib/lab.sh,
  # #1267: Postgres, the server and Playwright on the lab's own network, the
  # console on a loopback port Docker picks). Covers the CRUD round-trips plus
  # one smoke per console route from the route manifest
  # (web/e2e/routes.spec.ts), so a PR cannot merge with a route that errors in a
  # real browser. No untrusted input reaches a shell: the job runs fixed make
  # targets only.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # make test-e2e builds the lab (make: the image and the binary, with only
      # Docker); Playwright runs in the pinned container against the repo
      # mounted from the runner, so it needs the web deps installed here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install web deps
        run: cd web && npm ci

      - name: Browser e2e (CRUD round-trips + route smoke)
        run: make test-e2e
