name: release

# The build half of a release (ADR-2652). release-please.yml tags the merge
# commit of a release PR and creates the GitHub Release with that PR's notes,
# then calls this workflow on the tag. It builds and pushes the release image,
# attaches the cross-platform binaries, each stamped with that image's digest
# (#1257), and comments "Released in" on the PRs the release ships and the
# issues they closed. It never tags, never writes the notes, and commits
# nothing; the tag and the Release already exist when it starts.
#
# A dispatch with a tag rebuilds an existing release whose build failed. Like
# the call, it publishes only while the repository variable RELEASES_ENABLED is
# `true`, and it refuses a tag with no GitHub Release.

on:
  workflow_call:
    inputs:
      tag:
        description: "The release's tag, created by release-please"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of an existing release to build again (v0.1.0)"
        type: string
        required: true

permissions:
  contents: write       # attach the binaries to the Release
  packages: write       # push the release image to GHCR
  issues: write         # the "Released in" comments on issues
  pull-requests: write  # and on the PRs it ships

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      # Every publishing step checks this.
      PUBLISH: ${{ vars.RELEASES_ENABLED == 'true' }}
    steps:
      - name: Refuse unless releases are enabled
        if: vars.RELEASES_ENABLED != 'true'
        run: |
          echo "::error::Releases are disabled: set the repository variable RELEASES_ENABLED to true."
          exit 1

      - name: Refuse a tag with no GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::${TAG} is not a release tag (v<major>.<minor>.<patch>)."
            exit 1
          fi
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName > /dev/null || {
            echo "::error::${TAG} has no GitHub Release; release-please creates it when a release PR merges."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0          # full history + tags, for the PRs since the previous release
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # The PRs this release ships, for the "Released in" comments: every PR
      # squash-merged since the previous release tag. The notes themselves are
      # release-please's, already on the Release.
      - name: List the PRs the release ships
        id: prs
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          go run ./cmd/releasenotes -repo "${GITHUB_REPOSITORY}" -tag "${TAG}" \
            -previous "${previous}" -to "${TAG}" \
            -prs-file "${RUNNER_TEMP}/prs.txt" > /dev/null
          {
            echo "### Release ${TAG}"
            echo
            echo "- previous: ${previous:-none}"
            echo "- PRs: $(wc -l < "${RUNNER_TEMP}/prs.txt")"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Build and push the release image before the binaries, so each binary
      # carries the image's digest and its `omniglass lab run` pulls exactly
      # this image, never whatever the v<version> tag points at later (#1257).
      # The image is built inline here, the same way image.yml builds it, so a
      # v* tag pushed any other way builds nothing.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.PUBLISH == 'true'

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Only the release tag: the commit's sha tag is image.yml's, built
          # on the push to main.
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Read the Go version from go.mod
        id: gover
        run: echo "version=$(bash scripts/go-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build and push the release image
        id: image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The release version, which the image's
          # org.opencontainers.image.version label then carries too.
          build-args: |
            VERSION=${{ inputs.tag }}
            GO_VERSION=${{ steps.gover.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Attach the cross-platform binaries to the Release just created, built
      # inline, for the same reason as the image. Shares .goreleaser.yaml with
      # goreleaser.yml's PR snapshot.
      # goreleaser's before hook runs `make web`, which builds the console with
      # pnpm, so pnpm is set up before Node.
      - name: Set up pnpm (for the embedded console build)
        if: env.PUBLISH == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Set up Node (for the embedded console build)
        if: env.PUBLISH == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install syft (SBOM generator)
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: env.PUBLISH == 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          # Stamped into each binary as main.imageDigest (.goreleaser.yaml).
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}

      # Once everything is attached, the release comments on each PR it ships
      # and each issue that PR closed (#2142).
      # A hidden marker makes a rerun skip what it already commented, and a
      # failed comment only warns. Past MAX_COMMENTS PRs (the first release
      # ships the whole history) it skips the comments rather than post
      # hundreds and run into GitHub's limits on content creation.
      - name: Mark PRs and issues released
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_COMMENTS: "100"
        run: |
          mapfile -t prs < "${RUNNER_TEMP}/prs.txt"
          if (( ${#prs[@]} > MAX_COMMENTS )); then
            echo "::notice::${TAG} ships ${#prs[@]} PRs, over ${MAX_COMMENTS}: no Released in comments."
            echo "- comments: skipped, ${#prs[@]} PRs" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          marker="<!-- omniglass-released: ${TAG} -->"
          body="Released in [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}).

          ${marker}"
          declare -A seen
          posted=0
          comment() {
            local n="$1" bodies
            [[ -n "${seen[$n]:-}" ]] && return 0
            seen[$n]=1
            bodies=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${n}/comments?per_page=100" --jq '.[].body' 2>/dev/null) || bodies=""
            if grep -qF -- "${marker}" <<<"${bodies}"; then return 0; fi
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" -f body="${body}" > /dev/null; then
              posted=$((posted + 1))
            else
              echo "::warning::Could not comment on #${n}."
            fi
            sleep 2
          }
          for pr in "${prs[@]}"; do
            comment "${pr}"
            issues=$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json closingIssuesReferences \
              --jq '.closingIssuesReferences[].number' 2>/dev/null) || issues=""
            for i in ${issues}; do comment "${i}"; done
          done
          echo "- comments: ${posted} posted" >> "${GITHUB_STEP_SUMMARY}"
