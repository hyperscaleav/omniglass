name: release

# The one release path, run from a release branch (#2139). Releases are never
# cut on merge to main: on the cut, a release/<major>.<minor> branch is made
# from main, and this workflow is dispatched on it by hand. A dispatch tags the
# branch tip as the next candidate (v0.1.0-rc.1, then rc.2 after a cherry-pick)
# and publishes it as a prerelease; once a candidate has passed the soak gate, a
# dispatch with `final` tags that same commit v0.1.0. The version comes from the
# branch name and the tags already cut (cmd/releaseversion), never from commit
# subjects. Each run pushes the tag, creates the GitHub Release with notes
# grouped by change type (cmd/releasenotes, #2142), builds and pushes the
# release image, and attaches the binaries, each stamped with that image's
# digest (#1257). A final release then comments "Released in" on the PRs it
# ships and the issues they closed. Nothing is committed back; the tag is the
# artifact.
#
# Releasing is switched off until the repository variable RELEASES_ENABLED is
# `true` (Settings, Secrets and variables, Actions, Variables). Until then a
# dispatch may only dry-run; a real run fails at its first step, before any tag.
#
# The tag is pushed with a token from the release GitHub App when the variable
# RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY are set, the
# App being the one bypass on the "v* tags: created by admins only" ruleset.
# Otherwise it falls back to GITHUB_TOKEN, which that ruleset refuses (#1940).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only (print the next tag, publish nothing)"
        type: boolean
        default: false
      final:
        description: "Release the newest candidate as final, instead of cutting a new candidate"
        type: boolean
        default: false

permissions:
  contents: write       # create the GitHub Release (and push the tag, without the App)
  packages: write       # push the release image to GHCR
  issues: write         # a final release's "Released in" comments on issues
  pull-requests: write  # and on the PRs it ships

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Every publishing step checks this.
      PUBLISH: ${{ !inputs.dry_run && vars.RELEASES_ENABLED == 'true' }}
    steps:
      - name: Refuse unless releases are enabled
        if: ${{ !inputs.dry_run && vars.RELEASES_ENABLED != 'true' }}
        run: |
          echo "::error::Releases are disabled: set the repository variable RELEASES_ENABLED to true to publish, or dispatch with dry_run."
          exit 1

      - name: Refuse unless dispatched on a release branch
        if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          echo "::error::Releases are cut from a release/<major>.<minor> branch, not ${GITHUB_REF}. Branch from main and dispatch there."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history + tags for the version
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Work out the tag
        id: version
        env:
          FINAL: ${{ inputs.final }}
        run: |
          go run ./cmd/releaseversion -branch "${GITHUB_REF_NAME}" -final="${FINAL}" | tee -a "${GITHUB_OUTPUT}"
          {
            echo "### Release plan"
            echo
            grep -E '^(tag|prerelease|previous)=' "${GITHUB_OUTPUT}" | sed 's/^/- /'
            echo "- publish: ${PUBLISH}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # The notes cover the commits since the previous final release, so each
      # candidate's notes are cumulative. A dry run shows them in the summary.
      - name: Write the notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          go run ./cmd/releasenotes -repo "${GITHUB_REPOSITORY}" -tag "${TAG}" \
            -previous "${PREVIOUS}" -to "${GITHUB_SHA}" \
            -prs-file "${RUNNER_TEMP}/prs.txt" > "${RUNNER_TEMP}/notes.md"
          {
            echo
            echo "<details><summary>Release notes ($(wc -l < "${RUNNER_TEMP}/prs.txt") PRs)</summary>"
            echo
            cat "${RUNNER_TEMP}/notes.md"
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Mint the release App token
        id: app
        if: env.PUBLISH == 'true' && vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the tag
        if: env.PUBLISH == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          git tag "${TAG}" "${GITHUB_SHA}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

      - name: Create the GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--verify-tag --notes-file "${RUNNER_TEMP}/notes.md" --title "${TAG}")
          if [ "${PRERELEASE}" = "true" ]; then args+=(--prerelease --latest=false); fi
          gh release create "${TAG}" "${args[@]}"

      # Build and push the release image before the binaries, so each binary
      # carries the image's digest and its `omniglass lab run` pulls exactly
      # this image, never whatever the v<version> tag points at later (#1257).
      # The image is built inline here, the same way image.yml builds it, so a
      # v* tag pushed any other way builds nothing.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.PUBLISH == 'true'

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Only the release tag: the commit's sha tag is image.yml's, built
          # on the branch push.
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}

      - name: Build and push the release image
        id: image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The release version, which the image's
          # org.opencontainers.image.version label then carries too.
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Attach the cross-platform binaries to the Release just created, built
      # inline for the same reason as the image. Shares .goreleaser.yaml with
      # goreleaser.yml's PR snapshot.
      - name: Set up Node (for the embedded console build)
        if: env.PUBLISH == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install syft (SBOM generator)
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: env.PUBLISH == 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
          # Stamped into each binary as main.imageDigest (.goreleaser.yaml).
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}

      # A final release, once everything is attached, comments on each PR it
      # ships and each issue that PR closed (#2142). Candidates comment nothing.
      # A hidden marker makes a rerun skip what it already commented, and a
      # failed comment only warns. Past MAX_COMMENTS PRs (the first release
      # ships the whole history) it skips the comments rather than post
      # hundreds and run into GitHub's limits on content creation.
      - name: Mark PRs and issues released
        if: env.PUBLISH == 'true' && steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          MAX_COMMENTS: "100"
        run: |
          mapfile -t prs < "${RUNNER_TEMP}/prs.txt"
          if (( ${#prs[@]} > MAX_COMMENTS )); then
            echo "::notice::${TAG} ships ${#prs[@]} PRs, over ${MAX_COMMENTS}: no Released in comments."
            echo "- comments: skipped, ${#prs[@]} PRs" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          marker="<!-- omniglass-released: ${TAG} -->"
          body="Released in [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}).

          ${marker}"
          declare -A seen
          posted=0
          comment() {
            local n="$1" bodies
            [[ -n "${seen[$n]:-}" ]] && return 0
            seen[$n]=1
            bodies=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${n}/comments?per_page=100" --jq '.[].body' 2>/dev/null) || bodies=""
            if grep -qF -- "${marker}" <<<"${bodies}"; then return 0; fi
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" -f body="${body}" > /dev/null; then
              posted=$((posted + 1))
            else
              echo "::warning::Could not comment on #${n}."
            fi
            sleep 2
          }
          for pr in "${prs[@]}"; do
            comment "${pr}"
            issues=$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json closingIssuesReferences \
              --jq '.closingIssuesReferences[].number' 2>/dev/null) || issues=""
            for i in ${issues}; do comment "${i}"; done
          done
          echo "- comments: ${posted} posted" >> "${GITHUB_STEP_SUMMARY}"
