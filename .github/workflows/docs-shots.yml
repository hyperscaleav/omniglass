name: docs-shots

# The docs screenshots are a generated resource declared in each page's
# `screenshots` frontmatter. Main owns their refresh (#2561); a PR never
# re-renders an existing shot, because git cannot merge binaries and every merge
# used to make the other open PRs conflict.
#
# - verify (fast, deterministic, every PR): every declared shot has a committed
#   PNG, every PNG is declared, ids are unique; and the guard fails a PR that
#   modifies, deletes or renames an existing shot (a new shot is fine).
# - recapture (push to main or a release branch only): recapture against the
#   real console (a throwaway lab with no node, built by make, and Playwright,
#   all in Docker, #1267); when a masked baseline changed, push those shots and
#   their clean twins to claude/docs-shots-recapture (a fresh branch named for
#   the commit when that PR is in the merge queue, #2602) and open or update one
#   PR as the agents' App
#   (the same App agent-open-pr.yml opens PRs with), which the architect approves
#   like any PR. Branch protection is untouched, no bypass. A concurrency group
#   coalesces merges that land close together, and a run whose commit is no
#   longer the branch head stands down, so the latest main wins.
#   Nondeterministic regions (v7-uuid text, seed-time stamps) are masked in each
#   page's frontmatter, so the pinned browser's rasters are byte-stable and the
#   tolerance is zero (#398, #623); DOCS_SHOTS_MAX_RATIO remains an escape hatch
#   for unpinned local browsers only.

on:
  pull_request:
    paths:
      - docs/**
      - web/**
  push:
    branches: [main, "release/**"]
    paths:
      - docs/**
      - web/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install web deps
        run: cd web && npm ci
      - name: Verify screenshots are declared and present
        run: make docs-shots-verify
      - name: Guard existing shots against a PR's edit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: git diff --name-status "$BASE_SHA...$HEAD_SHA" | bash scripts/docs-shots-guard.sh "$HEAD_REF" "$HEAD_REPO" "$BASE_REPO"

  recapture:
    # Off on pull requests: a PR's stale shots are expected, main recaptures
    # them after the merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-shots-recapture-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The screenshot build stamps the newest release tag as its version;
          # git describe walks history from HEAD, so a shallow clone cannot see it.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # make docs-shots builds the lab (make: the image and the binary, with only
      # Docker), so the job needs no Go toolchain.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install web deps
        run: cd web && npm ci
      - name: Recapture both shot sets on the merged tree
        run: make docs-shots
      - name: Mint the agent App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Push the recapture and open or update its PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          standing=$(bash scripts/docs-shots-plan.sh branch "$BASE" "$SHA" false)
          # A newer merge already moved the base: this run's tree is stale and
          # the newer run will recapture.
          head=$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq .object.sha)
          if [ "$head" != "$SHA" ]; then
            echo "$BASE moved to $head; standing down for the newer run."
            exit 0
          fi
          # Commit only the shots whose masked baseline changed, plus their clean
          # twins: a clean shot's live regions differ on every capture, so the
          # rest is noise (#2602). No baseline change, nothing to do.
          mapfile -t paths < <(git status --porcelain -- docs/public/screenshots docs/screenshots/baseline | bash scripts/docs-shots-plan.sh select)
          keep=()
          for p in "${paths[@]}"; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then keep+=("$p"); fi
          done
          # GitHub locks the branch of a PR that is in the merge queue, so a push
          # to it is refused (GH006). Use a fresh branch then, never fail main.
          open=$(gh pr list --repo "$REPO" --head "$standing" --state open --json number --jq '.[0].number // empty')
          fresh=false
          if [ -n "$open" ]; then
            # The runner's gh pr view has no merge queue field (#2636); it is
            # read from GraphQL's PullRequest.
            queued=$(gh api graphql -F owner="${REPO%%/*}" -F name="${REPO##*/}" -F number="$open" \
              -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { isInMergeQueue } } }' \
              --jq .data.repository.pullRequest.isInMergeQueue)
            if [ "$queued" = true ]; then fresh=true; fi
          fi
          if [ ${#keep[@]} -eq 0 ]; then
            echo "::notice::No masked baseline changed at ${SHA:0:7}; nothing to recapture."
            if [ -n "$open" ] && [ "$fresh" = false ]; then
              gh pr close "$open" --repo "$REPO" --comment "Superseded: $BASE's masked baselines already match the console at ${SHA:0:7}." || echo "::notice::could not close #$open"
            fi
            exit 0
          fi
          git add -A -- "${keep[@]}"
          git config user.name "hyperscale-agent[bot]"
          git config user.email "hyperscale-agent[bot]@users.noreply.github.com"
          git commit -q -m "docs: recapture screenshots after ${SHA:0:7}"
          branch=$(bash scripts/docs-shots-plan.sh branch "$BASE" "$SHA" "$fresh")
          if [ "$fresh" = true ]; then
            # The queued PR may already carry exactly these shots.
            git fetch -q "$url" "refs/heads/$standing" && if git diff --quiet FETCH_HEAD HEAD -- "${keep[@]}"; then
              echo "::notice::The queued recapture PR #$open already carries these shots; nothing new to commit."
              exit 0
            fi
          fi
          if ! git push -f "$url" "HEAD:refs/heads/$branch"; then
            if [ "$fresh" = true ]; then exit 1; fi
            echo "::notice::Push to $branch was refused (a queued PR locks its branch); using a fresh branch."
            fresh=true
            branch=$(bash scripts/docs-shots-plan.sh branch "$BASE" "$SHA" true)
            git push -f "$url" "HEAD:refs/heads/$branch"
          fi
          open=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          body=$(printf '%s\n\n%s\n' \
            "Main recaptures the docs screenshots after a merge (#2561). This is the recapture of \`$BASE\` at ${SHA:0:7}: the shots whose masked baseline under docs/screenshots/baseline/ changed, with their clean twins under docs/public/screenshots/. Approve it like any PR; a later merge updates this branch in place." \
            "demo: none (docs shots only)")
          if [ -n "$open" ]; then
            gh pr edit "$open" --repo "$REPO" --body "$body"
            echo "Updated PR #$open."
          else
            gh pr create --repo "$REPO" --base "$BASE" --head "$branch" --title "docs: recapture the docs screenshots" --body "$body"
          fi
