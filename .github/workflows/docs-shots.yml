name: docs-shots

# Two gates for the docs screenshots, which are a generated resource declared in
# each page's `screenshots` frontmatter:
#
# - verify (fast, deterministic): every declared shot has a committed PNG, every
#   PNG is declared, ids are unique. Catches a forgotten capture or an orphan.
# - freshness (heavier): recapture against the real console (Postgres + the built
#   binary + Playwright, all in Docker) and fail on ANY unmasked pixel change.
#   Nondeterministic regions (v7-uuid text, seed-time stamps) are masked in each
#   page's frontmatter, so the pinned browser's rasters are byte-stable and the
#   tolerance is zero (#398, #623); DOCS_SHOTS_MAX_RATIO remains an escape hatch
#   for unpinned local browsers only.

on:
  pull_request:
    paths:
      - docs/**
      - web/**
  push:
    branches: [main]
    paths:
      - docs/**
      - web/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install web deps
        run: cd web && npm ci
      - name: Verify screenshots are declared and present
        run: make docs-shots-verify

  freshness:
    runs-on: ubuntu-latest
    # contents:write only so the failure path below can publish its recapture
    # to the throwaway ci/docs-shots-recapture ref; fork PRs still get a
    # read-only token, so this widens nothing for outside contributors.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install web deps
        run: cd web && npm ci
      - name: Recapture and compare against the committed screenshots
        run: make docs-shots-check
      # On drift, publish this job's own recapture. CI is the canonical raster
      # environment (fonts, freetype, the pinned browser image all pinned by the
      # runner); a contributor whose machine rasterizes differently (a sandboxed
      # or air-gapped host) adopts these PNGs instead of fighting a sub-percent
      # environmental diff their capture can never close.
      - name: Upload the recaptured screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-shots-recapture
          path: .docs-shots-tmp/
          # The recapture dir is dot-prefixed (gitignored working dir), and v4
          # skips hidden paths by default, which uploads nothing.
          include-hidden-files: true
      # The same recapture as a force-pushed throwaway ref, for environments
      # whose egress can reach git but not the artifact storage (a sandboxed
      # agent session). Fetch with:
      #   git fetch origin ci/docs-shots-recapture
      - name: Publish the recapture to the ci ref
        if: failure()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f .docs-shots-tmp
          git commit -m "ci: docs-shots recapture for ${{ github.sha }} [skip ci]"
          git push -f origin HEAD:refs/heads/ci/docs-shots-recapture
