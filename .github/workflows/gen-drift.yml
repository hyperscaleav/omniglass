name: gen-drift

# The generation drift gate api-first.md promises: the committed generated
# artifacts (OpenAPI, the cobra tree, the MCP tool catalog and its reference, the
# CLI reference, the ERD, the typed SPA
# client, the protobuf wire) must match what `make gen` produces from the Go
# source of truth. A stale artifact means a route change shipped without its
# regeneration; this fails the PR instead of leaving it to the reviewer.
#
# The diff is scoped to the generated paths (not the whole tree) so an
# incidental lockfile refresh from `npm install` can never false-positive the
# gate.

# Selective (#2597): the generated artifacts span Go, web and the generated docs
# pages, so a push that touches none of them reports a pass without running.
# The job always runs, since gen-drift is a required check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue (#2181) runs the required checks on each queue entry: the
  # PR on top of current main. A queue entry has its own ref, so the
  # concurrency group below keeps one run per entry.
  merge_group:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: gen-drift-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these pinned in step with the Makefile's gen-proto comment: protoc and
  # protoc-gen-go versions decide the generated bytes, so a mismatch here reads
  # as drift that no local regeneration can fix.
  PROTOC_VERSION: "34.1"
  PROTOC_GEN_GO_VERSION: "v1.36.11"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gen: ${{ steps.what.outputs.gen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            .github/actions
          persist-credentials: false

      - uses: ./.github/actions/changes
        id: what
        with:
          token: ${{ github.token }}

  gen-drift:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Does this push need the drift check?
        id: gate
        env:
          GEN: ${{ needs.changes.outputs.gen }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          if [ "$CHANGES" != success ]; then echo "::error::the change lookup ${CHANGES}"; exit 1; fi
          if [ "$GEN" != true ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "No generated artifact can have changed: nothing to run."; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc

      - name: Install pinned protoc and protoc-gen-go
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"

      # erdgen applies the embedded migrations to a throwaway testcontainer
      # Postgres and introspects it; ubuntu-latest ships the Docker daemon.
      - name: Regenerate everything
        if: steps.gate.outputs.run == 'true'
        run: make gen

      - name: Fail on drift in the generated artifacts
        if: steps.gate.outputs.run == 'true'
        run: |
          git diff --exit-code -- \
            api/openapi.json \
            api/openapi.yaml \
            internal/cli/api_gen.go \
            internal/mcp/catalog_gen.go \
            docs/src/content/docs/reference/cli/index.md \
            docs/src/content/docs/reference/mcp/index.md \
            docs/src/content/docs/architecture/data-model.md \
            web/src/api/ \
            proto/og/v1/ \
            docs/src/generated/ \
          || { echo '::error::generated artifacts are stale; run `make gen` and commit the result'; exit 1; }
