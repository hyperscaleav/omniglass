name: gen-drift

# The generation drift gate api-first.md promises: the committed generated
# artifacts (OpenAPI, the cobra tree, the CLI reference, the ERD, the typed SPA
# client, the protobuf wire) must match what `make gen` produces from the Go
# source of truth. A stale artifact means a route change shipped without its
# regeneration; this fails the PR instead of leaving it to the reviewer.
#
# The diff is scoped to the generated paths (not the whole tree) so an
# incidental lockfile refresh from `npm install` can never false-positive the
# gate.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gen-drift-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these pinned in step with the Makefile's gen-proto comment: protoc and
  # protoc-gen-go versions decide the generated bytes, so a mismatch here reads
  # as drift that no local regeneration can fix.
  PROTOC_VERSION: "34.1"
  PROTOC_GEN_GO_VERSION: "v1.36.11"

jobs:
  gen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned protoc and protoc-gen-go
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"

      # erdgen applies the embedded migrations to a throwaway testcontainer
      # Postgres and introspects it; ubuntu-latest ships the Docker daemon.
      - name: Regenerate everything
        run: make gen

      - name: Fail on drift in the generated artifacts
        run: |
          git diff --exit-code -- \
            api/openapi.json \
            api/openapi.yaml \
            internal/cli/api_gen.go \
            docs/src/content/docs/reference/cli/index.md \
            docs/src/content/docs/architecture/data-model.md \
            web/src/api/ \
            proto/og/v1/ \
            docs/src/generated/ \
          || { echo '::error::generated artifacts are stale; run `make gen` and commit the result'; exit 1; }
