name: walkthrough

# Walkthroughs as PR evidence (#925, #939). Applying the `run:walkthrough` label
# records the PR's walkthroughs (web/e2e/walkthroughs/*.yaml) on the walkthrough
# stack, exactly as `make walkthroughs` does locally, then:
#
# - uploads the recorder's output as a workflow artifact (it keeps a failed
#   walkthrough's partial stills too);
# - commits each passing walkthrough's mp4, animated preview (preview.webp,
#   #937), poster and per-step stills under <id>/ to the PR's own evidence ref,
#   refs/walkthroughs/pr-<n> (#939), never to the PR branch: the PR head and its
#   checks are untouched, a squash-merge carries none of it into main, and a
#   ref outside refs/heads/ is not fetched by a default clone, while GitHub's
#   raw host and jsDelivr serve its commits by SHA like any other;
# - upserts one PR comment (found again by its marker, the preview comment's
#   pattern) leading each walkthrough with a "Watch (scrubbable)" link to its
#   mp4 through jsDelivr (video/mp4 with range requests, so the browser's player
#   seeks), then its animated preview, its poster and folded stills by the raw
#   host, all pinned to the evidence commit's SHA, linking the run and the
#   artifact, and naming any walkthrough that failed. A failed walkthrough fails
#   the job: a walkthrough is a test.
#
# Which walkthroughs: for a PR that changes nothing under web/ but scripts, the
# scripts it adds or changes; otherwise every one (web/e2e/walkthroughpr.mjs,
# unit-tested). The run records the branch tip at run time. Re-run the job, or
# remove and re-add the label, to record the current head again; the comment
# updates in place. GitHub runs no pull_request workflow on a PR with merge
# conflicts, so resolve them first.
#
# No loop: the workflow runs only on the `labeled` event, never on a push, and
# GitHub starts no workflow for a push made with the workflow token; the only
# push is to the evidence ref anyway, which no workflow watches. Fork PRs are
# skipped: their token is read-only, and this job pushes. No untrusted input
# reaches a shell: event fields pass through env.
#
# The write token stays close: checkout persists no credential, so neither npm
# install scripts nor the containers that mount the repo can read one, and only
# the push step is handed the token. The upsert edits only a comment the
# workflow's own bot wrote.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  record:
    # On the job, not the workflow: every label applied starts this workflow,
    # and a workflow-level group would let an unrelated label's skipped run
    # cancel a recording in flight.
    concurrency:
      group: walkthrough-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: >-
      github.event.label.name == 'run:walkthrough' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Generous: building the image, the stack, and every walkthrough with its
    # mp4 and preview encodes; a wedged container must not hold the runner
    # for the default six hours.
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The branch tip at run time (not the event's SHA), so a re-run records
      # the current head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The recorder runs in the pinned Playwright container against the repo
      # mounted from the runner, so it needs the web deps installed here.
      - name: Install web deps
        run: cd web && npm ci

      - name: Choose the walkthroughs
        id: select
        run: |
          set -euo pipefail
          git diff --name-only "origin/${BASE_REF}...HEAD" >"$RUNNER_TEMP/changed.txt"
          ids=$(node web/e2e/walkthrough-pr.mjs select <"$RUNNER_TEMP/changed.txt")
          echo "ids=$ids" >>"$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "recording: $ids"

      # The walkthrough stack is all Docker (the simulator's NET_ADMIN is a
      # container capability inside its own namespace, as make test-netadmin
      # already uses on this runner). A failure is recorded, not fatal yet, so
      # the passing walkthroughs still reach the PR.
      - name: Record
        id: record
        env:
          IDS: ${{ steps.select.outputs.ids }}
        run: |
          # shellcheck disable=SC2086
          if bash web/e2e/walkthroughs.sh record $IDS; then
            echo "failed=0" >>"$GITHUB_OUTPUT"
          else
            echo "failed=1" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload the videos
        id: artifact
        if: ${{ !cancelled() && steps.select.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: walkthroughs-pr${{ github.event.pull_request.number }}
          path: |
            web/e2e/walkthroughs/out/
            !web/e2e/walkthroughs/out/_selftest/
          if-no-files-found: warn

      # Each run commits a fresh tree (only this run's passing walkthroughs, so
      # a removed step or a renamed or deleted script leaves nothing behind) on
      # top of the evidence ref's last commit, so an older comment's SHA stays
      # reachable, and fast-forwards the ref; an unchanged tree reuses the last
      # commit. The tree is built in a scratch index from a staging directory,
      # never from the checkout, so the PR branch is not touched. The token
      # reaches git only here, as a per-command header, never written to
      # .git/config.
      - name: Commit the evidence
        id: commit
        if: ${{ !cancelled() && steps.select.outcome == 'success' }}
        env:
          IDS: ${{ steps.select.outputs.ids }}
          HEAD_SHA: ${{ steps.select.outputs.head }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=web/e2e/walkthroughs/out
          ref=$(node web/e2e/walkthrough-pr.mjs ref "$PR")
          stage="$RUNNER_TEMP/evidence"
          mkdir -p "$stage"
          for id in $IDS; do
            if grep -qx "$id" "$out/failed.txt" 2>/dev/null || [ ! -f "$out/$id/walkthrough.json" ]; then
              continue
            fi
            # Assigned first, so a refused manifest fails the step (set -e does
            # not see a failure inside a for loop's word list).
            files=$(node web/e2e/walkthrough-pr.mjs files "$id")
            for f in $files; do
              if [ ! -f "$out/$f" ]; then
                echo "::warning::$id has no $f; it is left out of the evidence"
                continue
              fi
              mkdir -p "$stage/$(dirname "$f")"
              cp "$out/$f" "$stage/$f"
            done
          done
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          authed() { git -c "http.https://github.com/.extraheader=$auth" "$@"; }
          parent=$(authed ls-remote origin "$ref" | cut -f1)
          parents=()
          if [ -n "$parent" ]; then
            authed fetch -q --no-tags origin "$parent"
            parents=(-p "$parent")
          fi
          git_dir=$(git rev-parse --absolute-git-dir)
          export GIT_INDEX_FILE="$RUNNER_TEMP/evidence.index"
          git --git-dir="$git_dir" --work-tree="$stage" -C "$stage" add -A .
          tree=$(git --git-dir="$git_dir" write-tree)
          if [ -n "$parent" ] && [ "$(git rev-parse "${parent}^{tree}")" = "$tree" ]; then
            sha=$parent
            echo "evidence unchanged at $sha"
          else
            sha=$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
                  commit-tree "$tree" "${parents[@]}" -m "ci: walkthrough evidence for #${PR} at ${HEAD_SHA:0:7}")
            authed push -q origin "${sha}:${ref}"
            echo "committed $sha to $ref"
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Upsert the walkthrough comment
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.select.outputs.ids }}
          SHA: ${{ steps.commit.outputs.sha }}
          HEAD_SHA: ${{ steps.select.outputs.head }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          MARKER='<!-- omniglass-walkthrough -->'
          node web/e2e/walkthrough-pr.mjs comment >"$RUNNER_TEMP/body.md"
          # Slurp every page into one array and match the marker through a jq
          # --arg, so it is never interpolated into the filter. Only the bot's
          # own comment counts: anyone can paste the marker into theirs.
          cid=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
                | jq -rs --arg m "$MARKER" 'add | map(select(.user.login == "github-actions[bot]" and (.body | contains($m))))[0].id // empty')
          if [ -n "$cid" ]; then
            gh api "repos/${REPO}/issues/comments/${cid}" -X PATCH -F body=@"$RUNNER_TEMP/body.md" >/dev/null
            echo "updated comment $cid"
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -X POST -F body=@"$RUNNER_TEMP/body.md" >/dev/null
            echo "created comment"
          fi

      - name: Fail on a failed walkthrough
        if: ${{ steps.record.outputs.failed == '1' }}
        run: |
          out=web/e2e/walkthroughs/out
          if [ ! -f "$out/stack-up" ]; then
            echo "the walkthrough stack never came up, so no walkthrough ran (see the Record step)" >&2
          elif [ -s "$out/failed.txt" ]; then
            echo "walkthroughs failed: $(tr '\n' ' ' <"$out/failed.txt")" >&2
          else
            echo "the recording failed after the walkthroughs (see the Record step)" >&2
          fi
          exit 1
