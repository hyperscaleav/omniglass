name: pr-title

# The squash-merge subject is the PR title, and a release's generated notes
# list it. This lints the title to the conventional-commit grammar the repo uses
# so a malformed title cannot reach `main` or a release branch. The version
# itself comes from the release branch, not the titles (#2139).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # `lint` is a required check, so it must report on each merge queue entry
  # (#2181). A queue entry has no PR title to read; the title was linted on the
  # PR before it could be queued, so the job passes there without reading one.
  merge_group:

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Pass in the merge queue (the title was linted on the PR)
        if: github.event_name == 'merge_group'
        run: echo "The PR title was linted on the pull request before it was queued."

      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The conventional-commit types from CLAUDE.md. ci/chore/docs/refactor/
          # test do not trigger a release; feat/fix/perf do.
          types: |
            feat
            fix
            docs
            ci
            chore
            refactor
            test
            perf
          requireScope: false
          # CONTRIBUTING: the description starts lowercase.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject "{subject}" must start with a lowercase letter,
            e.g. "feat: add the thing", not "feat: Add the thing".
