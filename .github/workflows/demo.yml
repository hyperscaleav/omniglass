name: demo

# Demos as PR evidence (#925, #939, #1132). A demo is a recording of the PR's
# feature working, made by one of two recorders: a terminal demo, a VHS tape
# (scripts/demo/<id>.tape) typed into a real terminal, for CLI and API work; or
# a walkthrough, a Playwright script (web/e2e/walkthroughs/<id>.yaml) played in
# the console, for a console flow. Applying the `run:demo` label (its earlier
# name, `run:walkthrough`, still works) records the PR's demos on the
# walkthrough stack, exactly as `make demo` does locally, then:
#
# - uploads the recorders' output as a workflow artifact (it keeps a failed
#   demo's partial output, and the stack's logs);
# - commits each passing demo's files under <id>/ to the PR's own evidence
#   ref, refs/walkthroughs/pr-<n> (#939, ADR-0149; named when walkthroughs were
#   the only demos), never to the PR branch: a terminal demo's GIF and MP4, a
#   walkthrough's mp4, animated preview (#937), poster and per-step stills. The
#   PR head and its checks are untouched, a squash-merge carries none of it
#   into main, and a ref outside refs/heads/ is not fetched by a default clone,
#   while GitHub's raw host and jsDelivr serve its commits by SHA like any
#   other;
# - upserts one PR comment listing every demo (found again by its marker, or
#   by the walkthrough comment's earlier one): each leads with a "Watch
#   (scrubbable)" link to its video through jsDelivr (video/mp4 with range
#   requests, so the browser's player seeks), then what plays inline from the
#   raw host (a terminal demo's GIF; a walkthrough's animated preview, poster
#   and folded stills), all pinned to the evidence commit's SHA, linking the
#   run and the artifact, and naming any demo that failed. A failed demo fails
#   the record job: a demo is a test.
#
# Which demos (web/e2e/walkthroughpr.mjs selectDemos, unit-tested): the tapes
# and walkthrough scripts the PR adds or changes; every tape when it changes
# the terminal recorder, every walkthrough when it changes anything else under
# web/; every demo when it changes the stack both play on, or names none. The
# run records the branch tip at run time. Re-run the workflow, or remove and
# re-add the label, to record the current head again; the comment updates in
# place. GitHub runs no pull_request workflow on a PR with merge conflicts, so
# resolve them first. demo-prune.yml deletes an evidence ref 30 days after its
# PR closes.
#
# Two jobs, so no write token ever shares a runner with the PR's code. `record`
# runs the PR's code (npm install scripts, both recorders and every command a
# tape types, the walkthrough-pr.mjs that stages the evidence and writes the
# comment) with a read-only token, and hands the staged files and the comment
# body on as an artifact. `publish` holds the write token, checks nothing out
# and runs nothing from the PR: it builds the evidence commit in a fresh
# repository under a random temporary directory with no global, system, hook
# or fsmonitor configuration, pushes only to the ref it derives from the
# event's PR number, and upserts the comment with gh. An earlier step on the
# same runner can plant a git config, a hook, an env var or a PATH entry for
# every later step ($GITHUB_ENV, $GITHUB_PATH, ~/.gitconfig); a separate job on
# a fresh runner shares none.
#
# No loop: the workflow runs only on the `labeled` event, never on a push, and
# GitHub starts no workflow for a push made with the workflow token; the only
# push is to the evidence ref anyway, which no workflow watches. Fork PRs are
# skipped. No untrusted input reaches a shell: event fields pass through env.
# The upsert edits only a comment the workflow's own bot wrote.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  record:
    # On the job, not the workflow: every label applied starts this workflow,
    # and a workflow-level group would let an unrelated label's skipped run
    # cancel a recording in flight.
    concurrency:
      group: demo-record-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: >-
      (github.event.label.name == 'run:demo' || github.event.label.name == 'run:walkthrough') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # Generous: building the images, a stack per recorder, and every demo with
    # its encodes; a wedged container must not hold the runner for the
    # default six hours.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The branch tip at run time (not the event's SHA), so a re-run records
      # the current head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Choose the demos
        id: select
        run: |
          set -euo pipefail
          git diff --name-only "origin/${BASE_REF}...HEAD" >"$RUNNER_TEMP/changed.txt"
          ids=$(node web/e2e/walkthrough-pr.mjs select <"$RUNNER_TEMP/changed.txt")
          walkthroughs=0
          for id in $ids; do
            if [ -f "web/e2e/walkthroughs/$id.yaml" ]; then walkthroughs=1; fi
          done
          echo "ids=$ids" >>"$GITHUB_OUTPUT"
          echo "walkthroughs=$walkthroughs" >>"$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "recording: $ids"

      # The walkthrough recorder runs in the pinned Playwright container against
      # the repo mounted from the runner, so it needs the web deps installed
      # here; the terminal recorder needs none.
      - name: Install web deps
        if: ${{ steps.select.outputs.walkthroughs == '1' }}
        run: cd web && npm ci

      # Each recorder brings up a walkthrough stack of its own, all in Docker
      # (the simulator's NET_ADMIN is a container capability inside its own
      # namespace, as make test-netadmin already uses on this runner). A
      # failure is recorded, not fatal yet, so the passing demos still reach
      # the PR.
      - name: Record
        id: record
        env:
          IDS: ${{ steps.select.outputs.ids }}
        run: |
          # shellcheck disable=SC2086
          if bash web/e2e/demo.sh record $IDS; then
            echo "failed=0" >>"$GITHUB_OUTPUT"
          else
            echo "failed=1" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload the recordings
        id: artifact
        if: ${{ !cancelled() && steps.select.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: demos-pr${{ github.event.pull_request.number }}
          path: |
            web/e2e/walkthroughs/out/
            scripts/demo/out/
            !web/e2e/walkthroughs/out/_selftest/
            !scripts/demo/out/_selftest/
          if-no-files-found: warn

      # The evidence is staged here, by the PR's code and with no write token:
      # the files each passing demo's evidence carries (a fresh set, so a
      # removed step or a renamed or deleted demo leaves nothing behind), the
      # ref they go to, and the comment body, written against a placeholder SHA
      # that publish swaps for the evidence commit's once it exists.
      - name: Stage the evidence
        id: stage
        if: ${{ !cancelled() && steps.select.outcome == 'success' }}
        env:
          IDS: ${{ steps.select.outputs.ids }}
          HEAD_SHA: ${{ steps.select.outputs.head }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/evidence"
          mkdir -p "$stage/tree"
          node web/e2e/walkthrough-pr.mjs stage "$stage/tree"
          node web/e2e/walkthrough-pr.mjs ref "$PR" >"$stage/ref"
          # walkthroughpr.mjs PENDING_SHA, which publish replaces.
          SHA=0000000000000000000000000000000000000000 node web/e2e/walkthrough-pr.mjs comment >"$stage/body.md"
          echo "staged=true" >>"$GITHUB_OUTPUT"

      - name: Upload the evidence
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Fail on a failed demo
        if: ${{ steps.record.outputs.failed == '1' }}
        run: |
          for pair in "web/e2e/walkthroughs/out:walkthroughs" "scripts/demo/out:terminal demos"; do
            out=${pair%%:*}
            if [ -s "$out/failed.txt" ]; then
              echo "${pair#*:} failed: $(tr '\n' ' ' <"$out/failed.txt")" >&2
            fi
          done
          echo "a demo failed, or a recorder's stack never came up (the Record step says which)" >&2
          exit 1

  publish:
    needs: record
    # Runs whether or not a demo failed (record then fails), so the passing
    # ones still reach the PR; not when nothing was staged.
    if: ${{ !cancelled() && needs.record.outputs.staged == 'true' }}
    # Its own group, queued rather than cancelled, so a new run's recording
    # never cancels an older run's publish mid-push, or the reverse.
    concurrency:
      group: demo-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demo-evidence-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/evidence

      # Each run commits the staged tree on top of the evidence ref's last
      # commit, so an older comment's SHA stays reachable, and fast-forwards
      # the ref; an unchanged tree reuses the last commit. Nothing from the PR
      # runs here: git, in a fresh repository under a random directory, with
      # no global or system config and hooks and fsmonitor off, so neither the
      # staged files nor anything an earlier job wrote can configure it. The
      # ref is derived from the event's PR number and must equal the staged
      # one. The token reaches git only as a per-command header.
      - name: Commit the evidence
        id: commit
        env:
          PUSH_TOKEN: ${{ github.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/evidence"
          ref="refs/walkthroughs/pr-${PR}"
          if [ "$(cat "$staged/ref")" != "$ref" ]; then
            echo "the staged ref is not $ref; refusing to push" >&2
            exit 1
          fi
          repo=$(mktemp -d)
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          g() {
            git --git-dir="$repo/.git" -c core.hooksPath=/dev/null -c core.fsmonitor=false \
              -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com "$@"
          }
          authed() { g -c "http.https://github.com/.extraheader=$auth" "$@"; }
          git -c core.hooksPath=/dev/null init -q "$repo"
          url="https://github.com/${REPO}.git"
          parents=()
          parent=""
          if [ -n "$(authed ls-remote "$url" "$ref")" ]; then
            authed fetch -q --no-tags --depth=1 "$url" "+${ref}:refs/evidence/parent"
            parent=$(g rev-parse refs/evidence/parent)
            parents=(-p "$parent")
          fi
          g --work-tree="$staged/tree" -C "$staged/tree" add -A .
          tree=$(g write-tree)
          if [ -n "$parent" ] && [ "$(g rev-parse "${parent}^{tree}")" = "$tree" ]; then
            sha=$parent
            echo "evidence unchanged at $sha"
          else
            sha=$(g commit-tree "$tree" "${parents[@]}" -m "ci: demo evidence for #${PR}")
            authed push -q "$url" "${sha}:${ref}"
            echo "committed $sha to $ref"
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # The body was written by record against a placeholder SHA
      # (walkthroughpr.mjs PENDING_SHA); it is pinned to the evidence commit
      # here, and must open with the demo marker. Slurp every page into one
      # array and match the markers through jq --arg, so neither is ever
      # interpolated into the filter. Only the bot's own comment counts, and
      # only one that opens with a marker (the demo comment's, or the
      # walkthrough comment's earlier one, which this run takes over): anyone
      # can paste a marker into theirs.
      - name: Upsert the demo comment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- omniglass-demo -->'
          LEGACY='<!-- omniglass-walkthrough -->'
          pending=0000000000000000000000000000000000000000
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit SHA: $SHA" >&2; exit 1; }
          body=$(cat "$RUNNER_TEMP/evidence/body.md")
          printf '%s\n' "${body//$pending/$SHA}" >"$RUNNER_TEMP/body.md"
          [ "$(head -n1 "$RUNNER_TEMP/body.md")" = "$MARKER" ] || { echo "the staged body does not open with the marker" >&2; exit 1; }
          cid=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
                | jq -rs --arg m "$MARKER" --arg l "$LEGACY" \
                  'add | map(select(.user.login == "github-actions[bot]" and ((.body | startswith($m)) or (.body | startswith($l)))))[0].id // empty')
          if [ -n "$cid" ]; then
            gh api "repos/${REPO}/issues/comments/${cid}" -X PATCH -F body=@"$RUNNER_TEMP/body.md" >/dev/null
            echo "updated comment $cid"
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -X POST -F body=@"$RUNNER_TEMP/body.md" >/dev/null
            echo "created comment"
          fi
