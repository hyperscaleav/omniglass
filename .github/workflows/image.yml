name: image

# Build the single container image (console embedded) and publish it to GHCR.
# On main it tags `latest` + the commit sha; on a PR it tags `pr-<n>` + the
# commit sha so the preview pipeline can pin a deploy to an exact build. On a
# release tag (v<version>) it tags `v<version>`, the image a release binary's
# `omniglass lab run` pulls (#1194).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege: read the repo, write packages (GHCR). Fork PRs get a
# read-only token, so the login and push steps are skipped for them.
permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No arm64 CI hardware: cross-compile the arm64 image, load it, and boot the
  # binary under QEMU. This is the only arm64 validation, and it gates the
  # publish below so a broken arm64 build never reaches the GHCR manifest.
  smoke-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Register QEMU for arm64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: omniglass:arm64-smoke
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the arm64 binary under emulation
        # `--help` is handled by cobra before any run mode, so it needs no DB
        # and exits 0 only if the cross-compiled arm64 binary actually runs.
        run: docker run --rm --platform linux/arm64 omniglass:arm64-smoke --help

  # The lab smoke (#1194): the user's path end to end, on a runner with only
  # Docker doing the work. `make` builds the image and the host binary from
  # this tree with one build id; ./bin/omniglass lab run brings up Postgres,
  # the server (which migrates and applies the boot seed) and the node with its
  # simulator; the smoke waits for the ready banner, proves the console and the
  # lab flag answer on the printed URL, stops it with Ctrl-C, and proves it
  # left nothing behind (scripts/lab-smoke.sh). It replaces the boot smoke: the
  # lab boots the same image against a real Postgres and serves the console.
  smoke-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the image and the host binary
        run: make

      - name: Bring a lab up, use it, and stop it
        run: bash scripts/lab-smoke.sh

      - name: Dump the lab's logs on failure
        if: failure()
        run: |
          for c in $(docker ps -aq --filter label=omniglass.lab); do
            echo "=== $(docker inspect -f '{{.Name}}' "$c") ==="; docker logs --tail 50 "$c" 2>&1 || true
          done

  build-push:
    # Only publish the multi-arch manifest once arm64 cross-build boots and a
    # lab on the amd64 image actually comes up end to end.
    needs: [smoke-arm64, smoke-lab]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        # On a pull_request, GITHUB_SHA is the merge commit, so type=sha would
        # tag sha-<merge>. The preview ApplicationSet pins image.tag to the PR
        # head_sha, so tag by the head sha instead, or the two never match and
        # the preview ImagePullBackOffs.
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A release tag stamps its version, which the image's
          # org.opencontainers.image.version label then carries too.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
