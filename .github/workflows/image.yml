name: image

# Publish the container image (console embedded) to GHCR, off the PR push path
# (#2597). A push to main tags `latest` + the commit sha; a release branch, the
# commit sha alone. Both are multi-arch, and gated by an arm64 boot under QEMU,
# which also runs on each merge queue entry so a broken arm64 build is caught
# before it lands. A PR push builds nothing here: the shared build in test.yml
# serves e2e and smoke-lab. A PR gets an image only with the `run:preview`
# label, a single amd64 image tagged `pr-<n>` + the head sha, so the preview
# pipeline can pin a deploy to an exact build (the layers come from the same
# BuildKit cache the shared build fills). A release's `v<version>` image is not
# built here: release.yml builds it inline before the binaries and stamps its
# digest into them (#1257). The lab smoke moved to test.yml with the shared
# build; its `smoke-lab` check name is unchanged.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    # labeled: adding run:preview publishes the PR's image.
    types: [opened, synchronize, reopened, labeled]
  # A queue entry's commit may never land, so nothing is published for it; only
  # the arm64 smoke runs.
  merge_group:

# Least privilege: read the repo, write packages (GHCR). Fork PRs get a
# read-only token, so the login and push steps are skipped for them.
permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No arm64 CI hardware: cross-compile the arm64 image, load it, and boot the
  # binary under QEMU. This is the only arm64 validation, and it gates the
  # publish below so a broken arm64 build never reaches the GHCR manifest.
  smoke-arm64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Register QEMU for arm64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: omniglass:arm64-smoke
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the arm64 binary under emulation
        # `--help` is handled by cobra before any run mode, so it needs no DB
        # and exits 0 only if the cross-compiled arm64 binary actually runs.
        run: docker run --rm --platform linux/arm64 omniglass:arm64-smoke --help

  build-push:
    # Only publish the multi-arch manifest once the arm64 cross-build boots. A
    # push to main or a release branch landed through the merge queue, which
    # already ran the lab smoke on it (test.yml).
    needs: smoke-arm64
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The PR preview image (#2597): only for a same-repo PR carrying `run:preview`,
  # one amd64 image rather than the multi-arch manifest. On a pull_request,
  # GITHUB_SHA is the merge commit, so type=sha would tag sha-<merge>; the
  # preview ApplicationSet pins image.tag to the PR head_sha, so tag by the head
  # sha instead, or the two never match and the preview ImagePullBackOffs.
  preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'run:preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'run:preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=pr

      - name: Build and push the amd64 preview image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
