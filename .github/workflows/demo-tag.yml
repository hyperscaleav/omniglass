name: demo-tag

# The demo tag lint (#1180). A PR names the demos it is about with a tag in its
# body's Demo section, a line of its own: `demo: <id> [<id>...]`, each a tape
# (scripts/demo/<id>.tape) or a walkthrough (web/e2e/walkthroughs/<id>.yaml),
# or `demo: none (<reason>)` for a PR with nothing to demo. The run:demo label
# (demo.yml) records exactly the tagged demos, plus any the PR adds or
# changes, so a missing tag, a malformed one, or one naming a demo the PR's
# tree does not have fails here, as the body is written, rather than when the
# label is applied. The parse and the check are walkthroughpr.mjs demoTag and
# selectDemos, unit-tested. The body reaches the script only through env.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # `lint` is a required check, so it must report on each merge queue entry
  # (#2181). A queue entry has no PR body to read; the tag was linted on the PR
  # before it could be queued, so the job passes there without reading one.
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    # Dependabot's version bumps (#66) carry a body it writes itself, which never
    # tags a demo, and a bump has none to tag. Skipped by author at the job, so
    # the check reads as passed for them while every human PR is still held to
    # the tag. On merge_group there is no pull_request, so the condition holds
    # and the job runs its one merge-queue step.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Pass in the merge queue (the tag was linted on the PR)
        if: github.event_name == 'merge_group'
        run: echo "The demo tag was linted on the pull request before it was queued."

      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check the PR body's demo tag
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node web/e2e/walkthrough-pr.mjs tag
