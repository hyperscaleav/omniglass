name: docs-build

# The docs build gate docs-with-everything.md promises: the Astro site builds
# on every PR that touches it, so a broken .mdx page, a dead import, or an
# invalid frontmatter schema fails the PR instead of the next deploy.
#
# The build is hermetic by design: the D2 diagrams are pre-rendered SVGs
# committed under docs/public/d2/ (astro-d2 runs with skipGeneration), so no
# d2 binary is needed here.

on:
  pull_request:
    # ready_for_review runs a draft's skipped checks; labeled starts a draft's opt-in (run:test).
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - docs/**
      - api/openapi.yaml
  push:
    branches: [main, "release/**"]
    paths:
      - docs/**
      - api/openapi.yaml

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'push' }}
  cancel-in-progress: true

jobs:
  build:
    # A draft runs none of this (#2309): marking it ready runs it on the current
    # head, and a run:test label on a draft opts in. The job reports skipped on a
    # draft, so the check is not missing. Pushes and queue entries always run.
    if: >-
      github.event_name != 'pull_request'
      || ((!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run:test'))
        && (github.event.action != 'labeled' || github.event.label.name == 'run:test'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs

      - name: Build the docs site
        run: pnpm build
        working-directory: docs
