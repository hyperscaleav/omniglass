name: goreleaser

# Validate the cross-platform release build. On a pull request that touches the
# release config, build the whole matrix as a snapshot (no tag, no publish) and
# upload the archives as workflow artifacts, so the release build is validated
# and downloadable before merge. Releases themselves are built only by
# release.yml, which builds the image first and stamps its digest into each
# binary (#1257); a pushed `v*` tag triggers nothing here.

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/goreleaser.yml
      - go.mod
      - go.sum
      - cmd/omniglass/**

permissions:
  contents: read

jobs:
  # PR validation: build the whole matrix as a snapshot (no tag, no publish) and
  # upload the archives so they can be downloaded and smoke-tested.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node (for the embedded console build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Upload snapshot binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omniglass-binaries-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
