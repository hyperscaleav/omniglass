  /principals/{id}:enable:
    post:
      description: Re-enables a disabled principal, restoring its ability to authenticate. Gated by principal:update (all-scope).
      operationId: enable-principal
      parameters:
        - description: The principal, addressed by its uuid or a human username
          in: path
          name: id
          required: true
          schema:
            description: The principal, addressed by its uuid or a human username
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Enable a principal
      x-omniglass-permission: principal:update
  /principals/{id}:impersonate:
    post:
      description: Mints a bounded, revocable token to view as (read-only) or act as (full) the target. Gated by principal:impersonate (all-scope). Refused on self, on an owner target (owners are un-impersonatable by anyone), when it would grant a capability the caller lacks (the escalation guard), or from within an existing impersonation.
      operationId: impersonate-principal
      parameters:
        - description: The principal to impersonate, addressed by its uuid or a human username
          in: path
          name: id
          required: true
          schema:
            description: The principal to impersonate, addressed by its uuid or a human username
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpersonateInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonateOutputBody"
          description: Created
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Impersonate a principal (view-as or act-as)
      x-omniglass-permission: principal:impersonate
  /principals/{id}:purge:
    post:
      description: Hard-deletes an archived principal and its owned rows (profile, credentials, grants, memberships); the audit trail is preserved. Irreversible. Gated by principal:purge:admin (admin-sensitive, all-scope), and the principal must be archived first.
      operationId: purge-principal
      parameters:
        - description: The principal, addressed by its uuid or a human username
          in: path
          name: id
          required: true
          schema:
            description: The principal, addressed by its uuid or a human username
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Purge a principal
      x-omniglass-permission: principal:purge:admin
  /principals/{id}:removeAvatar:
    post:
      description: Clears another human principal's profile picture. Gated by principal:set-avatar (all-scope). Removing an absent picture is a no-op. Audited with the administrator as the actor.
      operationId: remove-principal-avatar
      parameters:
        - description: The principal, addressed by its uuid or a human username
          in: path
          name: id
          required: true
          schema:
            description: The principal, addressed by its uuid or a human username
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a principal's profile picture
      x-omniglass-permission: principal:set-avatar
  /principals/{id}:resetPassword:
    post:
      description: Sets a new password for another human principal (an administrator action; the target's current password is not required). Gated by principal:reset-password (all-scope). The new password must meet the password policy; a violation is a 422. Refused on yourself (change your own password from your profile, which verifies your current one), on an owner (owners cannot be reset by anyone), or when it would exceed the caller's own capabilities (the takeover guard, shared with impersonation). The action is audited with the administrator as the actor.
      operationId: reset-principal-password
      parameters:
        - description: The principal, addressed by its uuid or a human username
          in: path
          name: id
          required: true
          schema:
            description: The principal, addressed by its uuid or a human username
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reset a principal's password
      x-omniglass-permission: principal:reset-password
  /principals/{id}:restore:
    post:
      description: "Reverses an archive: the account is restored to active and can authenticate again. Gated by principal:archive (all-scope)."
      operationId: restore-principal
      parameters:
        - description: The principal, addressed by its uuid or a human username
          in: path
          name: id
          required: true
          schema:
            description: The principal, addressed by its uuid or a human username
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Restore a principal
      x-omniglass-permission: principal:archive
  /principals/{id}:setAvatar:
    post:
      description: Sets another human principal's profile picture (an administrator action). Gated by principal:set-avatar (all-scope). The image (JPEG, PNG, or WebP, base64-encoded) is normalized server-side to a 256x256 JPEG; a bad or oversize image is a 422. Audited with the administrator as the actor.
      operationId: set-principal-avatar
      parameters:
        - description: The principal, addressed by its uuid or a human username
          in: path
          name: id
          required: true
          schema:
            description: The principal, addressed by its uuid or a human username
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvatarInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set a principal's profile picture
      x-omniglass-permission: principal:set-avatar
  /products:
    get:
      description: Lists the product registry, ordered alphabetically by display name. Each product carries its vendor, driver, kind, and component_type. Gated by product:read.
      operationId: list-products
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProductsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List products
      x-omniglass-permission: product:read
    post:
      description: Creates a custom (non-official) product, classified under a component_type. kind and component_type are both required; kind refuses vm (retired, folded into app). Gated by product:create.
      operationId: create-product
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a product
      x-omniglass-permission: product:create
  /products/{id}:
    delete:
      description: Deletes a custom product, refused if official (422) or still referenced by a component (409). Gated by product:delete.
      operationId: delete-product
      parameters:
        - description: The product id
          in: path
          name: id
          required: true
          schema:
            description: The product id
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a product
      x-omniglass-permission: product:delete
    get:
      description: Fetches a product by its name or its uuid. Either form resolves, so `omniglass product get acme-soundbar` and the uuid are interchangeable. Gated by product:read.
      operationId: get-product
      parameters:
        - description: The product id
          in: path
          name: id
          required: true
          schema:
            description: The product id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a product
      x-omniglass-permission: product:read
    patch:
      description: Patches a custom product's display_name, vendor, driver, kind, component_type, icon, or parent. component_type is required, so an empty string on it is a 422 (a reclassify names a real type; it never clears). Official products are read-only (422). Gated by product:update.
      operationId: update-product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a product
      x-omniglass-permission: product:update
  /products/{id}/metrics:
    get:
      description: Lists the product's declared-metric contract (which metrics every instance of the product carries), ordered by metric name, each with its optional default and required flag. Gated by product:read.
      operationId: list-product-metrics
      parameters:
        - description: The product id
          in: path
          name: id
          required: true
          schema:
            description: The product id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProductMetricsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a product's declared metrics
      x-omniglass-permission: product:read
  /products/{id}/metrics/{metric}:
    delete:
      description: Removes one line from a custom product's contract; instances keep any samples the series already holds, now off-contract. A metric the product does not declare is a 404, and an official product is read-only (422). Gated by product:delete.
      operationId: delete-product-metric
      parameters:
        - description: The product id
          in: path
          name: id
          required: true
          schema:
            description: The product id
            type: string
        - description: The metric name
          in: path
          name: metric
          required: true
          schema:
            description: The metric name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw a metric from a product
      x-omniglass-permission: product:delete
    put:
      description: Declares a catalog metric on a custom product, or revises the declaration in place (the line is addressed by name, so the write is idempotent). Official products are read-only (422); an unknown product is a 404 and a metric the catalog does not know is a 422. Gated by product:update.
      operationId: set-product-metric
      parameters:
        - description: The product id
          in: path
          name: id
          required: true
          schema:
            description: The product id
            type: string
        - description: The metric name
          in: path
          name: metric
          required: true
          schema:
            description: The metric name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProductMetricInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMetricBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare a metric on a product
      x-omniglass-permission: product:update
  /products/{id}/properties:
    get:
      description: Lists the product's declared-property contract (what every instance of the product exposes), ordered by property name, each with its optional default and required flag. Gated by product:read.
      operationId: list-product-properties
      parameters:
        - description: The product id
          in: path
          name: id
          required: true
          schema:
            description: The product id
