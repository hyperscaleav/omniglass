components:
  schemas:
    AcceptedStruct:
      additionalProperties: false
      properties:
        events:
          format: int64
          type: integer
        logs:
          format: int64
          type: integer
        metrics:
          format: int64
          type: integer
        properties:
          format: int64
          type: integer
      required:
        - metrics
        - properties
        - events
        - logs
      type: object
    AddMemberInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AddMemberInputBody.json
          format: uri
          readOnly: true
          type: string
        principal_id:
          description: The principal to add to the group
          minLength: 1
          type: string
      required:
        - principal_id
      type: object
    AlarmBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AlarmBody.json
          format: uri
          readOnly: true
          type: string
        acknowledged:
          description: Whether anybody has recorded seeing this alarm; says nothing about whether it is still raised
          type: boolean
        acknowledged_at:
          description: When a human first recorded seeing this alarm; null while nobody has. Independent of cleared_at
          format: date-time
          type: string
        acknowledged_by:
          description: Who acknowledged it, by name; empty while unacknowledged, or once that principal has been purged (the audit log keeps the name)
          type: string
        active:
          type: boolean
        cleared_at:
          description: Null while the alarm is active
          format: date-time
          type: string
        component:
          type: string
        dedup_key:
          description: "The condition identity: one open alarm per (component, dedup_key)"
          type: string
        id:
          type: string
        message:
          type: string
        raised_at:
          format: date-time
          type: string
        severity:
          description: info, warning, or critical
          type: string
      required:
        - id
        - component
        - severity
        - message
        - dedup_key
        - raised_at
        - active
        - acknowledged
      type: object
    AuditEventBody:
      additionalProperties: false
      properties:
        actor:
          type: string
        actor_name:
          type: string
        id:
          type: string
        new:
          description: The row image after the write, absent on a delete
        old:
          description: The row image before the write, absent on a create
        real_actor:
          type: string
        real_actor_name:
          type: string
        resource:
          type: string
        resource_id:
          type: string
        ts:
          type: string
        verb:
          type: string
      required:
        - id
        - ts
        - verb
        - resource
      type: object
    AuditListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AuditListOutputBody.json
          format: uri
          readOnly: true
          type: string
        events:
          items:
            $ref: "#/components/schemas/AuditEventBody"
          type:
            - array
            - "null"
      required:
        - events
      type: object
    AuthStatusOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AuthStatusOutputBody.json
          format: uri
          readOnly: true
          type: string
        bootstrapped:
          type: boolean
      required:
        - bootstrapped
      type: object
    AvatarOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/AvatarOutputBody.json
          format: uri
          readOnly: true
          type: string
        image_base64:
          description: The profile picture as a base64-encoded 256x256 JPEG
          type: string
      required:
        - image_base64
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ChangePasswordInputBody.json
          format: uri
          readOnly: true
          type: string
        current_password:
          description: Your current password
          type: string
        new_password:
          description: The new password (at least 12 characters, not a common password, not containing the username)
          maxLength: 256
          minLength: 12
          type: string
      required:
        - current_password
        - new_password
      type: object
    CheckNameInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CheckNameInputBody.json
          format: uri
          readOnly: true
          type: string
        location:
          description: The location (by name or uuid) the entity would be placed at, if any and if unparented; ignored by the locations check
          type: string
        name:
          description: The proposed name to check
          type: string
        parent:
          description: The parent (by name or uuid) the entity would be created under, if any; omit for a root/unplaced check
          type: string
      required:
        - name
      type: object
    CheckNameOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CheckNameOutputBody.json
          format: uri
          readOnly: true
          type: string
        available:
          description: Whether the name is free within the checked placement (parent/location); a name taken elsewhere in the estate is still available here
          type: boolean
        reason:
          description: Human explanation when not valid or not available
          type: string
        valid:
          description: Whether the name matches the slug rule
          type: boolean
      required:
        - valid
        - available
      type: object
    ClaimNodeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ClaimNodeInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: The node name the enrollment was minted for
          minLength: 1
          type: string
        token:
          description: The one-time enrollment token from node create, exchanged here for the node's NATS credential
          minLength: 1
          type: string
      required:
        - name
        - token
      type: object
    ClaimOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ClaimOutputBody.json
          format: uri
          readOnly: true
          type: string
        nats_url:
          description: The NATS URL the node dials
          type: string
        password:
          description: The node's NATS password (its enrollment token)
          type: string
        username:
          description: The node's NATS username (its node name)
          type: string
      required:
        - nats_url
        - username
        - password
      type: object
    CommandOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CommandOutputBody.json
          format: uri
          readOnly: true
          type: string
        caused_event_id:
          description: The caused event this command recorded
          format: int64
          type: integer
        command_type:
          type: string
        id:
          format: int64
          type: integer
        instance:
          type: string
        settlement:
          description: The computed settlement verdict (none/pending/settled/failed)
          type: string
        status:
          description: The recorded command status (issued/settled/failed/timed-out); issued until a settle-check records the terminal outcome
          type: string
      required:
        - id
        - command_type
        - caused_event_id
        - settlement
        - status
      type: object
    CommandTypeBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CommandTypeBody.json
          format: uri
          readOnly: true
          type: string
        description:
          type: string
        display_name:
          type: string
        id:
          description: The command type's uuid, the stable form of name
          type: string
        name:
          type: string
        official:
          type: boolean
        params_schema:
          description: A JSON Schema fragment for the invocation params
        settle_window_seconds:
          description: How long the device is given to actuate before a mismatch is a failed command
          format: int64
          type: integer
        target_metric_type:
          description: The metric this command sets (the other arm of the arc; never set together with target_property_type)
          type: string
        target_property_type:
          description: The property this command sets (one arm of the exclusive target arc; empty for fire-and-forget or a metric target)
          type: string
      required:
        - id
        - name
        - settle_window_seconds
        - official
      type: object
    ComponentBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ComponentBody.json
          format: uri
          readOnly: true
          type: string
        actions:
          description: The scope-aware actions the caller may perform on this row (create a child, update, delete); a UI hint, the server still enforces.
          items:
            type: string
          type:
            - array
            - "null"
        display_name:
          type: string
        display_name_generated:
          description: "Whether the platform rendered this display name from a label rule rather than an operator typing it. Read-only: write display_name to claim it, write an empty display_name to hand it back."
          type: boolean
        effective_tags:
          additionalProperties:
            type: string
          description: The resolved effective tags (key -> winning value) that cascade onto this component; for the Tags column. Provenance is in the effective-tags detail view.
          type: object
        id:
          type: string
        location:
          description: The location's name, for display
          type: string
        location_id:
          description: The location's id, the canonical handle
          type: string
        name:
          type: string
        name_generated:
          description: Whether the platform picked this name (a server-side generator) rather than an operator typing it.
          type: boolean
        parent:
          description: The parent component's name, for display; absent for a root component
          type: string
        parent_id:
          description: The parent component's id, the canonical handle
          type: string
        path:
          description: "The dotted address (e.g. boi.17c.415a.$comp.display-1): derived from the component's own placement, never from a system it belongs to. Set on a GET or LIST response; empty on a create/update/move/rename/resetName response (refetch the row to see it)."
          type: string
        path_segments:
          description: path split on '.', accessors included, so the round trip through the resolver stays lossless.
          items:
            type: string
          type:
            - array
            - "null"
        product:
          description: The product's name, for display; the form a body round-trips.
          type: string
        product_id:
          description: The product (catalog SKU) this component is an instance of, if any; the stable handle that survives a rename.
          type: string
        renders:
          $ref: "#/components/schemas/RenderBody"
          description: "Two display-only compact forms of path, dash and bare. Neither is accepted back by the resolver: stripping/compacting is lossy."
        system:
          description: Name of the component's primary system, its default when no system is named. A component may belong to several; read /components/{name}/memberships for all of them.
          type: string
        system_count:
          description: How many systems this component belongs to; more than one means it is shared.
          format: int64
          type: integer
        system_id:
          description: The primary system's id, the canonical handle
          type: string
      required:
        - id
        - name
        - system_count
        - name_generated
        - display_name_generated
      type: object
    ComponentMetricsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ComponentMetricsOutputBody.json
          format: uri
          readOnly: true
          type: string
        component:
          type: string
        metrics:
          items:
            $ref: "#/components/schemas/EffectiveMetricBody"
          type:
            - array
            - "null"
      required:
        - component
        - metrics
      type: object
    ComponentPropertiesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ComponentPropertiesOutputBody.json
          format: uri
          readOnly: true
          type: string
        component:
          type: string
        properties:
          items:
            $ref: "#/components/schemas/EffectivePropertyBody"
          type:
            - array
            - "null"
      required:
        - component
        - properties
      type: object
    ComponentPropertyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ComponentPropertyBody.json
          format: uri
          readOnly: true
          type: string
        component:
          type: string
        property_type_id:
          description: The catalog property's uuid, the stable form of property_type_name
          type: string
        property_type_name:
          type: string
        value:
          description: The stored value, shape given by the property's data_type
        value_id:
          description: The stored value's id
          type: string
      required:
        - component
        - property_type_name
        - property_type_id
        - value
        - value_id
      type: object
    ComponentTypeBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/ComponentTypeBody.json
          format: uri
          readOnly: true
          type: string
        abbrev:
          description: A compact form of display_name; empty inherits the nearest ancestor's
          type: string
        default_tags:
          description: Tags every instance of this type (or a descendant that does not override) starts with
          items:
            type: string
          type:
            - array
            - "null"
        display_name:
          type: string
        forked:
          description: True when this shipped row carries changes of yours overriding it. Restore discards them
          type: boolean
        icon:
          description: A glyph key; empty inherits the nearest ancestor's
          type: string
        id:
          description: The component_type's uuid, the stable handle that survives a rename
          type: string
        label_rule:
          description: The label template instances of this type get; empty inherits the nearest ancestor's, then the global rule for components
          type: string
        name:
          description: The name an operator reads and types; renameable
          type: string
        official:
          description: "True for a row this release ships. A shipped row is never written by an operator: an edit forks it"
          type: boolean
        parent:
          description: The parent component_type's name, for display; absent for a root type
          type: string
        parent_id:
          description: The parent component_type's id, the canonical handle; absent for a root type
          type: string
        resolved_icon:
          description: "The glyph this type shows: its own icon, else the nearest ancestor's. Served on the registry listing, where the whole chain is already in hand; a single-row write response does not carry it"
          type: string
        stem:
          description: The auto-generated component name's prefix; empty inherits the nearest ancestor's
          type: string
      required:
        - id
        - name
        - display_name
        - default_tags
        - official
        - forked
      type: object
    CreateCommandTypeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateCommandTypeInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          description: What the command does
          type: string
        display_name:
          description: A human label
          type: string
        name:
          description: The command type name (lowercase kebab)
          minLength: 1
          type: string
        params_schema:
          description: A JSON Schema fragment for the params
        settle_window_seconds:
          description: "The actuation window in seconds: how long the device is given to actuate before a mismatch is a failed command. 0 means settle immediately (a fire-and-forget command, or a settleable one judged at the moment of issue). A duration has no negative, so the schema floors it at 0 rather than accepting a value that behaves as 0 with no refusal to say so."
          format: int64
          minimum: 0
          type: integer
        target_metric_type:
          description: The metric this command sets, for settlement (at most one target arm)
          type: string
        target_property_type:
          description: The property this command sets, for settlement (at most one target arm)
          type: string
      required:
        - name
      type: object
    CreateComponentInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateComponentInputBody.json
          format: uri
          readOnly: true
          type: string
        display_name:
          description: What an operator reads; the name is the address
          type: string
        expected_name:
          description: "The name a create form previewed (POST /components:renderLabel returns it). The create is refused with a 409 naming what it would produce instead, rather than silently landing a different name, if the number was taken or the type's stem moved while the form was open. It does not name the row (the platform still does, and the row is still name_generated): it only asserts what that name will be. Applies only when the platform names the row: sending it beside a name is a 422."
          maxLength: 100
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        location:
          description: Location name this component is placed at
          type: string
        name:
          description: Name, unique within its placement (the address; lowercase letters, digits, hyphens). Omit to have the platform generate one from the product's type.
          maxLength: 100
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        parent:
          description: Parent component name; omit for a root component
          type: string
        product:
          description: "Product (catalog SKU) this component is an instance of, by name or uuid. Required: use a generic (generic-device, generic-app, generic-service) until a real product is modeled."
          type: string
        system:
          description: Primary system name this component belongs to. Naming one writes that system's membership, so it costs the system:update permission and resolves in that scope; omitted, the create costs component:create alone.
          type: string
      type: object
    CreateComponentTypeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateComponentTypeInputBody.json
          format: uri
          readOnly: true
          type: string
        abbrev:
          description: A compact form of display_name; omit to inherit the parent's
          type: string
        default_tags:
          description: Tags every instance of this type starts with
          items:
            type: string
          type:
            - array
            - "null"
        display_name:
          description: What an operator reads in pickers and lists
          minLength: 1
          type: string
        icon:
          description: A glyph key; omit to inherit the parent's
          type: string
        label_rule:
          description: A Go text/template rendering the label of every instance of this type, over a closed map of that component's facts (Name, Ordinal, TypeName, TypeAbbrev, Stem, ProductName, VendorName) and the functions title, upper, lower, slug and words (words turns a kebab or snake name into the words in it, so {{title (words .Name)}} reads north-wing as North Wing). Omit to inherit the parent's, then the global component rule. A template that does not parse is refused here, 422.
          type: string
        name:
          description: The globally unique name
          maxLength: 100
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        parent_id:
          description: The parent component_type, by name or uuid; omit for a root type
          type: string
        stem:
          description: The auto-generated component name's prefix; omit to inherit the parent's. Lowercase letters, digits, and hyphens.
          maxLength: 100
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
      required:
        - name
        - display_name
      type: object
    CreateDriverInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateDriverInputBody.json
          format: uri
          readOnly: true
          type: string
        display_name:
          description: What an operator reads in pickers and lists
          minLength: 1
          type: string
        name:
          description: The globally unique name; renameable
          maxLength: 100
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
        version:
          description: A free-form version string, e.g. 1.0.0
          type: string
      required:
        - name
        - display_name
      type: object
    CreateEventTypeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateEventTypeInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          description: What the occurrence means
          type: string
        display_name:
          description: A human label
          type: string
        name:
          description: The event type name (lowercase kebab)
          minLength: 1
          type: string
        payload_schema:
          description: A JSON Schema fragment for the payload
      required:
        - name
      type: object
    CreateFileInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateFileInputBody.json
          format: uri
          readOnly: true
          type: string
        content:
          description: The file bytes, base64-encoded
          type: string
        content_type:
          description: The MIME type used to serve the file
          minLength: 1
          type: string
        name:
          description: The file's display name (a label, no path separators)
          minLength: 1
          type: string
        sensitive:
          description: Admin-only visibility; defaults false. Setting true requires the admin tier
          type: boolean
      required:
        - name
        - content_type
        - content
      type: object
    CreateGrantInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateGrantInputBody.json
          format: uri
          readOnly: true
          type: string
        role:
          description: A role id (viewer, operator, admin, owner, or a custom role)
          minLength: 1
          type: string
        scope_id:
          description: The scope root id; omit for the all scope
          type: string
        scope_kind:
          description: The scope kind; 'all' confers the whole estate (group-as-scope is unbuilt and not offered)
          enum:
            - all
            - location
            - system
            - component
          type: string
        scope_op:
          description: "How the scope root matches the tree: subtree (root + descendants, the default), subtree_excl_root (descendants only for update/delete, root kept for read/create), or self (the root row only). Moot for the all scope."
          enum:
            - subtree
            - subtree_excl_root
            - self
          type: string
      required:
        - role
        - scope_kind
      type: object
    CreateGroupGrantInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateGroupGrantInputBody.json
          format: uri
          readOnly: true
          type: string
        role:
          description: A role id (viewer, operator, admin, owner, or a custom role)
          minLength: 1
          type: string
        scope_id:
          description: The scope root id; omit for the all scope
          type: string
        scope_kind:
          description: The scope kind; 'all' confers the whole estate (group-as-scope is unbuilt and not offered)
          enum:
            - all
            - location
            - system
            - component
          type: string
        scope_op:
          description: How the scope root matches the tree; moot for the all scope
          enum:
            - subtree
            - subtree_excl_root
            - self
          type: string
      required:
        - role
        - scope_kind
      type: object
    CreateGroupInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateGroupInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          description: Free-form notes on what the group is for
          maxLength: 1000
          type: string
        display_name:
          description: What an operator reads in lists
          maxLength: 200
          type: string
        name:
          description: Unique group name (lowercase letters, digits, and hyphens)
          maxLength: 100
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]*$
          type: string
      required:
        - name
      type: object
    CreateInterfaceInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/CreateInterfaceInputBody.json
          format: uri
          readOnly: true
          type: string
        component:
          description: Owning component, by name or id; omit for a server-hosted interface (needs an all-scoped grant)
          type: string
        interface_type:
          description: An interface_type name (the protocol); the interface is named by it, unique within the component
          minLength: 1
          type: string
        node:
          description: Node placement, by name or id
          type: string
        params:
          description: Endpoint/target settings (jsonb)
      required:
        - interface_type
      type: object
    CreateLocationInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
