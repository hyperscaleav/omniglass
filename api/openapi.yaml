      description: The location's current verdict, worst-wins over every system placed anywhere beneath it, with those systems and their verdicts as the drill-down (the system health read names the role, which occupant is down, and the alarm). Transitions are the recorded edges over the last 30 days. Gated by location:read; an out-of-scope location is a non-disclosing 404.
      operationId: get-location-health
      parameters:
        - description: The location's name, or a dotted address (e.g. boi.17c.415a)
          in: path
          name: name
          required: true
          schema:
            description: The location's name, or a dotted address (e.g. boi.17c.415a)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstateHealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read a location's health
      x-omniglass-permission: location:read
  /locations/{name}/metrics:
    get:
      description: Every metric the location's type declares, resolved to the series' latest observed or calculated sample or the contract default until one arrives (is_sampled marks a live series), plus any metric sampled directly on the location (from_contract false). Gated by location:read; an out-of-scope location is a non-disclosing 404.
      operationId: list-location-metrics
      parameters:
        - description: The location's name, or a dotted address (e.g. boi.17c.415a)
          in: path
          name: name
          required: true
          schema:
            description: The location's name, or a dotted address (e.g. boi.17c.415a)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationMetricsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a location's effective metrics
      x-omniglass-permission: location:read
  /locations/{name}/properties:
    get:
      description: Every property the location's type declares, resolved to the location's own value or the contract default (is_set marks the override), plus any property set directly on the location (from_contract false). Gated by location:read; an out-of-scope location is a non-disclosing 404.
      operationId: list-location-properties
      parameters:
        - description: The location's name, or a dotted address (e.g. boi.17c.415a)
          in: path
          name: name
          required: true
          schema:
            description: The location's name, or a dotted address (e.g. boi.17c.415a)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationPropertiesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a location's effective properties
      x-omniglass-permission: location:read
  /locations/{name}/properties/{property}:
    delete:
      description: Removes the location's declared value, so the property falls back to the location type contract's default (or leaves the effective read entirely when it was off-contract). Clearing a property the location never set is a 404. Gated by location:update; an out-of-scope location is a non-disclosing 404.
      operationId: clear-location-property
      parameters:
        - description: The location's name, or a dotted address (e.g. boi.17c.415a)
          in: path
          name: name
          required: true
          schema:
            description: The location's name, or a dotted address (e.g. boi.17c.415a)
            type: string
        - description: The property name
          in: path
          name: property
          required: true
          schema:
            description: The property name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Clear a property on a location
      x-omniglass-permission: location:update
    put:
      description: "Declares a value for the property on this location, overriding the location type contract's default. Idempotent: the first set stores the value, a later set replaces it. The property need not be on the contract, but it must exist in the catalog (422 otherwise). Gated by location:update; an out-of-scope location is a non-disclosing 404."
      operationId: set-location-property
      parameters:
        - description: The location's name, or a dotted address (e.g. boi.17c.415a)
          in: path
          name: name
          required: true
          schema:
            description: The location's name, or a dotted address (e.g. boi.17c.415a)
            type: string
        - description: The property name
          in: path
          name: property
          required: true
          schema:
            description: The property name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLocationPropertyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationPropertyBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set a property on a location
      x-omniglass-permission: location:update
  /locations/{name}:listTags:
    get:
      description: Lists the tags bound directly on a location (not the resolved cascade). Gated by location:read.
      operationId: list-location-tags
      parameters:
        - description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
          in: path
          name: name
          required: true
          schema:
            description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTagsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List tags on a location
      x-omniglass-permission: location:read
  /locations/{name}:move:
    post:
      description: "Re-parents a location (a tree move): parent is required (422 if omitted), cycle-guarded, and placement-validated against the resolved location_type. Moving to root is not supported (422): MoveLocation gains no clear-to-root capability locations have never had. A separate act from update, and a separately grantable one (location:move), because a placement change is an authorization act, not a label edit. Recorded under its own audit verb, move, distinct from update. Does not recompute health. A taken name at the destination is a 409. A move can RENAME the location: a platform-generated name is scoped to its parent bucket, so a move that changes the parent re-mints the name and the ordinal under the new parent, from the same location_type name rule. A move that re-states the current parent leaves the name alone, and an operator-typed name is never touched. Gated by location:move; the read and move scopes drive the 404 versus 403 split."
      operationId: move-location
      parameters:
        - description: The location's name, or a dotted address (e.g. boi.17c.415a)
          in: path
          name: name
          required: true
          schema:
            description: The location's name, or a dotted address (e.g. boi.17c.415a)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveLocationInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Move a location
      x-omniglass-permission: location:move
  /locations/{name}:removeTag:
    post:
      description: Removes a key's value from a location. Gated by location:update.
      operationId: remove-location-tag
      parameters:
        - description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
          in: path
          name: name
          required: true
          schema:
            description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityRemoveTagInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a tag value from a location
      x-omniglass-permission: location:update
  /locations/{name}:rename:
    post:
      description: Moves the location's name, the address an operator types and every external reference stores. A separate act from an update, and a separately grantable one, because it breaks bookmarks, runbooks, and integration config outside this system; inside it nothing breaks, since every reference holds the uuid. A taken name is a 409, an illegal or uuid-shaped one a 422. Gated by location:rename; the read and rename scopes drive the 404 versus 403 split.
      operationId: rename-location
      parameters:
        - description: The location's current name, a dotted address, or its uuid
          in: path
          name: name
          required: true
          schema:
            description: The location's current name, a dotted address, or its uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameLocationInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rename a location
      x-omniglass-permission: location:rename
  /locations/{name}:resetName:
    post:
      description: "Hands the pen back to the platform, the same verb components and systems carry: the name is re-minted from the location_type's name rule and the lowest free ordinal in this placement, and name_generated goes back to true. A location_type carrying no name rule refuses (422), which is every type a shipped estate has: only a positional kind of place, one whose number is an arbitrary disambiguator rather than a designation read off the signage (a parking deck, a rack row), has a name the platform can generate, and an operator declares such a type themselves. Gated by location:rename, the same token :rename uses."
      operationId: reset-location-name
      parameters:
        - description: The location's name, or a dotted address (e.g. boi.17c.415a)
          in: path
          name: name
          required: true
          schema:
            description: The location's name, or a dotted address (e.g. boi.17c.415a)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Regenerate a location's name
      x-omniglass-permission: location:rename
  /locations/{name}:setTag:
    post:
      description: Binds a value for a key on a location. The key must exist and apply to this entity kind. Setting a value is the ordinary entity write, gated by location:update.
      operationId: set-location-tag
      parameters:
        - description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
          in: path
          name: name
          required: true
          schema:
            description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitySetTagInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBindingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set a tag value on a location
      x-omniglass-permission: location:update
  /locations:checkName:
    post:
      description: Reports whether a proposed name is a valid slug and currently free within the given placement (under the given parent, or among roots when no parent is given). Advisory (Save is still gated by the unique constraint). Gated by location:update.
      operationId: check-location-name
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckNameInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckNameOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check a location name
      x-omniglass-permission: location:update
  /locations:previewLabels:
    post:
      description: "Lists exactly the rows a recompute would change, and leaves the estate as it found it. Use it before :recomputeLabels to see the blast radius of a rule edit. Every generated label in the caller's read and update scope is re-rendered from its current rules and compared with what is stored; a label an operator typed by hand is never a candidate. Bounded by the same two scopes the apply is, so it never lists a row the apply would then refuse to touch. A location preview also lists the components and systems placed at every location whose label would move, because those go stale the moment it does. Gated by location:update, the same permission the apply needs: a preview is half of an edit rather than a report, and an operator who cannot apply has no use for it."
      operationId: preview-location-labels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelRecomputeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview a location label recompute
      x-omniglass-permission: location:update
  /locations:recomputeLabels:
    post:
      description: "Applies what :previewLabels describes, over the rows in the caller's read and update scope, and returns exactly what it changed. Idempotent: a second call changes nothing. A label an operator typed by hand is left alone, and clearing that label by hand is how it is handed back to the platform. Recorded as ONE audit row for the operation, naming the rule tier and the affected count, rather than one row per changed entity. Gated by location:update."
      operationId: recompute-location-labels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelRecomputeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Recompute location labels
      x-omniglass-permission: location:update
  /locations:renderLabel:
    post:
      description: The location tier of :renderLabel on components. Drafts the name and the label a location create would stamp, allocating nothing. A shipped estate answers from the global location rule, which reads the location's own name as words and titles it, so a location named north-wing drafts as North Wing; an empty label means no rule resolves at any tier, and the surface falls back to the name. Omitting name refuses (422) a location_type with no name rule, the same refusal a nameless create gives. Gated by location:create; the parent resolves within the caller's location:create scope, because a location's two placement buckets are under a parent or at the root and that is where the ordinal is read from. Omitting parent is the ROOT bucket, which a create refuses without an all-scoped grant, so the draft refuses it too (403) rather than reporting which names the estate root already holds.
      operationId: render-location-label
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderLocationLabelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftLabelOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Draft the name and label a location create would store
      x-omniglass-permission: location:create
  /metric-types:
