          in: path
          name: name
          required: true
          schema:
            description: The system's name, or a dotted address (e.g. boi.17c.$sys.av)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
