          required: true
          schema:
            description: Name of the system, or a dotted address (e.g. boi.17c.$sys.av)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSystemMembersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the components in a system
      x-omniglass-permission: system:read
