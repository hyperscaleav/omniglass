      operationId: create-property-type
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a property
      x-omniglass-permission: property_type:create
  /property-types/{name}:
    delete:
      description: Removes a custom property by name. Official properties are read-only. Gated by property_type:delete.
      operationId: delete-property-type
      parameters:
        - description: The property's name
          in: path
          name: name
          required: true
          schema:
            description: The property's name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a property
      x-omniglass-permission: property_type:delete
    get:
      description: Returns one property by name. Gated by property_type:read.
      operationId: get-property-type
      parameters:
        - description: The property's name
          in: path
          name: name
          required: true
          schema:
            description: The property's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a property
      x-omniglass-permission: property_type:read
    patch:
      description: Patches a custom property's label, description, or validation (a nil field is unchanged). Data type is fixed at creation. Official properties are read-only. Gated by property_type:update.
      operationId: update-property-type
      parameters:
        - description: The property's name
          in: path
          name: name
          required: true
          schema:
            description: The property's name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a property
      x-omniglass-permission: property_type:update
  /roles:
    get:
      description: Lists the roles with their metadata and effective (flattened) permissions. Gated by the role:read:admin capability.
      operationId: list-roles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List roles
      x-omniglass-permission: role:read:admin
  /secret-types:
    get:
      description: Lists the secret_type shapes a secret can take, for the create form. Gated by secret:read.
      operationId: list-secret-types
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSecretTypesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List secret types
      x-omniglass-permission: secret:read
  /secrets:
    get:
      description: Lists the secrets the caller may see, with masked fields, filtered to the read scope; admin-sensitive secrets appear only to the admin tier. Gated by secret:read, which the viewer floor does not carry (secret is a sensitive resource).
      operationId: list-secrets
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSecretsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List secrets
      x-omniglass-permission: secret:read
    post:
      description: Seals a secret at an owner scope. Fields are validated and encrypted against the type shape. Gated by secret:create, plus platform:create when owner_kind is platform (the install-wide tier).
      operationId: create-secret
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a secret
      x-omniglass-permission: secret:create
      x-omniglass-platform-permission: platform:create
  /secrets/{id}:
    delete:
      description: Removes a secret by id. Gated by secret:delete, plus platform:delete when the secret sits at the platform tier; read and delete scopes on the owner drive the 404 versus 403 split.
      operationId: delete-secret
      parameters:
        - description: The secret's id
          in: path
          name: id
          required: true
          schema:
            description: The secret's id
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a secret
      x-omniglass-permission: secret:delete
      x-omniglass-platform-permission: platform:delete
    patch:
      description: Replaces the given field values on a secret, re-sealing secret fields. Only values change; name, type, and owner are fixed at creation. An omitted field keeps its value. Gated by secret:update, plus platform:update when the secret sits at the platform tier.
      operationId: update-secret
      parameters:
        - description: The secret's id
          in: path
          name: id
          required: true
          schema:
            description: The secret's id
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a secret's field values
      x-omniglass-permission: secret:update
      x-omniglass-platform-permission: platform:update
  /secrets/{id}:copy:
    post:
      description: Decrypts and returns a secret's field values for a clipboard copy, audited under the copy verb (distinct from an on-screen reveal). Same exposure and the same secret:reveal gate as reveal.
      operationId: copy-secret
      parameters:
        - description: The secret's id
          in: path
          name: id
          required: true
          schema:
            description: The secret's id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealSecretOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Decrypt a secret for clipboard copy
      x-omniglass-permission: secret:reveal
  /secrets/{id}:reveal:
    post:
      description: Decrypts and returns a secret's field values, auditing the decrypt. Gated by secret:reveal at the caller's scope; an admin-sensitive secret additionally needs the admin tier (secret:reveal:admin), so a scoped operator reveals device secrets but never a platform credential.
      operationId: reveal-secret
      parameters:
        - description: The secret's id
          in: path
          name: id
          required: true
          schema:
            description: The secret's id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealSecretOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reveal a secret's plaintext
      x-omniglass-permission: secret:reveal
  /settings:
    get:
      description: The effective settings document plus per-key provenance (which level won) and lock state. Gated by settings:read (admin).
      operationId: get-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsReadOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get effective settings with provenance
      x-omniglass-permission: settings:read
  /settings/me:
    get:
      description: The current principal's resolved settings, client-visible namespaces only, no provenance. Feeds the SPA at boot. Requires authentication.
