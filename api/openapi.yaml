                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a product's declared properties
      x-omniglass-permission: product:read
  /products/{id}/properties/{property}:
    delete:
      description: Removes one line from a custom product's contract; instances keep any value they set for it, now off-contract. A property the product does not declare is a 404, and an official product is read-only (422). Gated by product:delete.
      operationId: delete-product-property
      parameters:
        - description: The product id
          in: path
          name: id
          required: true
          schema:
            description: The product id
            type: string
        - description: The property name
          in: path
          name: property
          required: true
          schema:
            description: The property name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw a property from a product
      x-omniglass-permission: product:delete
    put:
      description: Declares a catalog property on a custom product, or revises the declaration in place (the line is addressed by name, so the write is idempotent). Official products are read-only (422); an unknown product is a 404 and a property the catalog does not know is a 422. Gated by product:update.
      operationId: set-product-property
      parameters:
        - description: The product id
          in: path
          name: id
          required: true
          schema:
            description: The product id
            type: string
        - description: The property name
          in: path
          name: property
          required: true
          schema:
            description: The property name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProductPropertyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPropertyBody"
          description: OK
        default:
          content:
            application/problem+json:
