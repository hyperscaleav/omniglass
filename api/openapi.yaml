  /systems/{name}:move:
    post:
      description: "Relocates and/or re-parents a system: at least one of location or parent is required (422 otherwise). Both follow the three-state convention (an omitted field is unchanged, an explicit empty string clears, a name sets). A reparent is cycle-guarded and scope-injected; clearing parent to root requires an all-scoped move grant, the same authorization a root create already requires. A separate act from update, and a separately grantable one (system:move), because a placement change is an authorization act, not a label edit: it moves a row out from under one grant's subtree and under another's. Recorded under its own audit verb, move, distinct from update. A relocate still recomputes health at both ends (the location it left and the one it arrived at); a reparent does not, since the health rollup runs system -> location, never through the system tree. A taken name at the destination is a 409. A move can RENAME the system: a platform-generated name is scoped to its placement bucket, so a move that changes the bucket re-mints the name and the ordinal in the destination. A move that changes no bucket, including a re-stated placement and a relocate of a parented system (a parent wins over a location), leaves the name alone, and an operator-typed name is never touched. Gated by system:move; read and move scopes drive the 404 versus 403 split, and the destination location resolves within the caller's location:read scope, because the move restamps the label from it: a destination outside that scope is refused (422)."
      operationId: move-system
      parameters:
        - description: The system's name, or a dotted address (e.g. boi.17c.$sys.av)
          in: path
          name: name
          required: true
          schema:
            description: The system's name, or a dotted address (e.g. boi.17c.$sys.av)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveSystemInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Move a system
      x-omniglass-permission: system:move
  /systems/{name}:removeTag:
    post:
      description: Removes a key's value from a system. Gated by system:update.
      operationId: remove-system-tag
      parameters:
        - description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
          in: path
          name: name
          required: true
          schema:
            description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityRemoveTagInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a tag value from a system
      x-omniglass-permission: system:update
  /systems/{name}:rename:
    post:
      description: Moves the system's name, the address an operator types and every external reference stores. A separate act from an update, and a separately grantable one, because it breaks bookmarks, runbooks, and integration config outside this system; inside it nothing breaks, since every reference holds the uuid. A taken name is a 409, an illegal or uuid-shaped one a 422. Gated by system:rename; read and rename scopes drive the 404 versus 403 split.
      operationId: rename-system
      parameters:
        - description: The system's current name, a dotted address, or its uuid
          in: path
          name: name
          required: true
          schema:
            description: The system's current name, a dotted address, or its uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSystemInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rename a system
      x-omniglass-permission: system:rename
  /systems/{name}:resetName:
    post:
      description: "Hands the pen back to the platform: regenerates the name from the system's current system_type and placement (the same rule a nameless create applies, the type's stem plus the lowest free ordinal, bare for the first of that stem in the placement) and marks it name_generated, whether or not it already was. An unclassified system is a 422: the stem lives on the system_type. Gated by system:rename, the same token :rename uses: it changes the name, exactly that permission's blast radius."
      operationId: reset-system-name
      parameters:
        - description: The system's name, or a dotted address (e.g. boi.17c.$sys.av)
          in: path
          name: name
          required: true
          schema:
            description: The system's name, or a dotted address (e.g. boi.17c.$sys.av)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Regenerate a system's name
      x-omniglass-permission: system:rename
  /systems/{name}:setTag:
    post:
      description: Binds a value for a key on a system. The key must exist and apply to this entity kind. Setting a value is the ordinary entity write, gated by system:update.
      operationId: set-system-tag
      parameters:
        - description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
          in: path
          name: name
          required: true
          schema:
            description: The entity's name. For a component, system, or location, also accepts a dotted address (e.g. boi.17c.415a.$comp.display-1); a node's name is always a single token.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitySetTagInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBindingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set a tag value on a system
      x-omniglass-permission: system:update
  /systems:checkName:
    post:
      description: Reports whether a proposed name is a valid slug and currently free within the given placement (parent wins over location; neither means the root/unplaced bucket). Advisory (Save is still gated by the unique constraint). Gated by system:update.
      operationId: check-system-name
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckNameInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckNameOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check a system name
      x-omniglass-permission: system:update
  /systems:health:
    get:
      description: "The current verdict for every system in the caller's read scope, in one call: the bulk counterpart of the per-system health read, carrying the one fact a list's health column renders and none of the explanation. A console painting a page of systems reads this once instead of resolving every role, occupant, alarm and transition per row. A system that has never been recomputed reads healthy. Gated by system:read; an empty scope is an empty list, not a 403."
      operationId: list-system-verdicts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemVerdictsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read every system's health verdict
      x-omniglass-permission: system:read
  /systems:previewLabels:
    post:
      description: "Lists exactly the rows a recompute would change, and leaves the estate as it found it. Use it before :recomputeLabels to see the blast radius of a rule edit. Every generated label in the caller's read and update scope is re-rendered from its current rules and compared with what is stored; a label an operator typed by hand is never a candidate. Bounded by the same two scopes the apply is, so it never lists a row the apply would then refuse to touch. A location preview also lists the components and systems placed at every location whose label would move, because those go stale the moment it does. Gated by system:update, the same permission the apply needs: a preview is half of an edit rather than a report, and an operator who cannot apply has no use for it."
      operationId: preview-system-labels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelRecomputeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview a system label recompute
      x-omniglass-permission: system:update
  /systems:recomputeLabels:
    post:
      description: "Applies what :previewLabels describes, over the rows in the caller's read and update scope, and returns exactly what it changed. Idempotent: a second call changes nothing. A label an operator typed by hand is left alone, and clearing that label by hand is how it is handed back to the platform. Recorded as ONE audit row for the operation, naming the rule tier and the affected count, rather than one row per changed entity. Gated by system:update."
      operationId: recompute-system-labels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelRecomputeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Recompute system labels
      x-omniglass-permission: system:update
  /systems:renderLabel:
    post:
      description: "The system tier of :renderLabel on components. Drafts the name and the label a system create would stamp, allocating nothing: the ordinal is read from the placement bucket and the drafted name is posted back as expected_name on the create. A system suppresses the first ordinal in a bucket, so the first boardroom in a room drafts as boardroom and the second as boardroom-2. Omitting name drafts the name the platform would mint and refuses (422) an unclassified system, the same refusal a nameless create gives, since the stem lives on the system_type. Gated by system:create; the parent resolves within the caller's system:create scope and the location ref within location:read, because a system's label can carry its location's. Omitting parent is the parentless bucket, refused (403) without an all-scoped create grant, exactly as the create refuses it."
      operationId: render-system-label
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderSystemLabelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftLabelOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Draft the name and label a system create would store
      x-omniglass-permission: system:create
  /tags:
    get:
      description: Lists the governed key vocabulary. Rides the tag:read floor.
      operationId: list-tags
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTagsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List tag keys
      x-omniglass-permission: tag:read
    post:
      description: Adds a key to the governed vocabulary. The name is normalized (a lowercase identifier). Gated by tag:create (all-scope, an admin action).
      operationId: create-tag
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Mint a tag key
      x-omniglass-permission: tag:create
  /tags/{name}:
    delete:
      description: Removes a key from the vocabulary, cascading its bindings. Gated by tag:delete (all-scope).
      operationId: delete-tag
      parameters:
        - description: The tag key
          in: path
          name: name
          required: true
          schema:
            description: The tag key
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a tag key
      x-omniglass-permission: tag:delete
    patch:
      description: Replaces a key's governance fields (applies_to, propagates); the name is fixed. Gated by tag:update (all-scope).
      operationId: update-tag
      parameters:
        - description: The tag key
          in: path
          name: name
          required: true
          schema:
            description: The tag key
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a tag key
      x-omniglass-permission: tag:update
  /tags/{name}:clearPlatform:
    post:
      description: Removes the platform-tier binding for a key. Gated by tag:update (all-scope) and platform:update.
      operationId: clear-platform-tag
      parameters:
        - description: The tag key
          in: path
          name: name
          required: true
          schema:
            description: The tag key
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Clear a platform tag value
      x-omniglass-permission: tag:update
      x-omniglass-platform-permission: platform:update
  /tags/{name}:setPlatform:
    post:
      description: Binds an install-wide default value for a key at the platform tier. Gated by tag:update (all-scope) and platform:update.
      operationId: set-platform-tag
      parameters:
        - description: The tag key
          in: path
          name: name
          required: true
          schema:
            description: The tag key
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformBindingInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagBindingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set a platform tag value
      x-omniglass-permission: tag:update
      x-omniglass-platform-permission: platform:update
  /tags/{name}:values:
    get:
      description: Returns the distinct values already bound for a key across the estate, for value autocomplete on a free-text key (an enum key carries its allowed set on the key itself). Rides the tag:read floor.
      operationId: list-tag-values
      parameters:
        - description: The tag key
          in: path
          name: name
          required: true
          schema:
            description: The tag key
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagValuesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the distinct values bound for a key
      x-omniglass-permission: tag:read
  /tasks:
    get:
      description: Lists the tasks whose interface's owning component the caller may read (the component cascade). Tasks are derived from interfaces, not authored. Gated by task:read.
      operationId: list-tasks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTasksOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List tasks in scope
      x-omniglass-permission: task:read
  /tasks/{id}:
    get:
      description: Fetches a task by id. A task whose component is out of the caller's read scope is a non-disclosing 404. Gated by task:read.
      operationId: get-task
      parameters:
        - description: The task's content-addressed id
          in: path
          name: id
          required: true
          schema:
            description: The task's content-addressed id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a task
      x-omniglass-permission: task:read
  /telemetry:push:
    post:
      description: "Accepts per-lane observations (metrics, properties, events) and raw log lines for one owner and publishes them onto the ingest lane. Each lane validates against its own catalog: an unregistered name is rejected and reported in the response rather than silently dropped, and a property or event payload violating its type's schema refuses the batch with a 422. Gated by telemetry:push, and the caller's scope must cover the declared owner; an out-of-scope owner is a non-disclosing 404."
      operationId: push-telemetry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Push telemetry for an owner
      x-omniglass-permission: telemetry:push
  /variables:
    get:
      description: Lists every variable. Requires an all-scope read. Gated by variable:read.
      operationId: list-variables
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVariablesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List variables (admin directory)
      x-omniglass-permission: variable:read
    post:
      description: Sets a variable at an owner scope. The value is validated against value_type. Gated by variable:create, plus platform:create when owner_kind is platform (the install-wide tier).
      operationId: create-variable
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVariableInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a variable
      x-omniglass-permission: variable:create
      x-omniglass-platform-permission: platform:create
  /variables/{id}:
    delete:
      description: Removes a variable by id. Gated by variable:delete, plus platform:delete when the variable sits at the platform tier; read and delete scopes on the owner drive the 404 versus 403 split.
      operationId: delete-variable
      parameters:
        - description: The variable's id
          in: path
          name: id
          required: true
          schema:
            description: The variable's id
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a variable
      x-omniglass-permission: variable:delete
      x-omniglass-platform-permission: platform:delete
    patch:
      description: Replaces a variable's value, validated against its fixed value_type. Only the value changes; name, type, and owner are fixed at creation. Gated by variable:update, plus platform:update when the variable sits at the platform tier.
      operationId: update-variable
      parameters:
        - description: The variable's id
          in: path
          name: id
          required: true
          schema:
            description: The variable's id
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVariableInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a variable's value
      x-omniglass-permission: variable:update
      x-omniglass-platform-permission: platform:update
  /vendors:
    get:
      description: Lists the vendor registry, ordered alphabetically by display name. Populates the vendor picker on the product form. Gated by vendor:read.
      operationId: list-vendors
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListVendorsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List vendors
      x-omniglass-permission: vendor:read
    post:
      description: Creates a custom (non-official) vendor. Gated by vendor:create.
      operationId: create-vendor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a vendor
      x-omniglass-permission: vendor:create
  /vendors/{id}:
    delete:
      description: Deletes a custom vendor, refused if official (422). Gated by vendor:delete.
      operationId: delete-vendor
      parameters:
        - description: The vendor id
          in: path
          name: id
          required: true
          schema:
            description: The vendor id
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a vendor
      x-omniglass-permission: vendor:delete
    get:
      description: Fetches a vendor by id. Gated by vendor:read.
      operationId: get-vendor
      parameters:
        - description: The vendor id
          in: path
          name: id
          required: true
          schema:
            description: The vendor id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a vendor
      x-omniglass-permission: vendor:read
    patch:
      description: Patches a custom vendor's display_name, kind, icon, support_phone, or website. Official vendors are read-only (422). Gated by vendor:update.
      operationId: update-vendor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a vendor
      x-omniglass-permission: vendor:update
servers:
  - url: /api/v1

