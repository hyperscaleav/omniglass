              schema:
                $ref: "#/components/schemas/MetricTypeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a metric type
      x-omniglass-permission: metric_type:update
