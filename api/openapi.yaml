info:
  title: Omniglass
  version: 0.0.1-skeleton
openapi: 3.1.0
paths:
  /audit-log:
    get:
      description: Recent audit-trail events, newest first, each with the actor and, for an impersonated action, the real actor behind it. Read-only; gated by audit:read:admin (admin/owner only, since the audit trail is admin-sensitive).
      operationId: list-audit-log
      parameters:
        - description: Max rows to return, newest first (default 100, capped at 500)
          explode: false
          in: query
          name: limit
          schema:
            description: Max rows to return, newest first (default 100, capped at 500)
            format: int64
            type: integer
        - description: Filter to one resource kind (e.g. auth, principal_grant)
          explode: false
          in: query
          name: resource
          schema:
            description: Filter to one resource kind (e.g. auth, principal_grant)
            type: string
        - description: Filter to one verb (e.g. login, create)
          explode: false
          in: query
          name: verb
          schema:
            description: Filter to one verb (e.g. login, create)
            type: string
        - description: Only events strictly older than this RFC3339 timestamp (paging backward)
          explode: false
          in: query
          name: before
          schema:
            description: Only events strictly older than this RFC3339 timestamp (paging backward)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List audit-trail events
      x-omniglass-permission: audit:read:admin
  /auth/login:
    post:
      description: Verifies a human's password and sets an httpOnly session cookie. Public; a bad credential is a flat 401, and a correct password against a disabled account is a distinct 403 so the screen can explain it.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Log in with a username and password
  /auth/logout:
    post:
      description: Revokes the session token and clears the cookie. Public.
      operationId: logout
      parameters:
        - in: header
          name: Cookie
          schema:
            type: string
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log out the current session
  /auth/me:
    get:
      description: Returns the caller's principal, flattened permissions (a UI hint and the fast-reject set), and grants. Requires authentication.
      operationId: get-auth-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: The authenticated principal, its permissions, and grants
    patch:
      description: Updates the caller's own display name (email is administrator-set). Requires authentication; self-scoped (edits only your own principal).
      operationId: update-auth-me
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update your own profile
  /auth/me/avatar:
    get:
      description: Returns the caller's profile picture as a base64-encoded JPEG. Requires authentication; self-scoped. No picture is a 404.
      operationId: get-auth-me-avatar
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get your own profile picture
  /auth/me/sessions:
    get:
      description: Lists the caller's own active bearer credentials (time-bounded web-login sessions and CLI/API tokens) with their non-secret metadata; the current one is flagged. Requires authentication; self-scoped (never another principal's). The token secret is never returned.
      operationId: list-auth-me-sessions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMeSessionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List your own sessions and tokens
  /auth/me/sessions/{id}:revoke:
    post:
      description: Revokes one of the caller's own sessions or tokens by id (from the session list); revoking the current one signs it out. Requires authentication; self-scoped, so a credential id that is not yours is a 404.
      operationId: revoke-auth-me-session
      parameters:
        - description: The credential id to revoke (from the session list)
          in: path
          name: id
          required: true
          schema:
            description: The credential id to revoke (from the session list)
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Revoke one of your own sessions
  /auth/me/sessions:revokeAll:
    post:
      description: Revokes every one of the caller's own web-login sessions, or every one of its CLI/API tokens (chosen by purpose), returning how many were ended. Requires authentication; self-scoped. Always keeps the credential that made this request, so you are never signed out of the one you are on; sessions and tokens never cross.
      operationId: revoke-all-auth-me-sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAllMeSessionsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAllMeSessionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke all of your own sessions or tokens
  /auth/me/tokens:
    post:
      description: Mints a CLI/API token for the caller and returns it once (store it now; it cannot be retrieved again). A description is required (what the token is for); an optional ttl_days bounds its lifetime (default 90, maximum 365). Requires authentication; self-scoped (always issued for you). The token is stamped with the device and address that created it.
      operationId: create-auth-me-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeTokenInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMeTokenOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create one of your own API tokens
  /auth/me:changePassword:
    post:
      description: Verifies the current password and sets a new one. Requires authentication; self-scoped.
      operationId: change-auth-me-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change your own password
  /auth/me:removeAvatar:
    post:
      description: Clears the caller's profile picture. Requires authentication; self-scoped.
      operationId: remove-auth-me-avatar
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove your own profile picture
  /auth/me:setAvatar:
    post:
      description: Sets the caller's profile picture (JPEG, PNG, or WebP, base64-encoded), normalized server-side to a 256x256 JPEG. Requires authentication; self-scoped. A bad or oversize image is a 422.
      operationId: set-auth-me-avatar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvatarMeInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set your own profile picture
  /auth/me:stopImpersonation:
    post:
      description: Revokes the impersonation session presented by the request token, ending the view-as / act-as. Requires authentication with an impersonation token; self-scoped (ends only the session the token names).
      operationId: stop-impersonation
      responses:
        "204":
          description: No Content
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Stop the current impersonation session
  /auth/status:
    get:
      description: "Public: reports whether any owner has been bootstrapped, so the login screen can hide the bootstrap hint."
      operationId: get-auth-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Whether the system has an owner yet
  /command-types:
    get:
      description: Lists every registered command type (official and custom). Estate-wide reference data. Gated by command_type:read.
      operationId: list-command-type
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommandTypesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List command types
      x-omniglass-permission: command_type:read
    post:
      description: Registers a custom command type (official=false). The name must be a single kebab token; a target, when set, must be a registered property or metric type. Gated by command_type:create.
      operationId: create-command-type
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommandTypeInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandTypeBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a command type
      x-omniglass-permission: command_type:create
  /command-types/{name}:
    delete:
      description: Removes a custom command type by name. Official types are read-only. Gated by command_type:delete.
      operationId: delete-command-type
      parameters:
        - description: The command type's name
          in: path
          name: name
          required: true
          schema:
            description: The command type's name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a command type
      x-omniglass-permission: command_type:delete
    get:
      description: Returns one command type by name. Gated by command_type:read.
      operationId: get-command-type
      parameters:
        - description: The command type's name
          in: path
          name: name
          required: true
          schema:
            description: The command type's name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandTypeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a command type
      x-omniglass-permission: command_type:read
    patch:
      description: Patches a custom command type's label, description, params schema, settle window, or target on either arm (a nil field is unchanged; an empty target clears it; a non-empty arm clears the other). The name is fixed at creation. Official types are read-only. Gated by command_type:update.
      operationId: update-command-type
      parameters:
        - description: The command type's name
          in: path
          name: name
          required: true
          schema:
            description: The command type's name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommandTypeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandTypeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a command type
      x-omniglass-permission: command_type:update
  /component-types:
    get:
      description: "Lists the component_type registry (the taxonomy a product is classified under: mic, camera, wireless-mic under mic), ordered alphabetically by display name. Each row carries its parent link, so the console reconstructs the tree client-side. Gated by component_type:read."
      operationId: list-component-types
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListComponentTypesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List component types
      x-omniglass-permission: component_type:read
    post:
      description: Creates a custom (non-official) component_type, optionally under a parent. Gated by component_type:create.
      operationId: create-component-type
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentTypeInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a component type
      x-omniglass-permission: component_type:create
  /component-types/{id}:
    delete:
      description: "Deletes a custom component_type, refused if official (422, forked or not: a fork is an overlay, not ownership) or still a parent of another component_type (409). `:restore` is the only removal a shipped row admits, and it removes your fork, not the row. Gated by component_type:delete."
      operationId: delete-component-type
      parameters:
        - description: The component_type id
          in: path
          name: id
          required: true
          schema:
            description: The component_type id
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a component type
      x-omniglass-permission: component_type:delete
    patch:
      description: "Patches a component_type's display_name, stem, icon, abbrev, label_rule, or default_tags. A shipped (official) row is never written: the patch FORKS it, storing your version over the shipped one, and the response comes back with forked=true under the same id. `:restore` discards the fork. Gated by component_type:update."
      operationId: update-component-type
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentTypeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a component type
      x-omniglass-permission: component_type:update
  /component-types/{id}:restore:
    post:
      description: "Discards your fork of a shipped component_type, so reads return the values this release ships and later releases can improve them again. 409 when the row carries no fork of yours. Gated by component_type:update, the same permission that took the fork: restoring is undoing your own edit, not deleting a row."
      operationId: restore-component-type
      parameters:
        - description: The component_type id
          in: path
          name: id
          required: true
          schema:
            description: The component_type id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Restore a component type's shipped values
      x-omniglass-permission: component_type:update
  /components:
    get:
      description: Lists the components the caller may read, each filtered to its scope subtree. Gated by component:read.
      operationId: list-components
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListComponentsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List components in scope
      x-omniglass-permission: component:read
    post:
      description: "Creates a component, optionally under a parent (a root needs an all-scoped grant), bound to a system and a location, and classified by a product (required; naming a generic is fine until a real product is modeled). Gated by component:create. The location reference resolves within the caller's location:read scope, because the label this stores is rendered from it, and one outside that scope is refused (422) exactly as :renderLabel refuses to preview it. Naming a system additionally requires system:update, and resolves within that scope, because the component's primary membership is inserted from it: it is the same row the membership route writes, so the two paths cost the same permission. A system outside that scope is refused with a 403 naming it when the caller may read the system (denying its existence to someone who can GET it would be a lie) and with the non-disclosing 422 when the caller may not."
      operationId: create-component
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a component
      x-omniglass-conditional-permission: system:update
      x-omniglass-permission: component:create
  /components/{name}:
    delete:
      description: Deletes a component, refused (409) while it still has child components or is still referenced elsewhere, such as by a system role it staffs. Gated by component:delete; read and delete scopes drive the 404 versus 403 split.
      operationId: delete-component
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
            description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a component
      x-omniglass-permission: component:delete
    get:
      description: Fetches a component by name within the caller's read scope. Out of scope is a non-disclosing 404. Gated by component:read.
      operationId: get-component
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
            description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a component
      x-omniglass-permission: component:read
    patch:
      description: "Patches a component's display_name or product. The name is not patchable: renaming is the :rename custom method. Placement is not patchable either: relocating or re-parenting is the :move custom method, gated separately, because a placement change is an authorization act. Product is required, so it is unchanged when omitted and reclassified when named, but an explicit empty string is refused (422), not a clear. Gated by component:update; read and update scopes drive the 404 versus 403 split."
      operationId: update-component
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
            description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a component
      x-omniglass-permission: component:update
  /components/{name}/alarms:
    get:
      description: What is currently wrong with this component, newest first. Pass include_cleared for the history rather than the active set. Gated by component:read; an out-of-scope component is a non-disclosing 404.
      operationId: list-component-alarms
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
            description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
            type: string
        - description: Include cleared alarms, so the list is the history rather than what is wrong now
          explode: false
          in: query
          name: include_cleared
          schema:
            description: Include cleared alarms, so the list is the history rather than what is wrong now
            type: boolean
        - description: Only the alarms nobody has looked at. On its own this is the queue an operator works (raised and unacknowledged); with include_cleared it also returns the incidents that came and went unattended
          explode: false
          in: query
          name: unacknowledged
          schema:
            description: Only the alarms nobody has looked at. On its own this is the queue an operator works (raised and unacknowledged); with include_cleared it also returns the incidents that came and went unattended
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAlarmsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a component's alarms
      x-omniglass-permission: component:read
    post:
      description: "Records a condition on this component, then recomputes health in the same transaction: the component's own verdict moves, and if it is now outage (a critical alarm), any role it occupies loses it as an occupant while the alarm is active, which can move its system and location verdicts with it; a lesser (info or warning) alarm degrades the component but leaves it occupying its roles. Gated by component:update; an out-of-scope component is a non-disclosing 404."
      operationId: raise-component-alarm
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
            description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaiseAlarmInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Raise an alarm on a component
      x-omniglass-permission: component:update
  /components/{name}/alarms/{id}:
    delete:
      description: "Marks the alarm cleared and recomputes health in the same transaction, so the recovery is recorded as a transition at the moment it happened. The row is kept: what was wrong and when outlives the fix. Clearing an alarm that is already cleared or does not exist is a 404. Gated by component:update; an out-of-scope component is a non-disclosing 404."
      operationId: clear-component-alarm
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
            description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
            type: string
        - description: The alarm id
          in: path
          name: id
          required: true
          schema:
            description: The alarm id
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Clear an alarm
      x-omniglass-permission: component:update
  /components/{name}/alarms/{id}:acknowledge:
    post:
      description: "Records that a human has seen this alarm, and changes nothing else. The alarm stays exactly as raised as it was: acknowledging is not fixing, so health is NOT recomputed and cleared_at is untouched. Acknowledging is orthogonal to clearing in both directions, so a cleared alarm can still be acknowledged by whoever reviews the history, and clearing never acknowledges on an operator's behalf. Acknowledging twice is idempotent: the first person and the first time stay, and the no-op writes no second audit row. Gated by alarm:acknowledge, whose scope is resolved on the component tier from that permission (not from component:update); a component outside it is a non-disclosing 404."
      operationId: acknowledge-component-alarm
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
            description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
            type: string
        - description: The alarm id
          in: path
          name: id
          required: true
          schema:
            description: The alarm id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Acknowledge an alarm
      x-omniglass-permission: alarm:acknowledge
  /components/{name}/commands:issue:
    post:
      description: Records a command invocation, writes a caused event, and (for a settleable command) opens an intended value the observed value settles against. Returns the computed settlement verdict. Gated by command:issue; an out-of-scope component is a non-disclosing 404.
      operationId: issue-component-command
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
            description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCommandInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Issue a command to a component
      x-omniglass-permission: command:issue
  /components/{name}/effective-secrets:
    get:
      description: "Resolves the secrets that cascade onto a component (platform -> location -> component), with the winner and the shadowed candidates it overrode. There is NO system band: a secret is device-facing, and the room a component happens to serve is the wrong owner for a credential the device itself answers with. Fields are masked, as in the directory; plaintext is only ever the audited reveal. Gated by secret:read, which the viewer floor does not carry, and admin-sensitive secrets appear only to the admin tier."
      operationId: effective-secrets
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
            description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveSecretsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Effective secrets for a component
      x-omniglass-permission: secret:read
  /components/{name}/effective-tags:
    get:
      description: "Resolves the tags that cascade onto a component (platform -> location -> system -> component): keys union, values override most-specific-wins, with the winner and shadowed candidates. A non-propagating key resolves only from a binding on the component itself. The system band comes from MEMBERSHIP: pass ?system= (a name or a uuid, ADR-0062) to resolve against one the component belongs to (a shared device answers differently for each), or omit it to resolve against its primary membership. Gated by component:read; the component must be in the caller's component read scope."
      operationId: effective-tags
      parameters:
        - description: The component's name, or a dotted address (e.g. boi.17c.415a.$comp.display-1)
          in: path
          name: name
          required: true
          schema:
