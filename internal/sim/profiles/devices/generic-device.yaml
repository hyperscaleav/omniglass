# yaml-language-server: $schema=schema.json
# Generic Device, an unclassified SNMP device
#
# The simulated face of the generic-device product, the fallback every
# unclassified component resolves to. It is the lab's one device left on the
# generic SNMP driver (snmp-generic, #1372): a box nobody has classified or
# written a driver for, which still answers the two objects every SNMP agent
# does, MIB-II sysDescr and sysUpTime. Those are all snmp-generic reads, so
# the device lands a model number and an uptime and nothing more, which is
# what an unclassified device honestly reports.
#
# No vendor arc and no control surface: there is nothing here to switch.

name: generic-device
manufacturer: Generic
model: "Generic SNMP Device"
device_type: generic-device
slug_prefix: generic-device

doc:
  summary: "Generic unclassified SNMP device"
  description: |
    An unclassified device on the network, answering MIB-II sysDescr and
    sysUpTime over SNMP and ping over ICMP. The lab's stand-in for a device
    that has no product-specific driver, so the generic SNMP driver stays
    exercised.

interfaces:
  - name: snmp
    protocol: snmp
    port: 161
    doc: { summary: "SNMP monitoring", tags: [monitoring] }
    auth:
      community: "public"
      refused_community: "revoked"
    oid_map:
      configuration.device.model: "1.3.6.1.2.1.1.1.0"   # sysDescr
      status.device.uptime:       "1.3.6.1.2.1.1.3.0"   # sysUpTime

  - name: icmp
    protocol: icmp
    doc: { summary: "ICMP ping reachability", tags: [monitoring] }

computed:
  - { path: status.device.uptime, kind: elapsed, since: status.device.boot_epoch }

defaults:
  status:
    device:
      boot_epoch: 0
    network:
      ipv4:
        address: ""
        mac: ""
  configuration:
    device:
      serial: ""
      model: "Generic SNMP Device"
      manufacturer: "Generic"
    network:
      hostname: ""
