# yaml-language-server: $schema=schema.json
# Lyra HX-1, Wireless Microphone System
#
# Lyra is the lab's fictional microphone vendor. The HX-1 is a wireless
# handheld microphone and its networked receiver; the receiver is what
# is on the network, reporting the transmitter it hears. Beside mute and
# level, an operator watches its battery: a wireless mic that dies mid
# lecture is the call the help desk gets.

name: lyra-hx-1
manufacturer: Lyra
model: "HX-1"
device_type: wireless-mic
slug_prefix: wireless-mic

doc:
  summary: "Lyra HX-1, wireless microphone system"
  description: |
    Monitored over SNMP on the Lyra enterprise arc (mute, the input
    level, and the transmitter's battery charge); muted and unmuted over
    a small HTTP API behind the Lyra header key.

interfaces:
  - name: http-api
    protocol: http
    port: 80
    doc: { summary: "Lyra control API", tags: [management, api] }
    auth:
      type: header
      header: "X-Lyra-Key"
      api_key: "lyra-lab-key"
      enforce: true
    api_surface: lyra-mic
    routes:
      - match: "GET /api/status"
        template: api/lyra-mic/status.json.gotempl
        doc: { summary: "Microphone identity and state", tags: [api, status] }

      - match: "POST /api/mute"
        template: api/lyra-mic/mute-ack.json.gotempl
        doc: { summary: "Mute or unmute the microphone", tags: [api, control] }
        example: |
          {"mute": true}
        mutations:
          - path: status.mic.mute
            value: "{{ .Request.Body.mute }}"
            enum: ["true", "false"]

  - name: snmp
    protocol: snmp
    port: 161
    doc: { summary: "SNMP monitoring", tags: [monitoring] }
    api_surface: lyra-mic
    auth:
      community: "public"
      refused_community: "revoked"
    # The Lyra arc, 1.3.6.1.4.1.55530: the microphone at .1 (mute, the
    # input level in dBFS), the wireless link at .2, identity at .5.
    oid_map:
      configuration.device.model:     "1.3.6.1.2.1.1.1.0"   # sysDescr
      status.device.uptime:           "1.3.6.1.2.1.1.3.0"
      status.mic.mute:                "1.3.6.1.4.1.55530.1.1.0"
      status.mic.level_db:            "1.3.6.1.4.1.55530.1.2.0"
      status.mic.battery_percent:     "1.3.6.1.4.1.55530.2.1.0"
      configuration.firmware.version: "1.3.6.1.4.1.55530.5.1.0"
      configuration.device.serial:    "1.3.6.1.4.1.55530.5.2.0"

  - name: icmp
    protocol: icmp
    doc: { summary: "ICMP ping reachability", tags: [monitoring] }

computed:
  - { path: status.device.uptime, kind: elapsed, since: status.device.boot_epoch }

# The input level rides speech in the place it hears: it moves every few
# seconds within a talker's range, a behavior a scenario can drive (a
# meeting starting, a silent room).
behaviors:
  - name: level_drift
    schedule:
      interval: 15s
    mutations:
      - path: status.mic.level_db
        value: "{{ round 1 (clamp -70.0 -20.0 (randStep 4.0 .State.status.mic.level_db)) }}"

  # The transmitter's battery drains while it is on: a tenth of a percent
  # a minute, about sixteen hours from full. A scenario can run it faster
  # toward the low-battery alarm, or put a fresh battery in.
  - name: battery_drain
    schedule:
      interval: 60s
    mutations:
      - path: status.mic.battery_percent
        value: "{{ round 1 (clamp 0.0 100.0 (sub .State.status.mic.battery_percent 0.1)) }}"

defaults:
  status:
    device:
      boot_epoch: 0
    mic:
      mute: false
      level_db: -42
      battery_percent: 78.0
    network:
      ipv4:
        address: ""
        mac: ""
  configuration:
    device:
      serial: ""
      model: "HX-1"
      manufacturer: "Lyra"
    firmware:
      version: "lyra-hx-11"
    network:
      hostname: ""
