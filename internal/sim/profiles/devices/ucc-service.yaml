# yaml-language-server: $schema=schema.json
# UCC Service, Cloud Unified-Communications Platform
#
# A centralized cloud service (a meeting platform's admin plane) that the
# room devices sign into. Unlike the room hardware it runs as a
# standalone HTTP service, not inside a site pod, and carries NO SNMP /
# CLI / raw-TCP surface, cloud platforms are monitored over their HTTP
# admin API with a bearer-style token, and nothing else. ICMP is kept
# so the network band can still reach it.
#
# Course datapoints (HTTP, token auth, one way in):
#   status.meeting.active  , meetings currently in progress
#   status.meeting.errors  , recent join/media errors
#
# Auth: header token (Authorization-style). public_paths exempts the
# dashboard root so an operator can land and paste a token.

name: ucc-service
manufacturer: Shinra Cloud
model: "UCC Platform"
device_type: cloud-service
slug_prefix: ucc-svc

doc:
  summary: "Cloud unified-communications platform (meeting + error telemetry)"
  description: |
    Centralized UCC cloud service the room bars sign into. Exposes an
    HTTP admin API (token auth) reporting active meetings and recent
    join/media errors. HTTP + ICMP only, no SNMP or CLI.
  tags: [cloud, ucc, service]

interfaces:
  - name: http-api
    protocol: http
    port: 443
    tls: true
    doc:
      summary: "UCC admin HTTP API + dashboard"
      tags: [management, api, cloud]
    auth:
      type: header
      header: "X-UCC-Token"
      api_key: "ucc-lab-token"
      enforce: true
      public_paths: ["/"]
    api_surface: ucc-service
    routes:
      - match: "GET /"
        template: web/ucc-service/index.gotempl
        doc: { summary: "UCC service dashboard" }

      - match: "GET /api/status"
        template: api/ucc-service/status.json.gotempl
        doc: { summary: "Service status (active meetings, error count)", tags: [api, status] }

      - match: "GET /api/meetings"
        template: api/ucc-service/meetings.json.gotempl
        doc: { summary: "Active meetings + recent errors", tags: [api, meeting] }

      # The webhook subscription (#1024): an admin registers where the
      # platform posts its meeting events and how each post is signed, as a
      # SaaS admin console does. scheme is hmac (the default the docs
      # teach), token, basic or none; secret is the hmac key, the token or
      # user:password; fault makes the platform post as a sender gone wrong
      # (bad-signature, stale, redeliver), empty for a well-behaved one.
      - match: "POST /api/webhooks"
        template: api/ucc-service/ack.json.gotempl
        doc: { summary: "Subscribe a webhook receiver to the meeting events", tags: [api, webhook] }
        example: |
          {"url": "https://omniglass.example/api/v1/webhooks/TOKEN", "scheme": "hmac", "secret": "ucc-lab-signing-key"}
        mutations:
          - { path: configuration.webhook.target_url, value: "{{ .Request.Body.url }}", pattern: '^(https?://\S{1,1000})?$' }
          - { path: configuration.webhook.scheme, value: '{{ or .Request.Body.scheme "hmac" }}', enum: [hmac, token, basic, none] }
          - { path: configuration.webhook.secret, value: '{{ or .Request.Body.secret "" }}' }
          - { path: configuration.webhook.fault, value: '{{ or .Request.Body.fault "" }}', enum: ["", bad-signature, stale, redeliver] }

      # A meeting starts and ends: the platform posts each to the
      # subscribed receiver, signed, with its event header and a delivery id.
      - match: "POST /api/meetings/start"
        template: api/ucc-service/ack.json.gotempl
        doc: { summary: "Start a meeting (posts meeting.started)", tags: [api, meeting, webhook] }
        example: |
          {"id": "m-1001", "room": "huddle"}
        mutations:
          - { path: status.meeting.id, value: "{{ .Request.Body.id }}", pattern: "^[A-Za-z0-9-]{1,32}$" }
          - { path: status.meeting.started, value: true }
        emit:
          url: '{{ .State | get "configuration" | get "webhook" | get "target_url" }}'
          body: '{"event":"meeting.started","meeting":"{{ .Request.Body.id }}","room":"{{ or .Request.Body.room "" }}","ts":{{ now }}}'
          headers: { X-UCC-Event: meeting.started }
          sign: &ucc-sign
            scheme: '{{ .State | get "configuration" | get "webhook" | get "scheme" }}'
            secret: '{{ .State | get "configuration" | get "webhook" | get "secret" }}'
            fault: '{{ .State | get "configuration" | get "webhook" | get "fault" }}'
            header: X-UCC-Signature
            prefix: "sha256="
            timestamp: X-UCC-Timestamp
            delivery: X-UCC-Delivery

      - match: "POST /api/meetings/end"
        template: api/ucc-service/ack.json.gotempl
        doc: { summary: "End the meeting (posts meeting.ended)", tags: [api, meeting, webhook] }
        example: "{}"
        mutations:
          - { path: status.meeting.started, value: false }
        emit:
          url: '{{ .State | get "configuration" | get "webhook" | get "target_url" }}'
          body: '{"event":"meeting.ended","meeting":"{{ .State | get "status" | get "meeting" | get "id" }}","ts":{{ now }}}'
          headers: { X-UCC-Event: meeting.ended }
          sign: *ucc-sign

  - name: icmp
    protocol: icmp
    doc: { summary: "ICMP ping reachability", tags: [monitoring] }

# How the simulator subscribes this service to its webhook endpoint (#1370,
# ADR-1370): the subscribe route above, called with the endpoint's URL and
# signing key when the service's component holds a webhook endpoint, as the
# service's own admin would. A lab's posts flow from the start.
webhook:
  subscribe: /api/webhooks

computed:
  - { path: status.device.uptime, kind: elapsed, since: status.device.boot_epoch }

# Outbound webhook emitter. On each interval this behavior flips the
# meeting flag on AND POSTs a "meeting.started" webhook to the configured
# collector, the device's only egress-HTTP capability (see emit.go).
#
# Subscription: POST /api/webhooks sets configuration.webhook.target_url,
# as the service's admin would; in a lab the simulator calls it for the
# webhook endpoint the service's component holds (ADR-1370), so the posts
# flow from the start. Empty disables emission: render of an empty URL is
# the safe configured-off default, so the behavior still ticks (flips the
# meeting flag) but sends nothing.
#
# One event per room: each device instance runs its own copy of this
# behavior with its own hostname, so the catcher sees one
# meeting.started per room hostname per interval.
behaviors:
  - name: meeting_started
    schedule:
      interval: 60s
    mutations:
      - path: status.meeting.started
        value: "true"
    emit:
      url: '{{ .State | get "configuration" | get "webhook" | get "target_url" }}'
      body: >-
        {"host":"{{ .Defaults.configuration.webhook.target_host }}","event":"meeting.started","room":"{{ .Defaults.configuration.room.name }}","ts":{{ now }}}
      headers: { X-UCC-Event: meeting.started }
      sign: *ucc-sign

defaults:
  status:
    device:
      boot_epoch: 0
    meeting:
      active: 3
      errors: 0
      # Flipped on by the meeting_started behavior each interval; the
      # emit body announces the transition to the collector.
      started: false
  configuration:
    device:
      serial: ""
      model: "UCC Platform"
      manufacturer: "Shinra Cloud"
    firmware:
      version: "cloud-2026.06"
    network:
      hostname: ""
    # Outbound webhook target for the meeting_started behavior, set by
    # the subscribe route; empty disables it (configured-off).
    # target_host is the hostname the event maps to in the monitoring
    # platform: the room's VIDEO BAR (the meeting-room endpoint the UCC data
    # belongs to), set per room via a fleet override. The cloud fires the
    # webhook, but it carries the target device's hostname. Empty target_host
    # drops the event at the catcher (no host = no trapper item).
    webhook:
      target_url: ""
      target_host: ""
      # How each post is signed (#1024), set by POST /api/webhooks.
      scheme: hmac
      secret: ""
      fault: ""
    # Human room label included in the webhook body. Empty by default;
    # a fleet-level override can set it per room if desired.
    room:
      name: ""
