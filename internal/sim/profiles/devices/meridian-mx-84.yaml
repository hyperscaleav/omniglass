# yaml-language-server: $schema=schema.json
# Meridian MX 84, Presentation Switcher
#
# Meridian is the lab's fictional signal-distribution vendor. The MX 84 is
# a presentation switcher: four video inputs (three HDMI, one DisplayPort)
# routed to one output, the box a lectern's laptop, a wall plate and a
# wireless gateway plug into, and the display (or an extender's
# transmitter) hangs off. An operator wants two answers from it: which
# input is routed, and whether that input has a signal.
#
# Its monitoring face is SNMP on a Meridian enterprise arc
# (1.3.6.1.4.1.55550), the switcher's branch at .1: the routed input, the
# signal on the routed input, and a table of the signal on each input. Its
# control face is a small HTTP JSON API behind a Meridian header key: set
# the route, reboot.

name: meridian-mx-84
manufacturer: Meridian
model: "MX 84"
device_type: presentation-switcher
slug_prefix: switcher

doc:
  summary: "Meridian MX 84, presentation switcher"
  description: |
    Four-input presentation switcher. Monitored over SNMP on the Meridian
    enterprise arc (the routed input, the signal on it, and the signal on
    each input); routed over an HTTP JSON API behind the Meridian header
    key.

interfaces:
  - name: http-api
    protocol: http
    port: 80
    doc: { summary: "Meridian JSON control API", tags: [management, api] }
    auth:
      type: header
      header: "X-Meridian-Key"
      api_key: "meridian-lab-key"
      enforce: true
    api_surface: meridian-switcher
    routes:
      - match: "GET /api/status"
        template: api/meridian-switcher/status.json.gotempl
        doc: { summary: "Switcher identity, routed input and the signal on each input", tags: [api, status] }

      # A route change lands the signal on the new input at once; the
      # signal_follow behavior keeps it current afterward, as a source is
      # plugged or pulled.
      - match: "POST /api/route"
        template: api/meridian-switcher/route-ack.json.gotempl
        doc: { summary: "Route an input to the output (hdmi1, hdmi2, hdmi3, dp1)", tags: [api, control] }
        example: |
          {"input": "hdmi2"}
        mutations:
          - path: status.switcher.input
            value: "{{ .Request.Body.input }}"
            enum: [hdmi1, hdmi2, hdmi3, dp1]
          - path: status.switcher.signal
            value: '{{ .State | get "status" | get "switcher" | get "inputs" | get .Request.Body.input | get "signal" }}'

      - match: "POST /api/admin/reboot"
        template: api/meridian-switcher/reboot-ack.json.gotempl
        doc: { summary: "Reboot switcher (clears uptime, routes the first input)", tags: [api, admin] }
        example: "{}"
        mutations:
          - { path: status.device.boot_epoch, value: "{{ now }}" }
          - { path: status.switcher.input, value: "{{ .Defaults.status.switcher.input }}" }
          - { path: status.switcher.signal, value: "{{ .Defaults.status.switcher.signal }}" }

  - name: snmp
    protocol: snmp
    port: 161
    doc: { summary: "SNMP monitoring", tags: [monitoring] }
    api_surface: meridian-switcher
    auth:
      community: "public"
      refused_community: "revoked"
    # The Meridian arc, 1.3.6.1.4.1.55550: the switcher at .1 (the routed
    # input at .1.1.0, the signal on it at .1.2.0, and an input table at
    # .1.10.1.<column>.<input>, inputs 1 to 4: column 2 the signal), the
    # extender's branch at .2 (not served here), identity at .5.
    oid_map:
      configuration.device.model:           "1.3.6.1.2.1.1.1.0"   # sysDescr
      status.device.uptime:                 "1.3.6.1.2.1.1.3.0"
      status.switcher.input:                "1.3.6.1.4.1.55550.1.1.0"
      status.switcher.signal:               "1.3.6.1.4.1.55550.1.2.0"
      status.switcher.inputs.hdmi1.signal:  "1.3.6.1.4.1.55550.1.10.1.2.1"
      status.switcher.inputs.hdmi2.signal:  "1.3.6.1.4.1.55550.1.10.1.2.2"
      status.switcher.inputs.hdmi3.signal:  "1.3.6.1.4.1.55550.1.10.1.2.3"
      status.switcher.inputs.dp1.signal:    "1.3.6.1.4.1.55550.1.10.1.2.4"
      configuration.firmware.version:       "1.3.6.1.4.1.55550.5.1.0"
      configuration.device.serial:          "1.3.6.1.4.1.55550.5.2.0"

  - name: icmp
    protocol: icmp
    doc: { summary: "ICMP ping reachability", tags: [monitoring] }

computed:
  - { path: status.device.uptime, kind: elapsed, since: status.device.boot_epoch }

# The signal the switcher reports for its routed input is whatever the
# routed input's own signal reads: a source unplugged from the routed input
# drops it on the next tick. A scenario drives it by setting an input's
# signal to absent.
behaviors:
  - name: signal_follow
    schedule:
      interval: 10s
    mutations:
      - path: status.switcher.signal
        value: '{{ .State | get "status" | get "switcher" | get "inputs" | get .State.status.switcher.input | get "signal" }}'

defaults:
  status:
    device:
      boot_epoch: 0
    switcher:
      input: hdmi1
      signal: present
      # The lectern laptop (hdmi1), the wall plate (hdmi2) and the wireless
      # gateway (hdmi3) are live; nothing is on the DisplayPort.
      inputs:
        hdmi1: { signal: present }
        hdmi2: { signal: present }
        hdmi3: { signal: present }
        dp1: { signal: absent }
    network:
      ipv4:
        address: ""
        mac: ""
  configuration:
    device:
      serial: ""
      model: "MX 84"
      manufacturer: "Meridian"
    firmware:
      version: "3.2.0"
    network:
      hostname: ""
