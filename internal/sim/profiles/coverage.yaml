# Seeded products on the network (they have a driver) that no simulator
# profile serves yet, each with the issue that adds it. The coverage test
# holds every other such product to a profile, so a new seeded product
# either gains one or is listed here.
unsimulated:
  meridian-mx-84: "#895: no Meridian profile yet"
  meridian-xl-1: "#895: no Meridian profile yet"

# Seeded products with no network interface: there is nothing on them to
# collect from, so nothing simulates them, and each says how the fleet watches
# it instead. A product with no network interface has no driver, and the
# coverage test holds each to that; the converse does not hold, since a
# service on the network can have no driver (generic-service, ucc-service).
passive:
  lyra-gn-12: "an analog gooseneck microphone; the DSP input it is wired to reports its level and mute (#1367)"
  polaris-sky-c6: "a passive loudspeaker; the amplifier channel driving it reports its load (#1367)"
