# The corporate vertical (#1553, epic #1357): one headquarters campus plus
# regional and branch offices, as many as the size calls for (3 to 30 sites),
# with meeting spaces sized from huddle rooms to divisible conference rooms,
# and lobby signage. `omniglass lab run --scenario corporate
# --systems N --plan` resolves it at N systems; the format and the rounding
# rule are in the lab guide (docs/src/content/docs/developer/lab.mdx).
#
# Every standard is a standard template from the catalog, every system_type a
# registered system type, and every product a catalog product a simulator
# profile serves.
name: corporate
label: Corporate
description: >-
  A corporate headquarters with regional and branch offices: huddle rooms,
  meeting rooms sized by display, divisible conference rooms and lobby
  signage.

# 100 systems is a headquarters and two offices; 1,000 is 18 sites; from 1,485
# systems the enterprise is at its 30 sites and the sites grow instead.
sites:
  min: 3
  max: 30

standards:
  - name: huddle-room
    system_type: huddle
    products:
      main-display: boreal-edge-55
      conf-bar: kestrel-vroom
  - name: mr65
    system_type: meeting
    products:
      video-bar: kestrel-vroom
      main-display: boreal-edge-65
      touch-control: newtron-panel-7
      scheduling-panel: newtron-slate-5
  - name: mr75
    system_type: meeting
    products:
      video-bar: kestrel-vroom
      main-display: boreal-edge-75
      touch-control: newtron-panel-7
      scheduling-panel: newtron-slate-5
  - name: mr86
    system_type: meeting
    products:
      video-bar: kestrel-vroom
      main-display: boreal-edge-86
      touch-control: newtron-panel-7
      scheduling-panel: newtron-slate-5
    # The boardrooms' displays take commands (#2649): each is wired with its
    # web admin beside its SNMP agent, so a demo can switch a display's input
    # from the console and watch the room recover.
    control: [main-display]
  - name: divisible-conference
    system_type: conference
    products:
      video-bar: kestrel-vroom
      main-display: boreal-edge-86
      room-mic: lyra-arc-a2
      dsp: polaris-dsp-16
      amplifier: polaris-amp-4100
      touch-control: newtron-panel-7
      scheduling-panel: newtron-slate-5
      # The room-booking platform's service for the room (#2765).
      scheduling-service: scheduling-service
    # The conference rooms' video bars talk over two protocols (#2754): the
    # https API and the websocket control socket the touch panel drives,
    # each its own endpoint on the bar.
    control: [video-bar]
  - name: ds55
    system_type: sign
    products:
      panel: boreal-edge-55
      player: boreal-cast-m1

archetypes:
  - name: hq
    label: Headquarters
    headquarters: true
    typical_systems: 250
    buildings:
      - { name: tower, floors: 30 }
      - { name: annex, floors: 10 }
    systems:
      huddle-room: 30
      mr65: 20
      mr75: 12
      mr86: 6
      divisible-conference: 4
      ds55: 8
  - name: regional
    label: Regional Office
    weight: 1
    typical_systems: 80
    buildings:
      - { name: main, floors: 8 }
    systems:
      huddle-room: 35
      mr65: 25
      mr75: 10
      mr86: 4
      ds55: 6
  - name: branch
    label: Branch Office
    weight: 2
    typical_systems: 25
    buildings:
      - { name: main, floors: 3 }
    systems:
      huddle-room: 40
      mr65: 25
      mr75: 8
      ds55: 5

# The outside actors each site has, declared like its devices (#1743): one
# booking service a site, an emulator device with a push face, scoped to four
# of the site's systems. The lab seeds its telemetry:push user and mints
# its token per run, so every corporate lab pushes and lab measure reads the
# push lane.
#
# And one meeting platform account a site (#1747), a webhook sender: systems
# omitted, so it speaks for every one of the site's systems. The lab seeds
# its webhook endpoint, mints the endpoint's signing key per run and binds
# each room to its system, so the account's signed posts land on the push
# lane beside the booking service's.
pushers:
  - name: booking
    profile: booking-service
    per_site: 1
    systems: 4
  - name: ucc
    profile: ucc-platform
    per_site: 1

# The past a lab seeded with --health-history carries (#2728, ADR-2726): every
# system healthy for the 30 days before the lab started, except the showcase
# rooms the marketing captures visit, each down a few times, each time for the
# reason an alarm named. The headquarters boardroom (hq-mr86-1) lost its main
# display twice; the room the credential capture fixes (hq-mr65-59) lost its
# video bar once. Each health is the one that failure rolls up to live: these
# rooms' slots carry the default degraded impact. Each instance is an endpoint
# the component has (the boardroom display's snmp agent, the video bar's https
# API), which the seed checks.
health_history:
  days: 30
  stretches:
    - system: hq-mr86-1
      component: hq-mr86-1-main-display-1
      rule: reachability-lost
      instance: snmp
      severity: high
      message: Reachability lost
      health: degraded
      days_ago: 23
      minutes: 47
    - system: hq-mr86-1
      component: hq-mr86-1-main-display-1
      rule: reachability-lost
      instance: snmp
      severity: high
      message: Reachability lost
      health: degraded
      days_ago: 9
      minutes: 18
    - system: hq-mr65-59
      component: hq-mr65-59-video-bar-1
      rule: reachability-lost
      instance: https
      severity: high
      message: Reachability lost
      health: degraded
      days_ago: 16
      minutes: 25

# What every room acts out on the simulator's clock (#2757): its meetings, as
# knobs per standard. The lab calendar is derived from these and a seed, never
# stored, so every node computes the same one. A huddle room is booked less
# and for shorter than a boardroom; a conference room fills most of its day.
# Times are UTC; hours bounds the day meetings fall in. The signage has none.
calendar:
  meetings:
    huddle-room:
      booking_rate: 0.30
      slot_mix: { 15: 3, 30: 5, 60: 1 }
      no_show_rate: 0.15
      ended_early_rate: 0.20
      ended_late_rate: 0.08
      attendance: { min: 2, max: 4 }
      walk_in_rate: 0.12
      hours: { start: 8, end: 18 }
    mr65:
      booking_rate: 0.40
      slot_mix: { 15: 1, 30: 5, 60: 3 }
      no_show_rate: 0.12
      ended_early_rate: 0.18
      ended_late_rate: 0.10
      attendance: { min: 3, max: 8 }
      walk_in_rate: 0.08
      hours: { start: 8, end: 18 }
    mr75:
      booking_rate: 0.45
      slot_mix: { 15: 1, 30: 4, 60: 4 }
      no_show_rate: 0.10
      ended_early_rate: 0.15
      ended_late_rate: 0.12
      attendance: { min: 4, max: 12 }
      walk_in_rate: 0.06
      hours: { start: 8, end: 18 }
    mr86:
      booking_rate: 0.50
      slot_mix: { 30: 3, 60: 5 }
      no_show_rate: 0.08
      ended_early_rate: 0.12
      ended_late_rate: 0.15
      attendance: { min: 6, max: 16 }
      walk_in_rate: 0.04
      hours: { start: 8, end: 18 }
    divisible-conference:
      booking_rate: 0.60
      slot_mix: { 30: 2, 60: 6 }
      no_show_rate: 0.06
      ended_early_rate: 0.10
      ended_late_rate: 0.18
      attendance: { min: 8, max: 30 }
      walk_in_rate: 0.02
      hours: { start: 8, end: 18 }
