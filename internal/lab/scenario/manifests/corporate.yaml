# The corporate vertical (#1553, epic #1357): one headquarters campus plus
# regional and branch offices, as many as the size calls for (3 to 30 sites),
# with meeting spaces sized from huddle rooms to divisible conference rooms,
# and lobby signage. `omniglass lab run --scenario corporate
# --systems N --plan` resolves it at N systems; the format and the rounding
# rule are in the lab guide (docs/src/content/docs/guides/lab.mdx).
#
# Every standard is a standard template from the catalog, every system_type a
# registered system type, and every product a catalog product a simulator
# profile serves.
name: corporate
label: Corporate
description: >-
  A corporate headquarters with regional and branch offices: huddle rooms,
  meeting rooms sized by display, divisible conference rooms and lobby
  signage.

# 100 systems is a headquarters and two offices; 1,000 is 18 sites; from 1,485
# systems the enterprise is at its 30 sites and the sites grow instead.
sites:
  min: 3
  max: 30

standards:
  - name: huddle-room
    system_type: huddle
    products:
      main-display: boreal-edge-55
      conf-bar: kestrel-vroom
  - name: mr65
    system_type: meeting
    products:
      video-bar: kestrel-vroom
      main-display: boreal-edge-65
      touch-control: newtron-panel-7
      scheduling-panel: newtron-slate-5
  - name: mr75
    system_type: meeting
    products:
      video-bar: kestrel-vroom
      main-display: boreal-edge-75
      touch-control: newtron-panel-7
      scheduling-panel: newtron-slate-5
  - name: mr86
    system_type: meeting
    products:
      video-bar: kestrel-vroom
      main-display: boreal-edge-86
      touch-control: newtron-panel-7
      scheduling-panel: newtron-slate-5
  - name: divisible-conference
    system_type: conference
    products:
      video-bar: kestrel-vroom
      main-display: boreal-edge-86
      room-mic: lyra-arc-a2
      dsp: polaris-dsp-16
      amplifier: polaris-amp-4100
      touch-control: newtron-panel-7
      scheduling-panel: newtron-slate-5
  - name: ds55
    system_type: sign
    products:
      panel: boreal-edge-55
      player: boreal-cast-m1

archetypes:
  - name: hq
    label: Headquarters
    headquarters: true
    typical_systems: 250
    buildings:
      - { name: tower, floors: 30 }
      - { name: annex, floors: 10 }
    systems:
      huddle-room: 30
      mr65: 20
      mr75: 12
      mr86: 6
      divisible-conference: 4
      ds55: 8
  - name: regional
    label: Regional Office
    weight: 1
    typical_systems: 80
    buildings:
      - { name: main, floors: 8 }
    systems:
      huddle-room: 35
      mr65: 25
      mr75: 10
      mr86: 4
      ds55: 6
  - name: branch
    label: Branch Office
    weight: 2
    typical_systems: 25
    buildings:
      - { name: main, floors: 3 }
    systems:
      huddle-room: 40
      mr65: 25
      mr75: 8
      ds55: 5

# The outside actors each site has, declared like its devices (#1743): one
# booking service a site, an emulator device with a push face, scoped to four
# of the site's systems. The lab seeds its telemetry:push principal and mints
# its token per run, so every corporate lab pushes and lab measure reads the
# push lane.
#
# And one meeting platform account a site (#1747), a webhook sender: systems
# omitted, so it speaks for every one of the site's systems. The lab seeds
# its webhook endpoint, mints the endpoint's signing key per run and binds
# each room to its system, so the account's signed posts land on the push
# lane beside the booking service's.
pushers:
  - name: booking
    profile: booking-service
    per_site: 1
    systems: 4
  - name: ucc
    profile: ucc-platform
    per_site: 1
