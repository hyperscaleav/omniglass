# Dev-only example estate, applied by `make dev` (via `omniglass seed-dev`) so a
# fresh dev environment comes up populated instead of empty: a few campuses (a
# multi-site estate), a few users, and their grants. Idempotent: re-running leaves
# anything that already exists untouched.
#
# This is NOT the boot seed (internal/seed, ship-with reference data that runs on
# every server start in every environment) and it must NEVER run in production:
# these are operator rows. It references reference data (location types, roles) by
# id, so the boot seed must run first.
#
# # key, name, label: three fields, three owners
#
# Every location, component and system carries a `key`. The key is LOCAL to this
# document: it is how one fixture row references another (`parent: west`,
# `location: boardroom`), it is never written to the database, and it is NOT the
# row's name. It cannot be, because most of this estate does not know its own
# name until the platform mints one.
#
# `name` is optional, and its absence is the whole point of this fixture (#657):
# a row with no name asks the platform to name it, so what comes up demonstrates
# the generator rather than a list of names somebody typed. A row that DOES carry
# a name is one the platform cannot name: every LOCATION here is such a row,
# because no shipped location_type carries a name rule (ADR-0103), and a campus,
# a building, a floor and a room each have a real-world name an operator already
# knows. The components and the systems are what demonstrate the generator.
#
# `label` is the LABEL, and setting one takes the pen from the platform
# (#682), so it is set only where an operator override is the point:
#
#   - the power conditioner, which carries no product, so the component rule can
#     only render "Generic Device 1" and says nothing about what the thing is;
#   - the locations listed under LABELS below, each of which says something its
#     name cannot.
#
# No system carries one any more (#693): see the note above the systems, below.
#
# Everything else lets the rule render: a component reads "Display 1", "Video Bar
# 2" and so on, from the shipped component rule over its resolved type and the
# ordinal the generator allocated.
#
# The estate is a FOREST: three unparented tops (hq, east, airport), never one
# root. There is no root location and no "bind this to every location", so a
# binding at hq covers hq and nothing else, and a fourth site added next year
# starts uncovered. The install-wide `platform` tier is the only rung that reaches
# all of them, which is why the seed places devices under two different tops (see
# components, below): with everything under one top, a binding there would look
# like it covered the estate.
#
# LABELS. The shipped location rule reads a location's own name as words and
# titles it (#657), so most of these rows need no label at all: a room
# named `boardroom` renders "Boardroom" from the rule, and pinning that same
# string would hide the feature behind a hand-typed copy of its own output. A
# label survives here only where it says something the NAME cannot, and
# each survivor states which. `TestFixturesKeepLabelsOnlyWhereTheOverrideIsThePoint`
# pins the set by key.
locations:
  # Headquarters: the deepest site (campus -> building -> floor -> rooms).
  #
  # Pinned: the rule would render "Hq". The word an operator says is
  # "Headquarters", and no dictionary entry turns a name into a longer word.
  - key: hq
    name: hq
    label: Headquarters
    type: campus
  # Pinned: the name is a bearing, the label is the building. `west` renders
  # "West", which is a direction rather than a place.
  - key: west
    name: west
    label: West Building
    type: building
    parent: hq
  # A floor is named by the operator, like every other place here. It carried
  # the estate's one generated location name for two slices, `1`, under a
  # positional `floor` rule; ADR-0103 reversed that, because a floor's
  # designation is B2, LG, G, M, 12A, and an ordinal cannot spell any of them.
  # This one's designation is Level 2, so its NAME is level-2 and the shipped
  # location rule renders "Level 2" from it: the two agree because they are the
  # same fact, which is the point the divergence used to make the hard way.
  #
  # No label: the rule renders it. Pinning "Level 2" here would be a
  # hand-typed copy of the rule's own output.
  - key: west-l2
    name: level-2
    type: floor
    parent: west
  # Boardroom A and B are the two halves of a divisible space, and they are two
  # ROOMS, not two systems sharing one. An air wall splits a room into rooms;
  # nothing in an estate has two boardrooms inside one boardroom. The shared bar
  # lives physically in A and serves both (components, below), which is what
  # actually happens when the wall opens, and it is why membership has to be
  # many-valued.
  #
  # A room's name is ground truth an operator knows, so the fixture types it. It
  # needs no ancestry in it: names are unique within their parent (not across
  # the estate). No labels: the shipped rule renders "Boardroom A" and
  # "Boardroom B" from these names, the halves' real-world signage (ADR-0103's
  # designation case).
  - key: boardroom-a
    name: boardroom-a
    type: room
    parent: west-l2
  - key: boardroom-b
    name: boardroom-b
    type: room
    parent: west-l2
  # Pinned: "Huddle" is not what anybody calls the room, and the noun is not in
  # the name. Compare the media lab below, whose name carries both words.
  - key: huddle
    name: huddle
    label: Huddle Room
    type: room
    parent: west-l2
  # Ground-floor lobby, holding a signage endpoint nobody has commissioned into
  # a system yet (components, below): a display on the wall and no system above
  # it is an ordinary state, and the estate canvas draws it as a hole rather
  # than hiding it. No label: the rule renders "Lobby", and the building above
  # it already says which one.
  - key: lobby
    name: lobby
    type: room
    parent: west

  # East Campus: a second site.
  #
  # Pinned for the reason `west` is: a bearing is not a place.
  - key: east
    name: east
    label: East Campus
    type: campus
  # Pinned: "Innovation" is a fact about this building that its name does not
  # carry and no rule can invent.
  - key: hall
    name: hall
    label: Innovation Hall
    type: building
    parent: east
  # The other floor, in another building, named for its own designation. No
  # label: the rule renders "Level 1".
  - key: hall-l1
    name: level-1
    type: floor
    parent: hall
  # No label: the rule renders "Auditorium".
  - key: auditorium
    name: auditorium
    type: room
    parent: hall-l1
  # No label, and this is the row that shows what the rule actually DOES:
  # a two-word name, which the rule reads as words and titles into "Media Lab".
  # The other rooms are one word, so they show only the casing half.
  - key: lab
    name: media-lab
    type: room
    parent: hall-l1

  # Airport Office: a small third site (campus -> building -> room).
  #
  # Pinned: `airport` is where the site is, "Airport Office" is what it is.
  - key: airport
    name: airport
    label: Airport Office
    type: campus
  # No label: the rule renders "Annex".
  - key: annex
    name: annex
    type: building
    parent: airport
  # Pinned for the reason the huddle room is: the noun is not in the name.
  - key: briefing
    name: briefing
    label: Briefing Room
    type: room
    parent: annex

  # Service Depot: a fourth top of a deliberately DIFFERENT shape. It is a
  # building at the root with rooms hanging straight off it, no campus above and
  # no floor between, which the seeded type registry allows and the model has
  # never required. Three tops shaped campus -> building -> floor -> room taught
  # a fixed ladder that does not exist, and an estate canvas read against only
  # that shape would let a fixed-ladder assumption ship green (#630).
  #
  # Pinned: the rule renders "Depot", and "Service Depot" is what the site is
  # called; the qualifying word is not in the name.
  - key: depot
    name: depot
    label: Service Depot
    type: building
  # No label: the rule renders "Bay 1", the designation case (ADR-0103), so the
  # name carries it and the rule titles it.
  - key: bay-1
    name: bay-1
    type: room
    parent: depot
  # Bay 2 holds no system on purpose: a leaf nobody has commissioned is the
  # dashed hole the estate canvas draws, and naming a gap is half of what it
  # is for.
  - key: bay-2
    name: bay-2
    type: room
    parent: depot

users:
  # Username convention: a user limited to a region carries that region in its name
  # (viewer-hq, tech-east); an estate-wide user carries none (operator). No `-dev`
  # suffix, since this fixture only ever seeds a dev environment. All share the
  # password `dev`.

  # A broad operator, all-scoped across every site: no region, since the grant is
  # estate-wide. The everyday driver for demos.
  - username: operator
    password: dev
    label: Operator
    grants:
      - role: operator
        scope_kind: all
  # A read-only viewer confined to the Headquarters campus.
  - username: viewer-hq
    password: dev
    label: HQ Viewer
    grants:
      - role: viewer
        scope_kind: location
        scope_ref: hq
        scope_op: subtree
  # A field tech scoped to the East campus, who builds out rooms under it but cannot
  # touch the campus root itself (exercises subtree_excl_root, on a different site than
  # the viewer, so the seed shows per-site scoping).
  - username: tech-east
    password: dev
    label: East Field Tech
    grants:
      - role: deploy
        scope_kind: location
        scope_ref: east
        scope_op: subtree_excl_root

# Platform example variables (macros), so the Variables directory comes up
# populated. Scoped variables are added once the dev estate seeds systems and
# components; these platform ones need no owner.
variables:
  - name: poll-interval
    value_type: int
    value: 60
  - name: base-url
    value_type: string
    value: https://api.hyperscaleav.com
  - name: tls-verify
    value_type: bool
    value: true
  - name: retry-policy
    value_type: json
    value:
      retries: 3
      backoff: 1s

# Tags: a governed key vocabulary plus a couple of example bindings, so the Tags
# directory and the effective-tags cascade come up populated. `environment` is
# universal with a tenant-wide default; `category` is narrowed to components;
# `asset-id` is non-propagating (a flat per-entity label). The scoped binding
# overrides the platform default for the west building's subtree, so a component
# under it teaches the override while a component under another top keeps the
# platform value: the binding stops at its own top.
tags:
  - name: environment
    platform_value: prod
  - name: category
    applies_to: [component]
  - name: asset-id
    propagates: false
tag_bindings:
  - key: environment
    location: west
    value: staging

# Files: a few example handles over the content-addressed blob store, so the
# Files directory comes up populated with both ordinary (shared) files and a
# sensitive one (admin-tier only). Bytes ride inline here; the server hashes and
# deduplicates them on create.
files:
  - name: boardroom-recovery-runbook.md
    content_type: text/markdown
    content: |
      # Boardroom Recovery
      1. Power-cycle the codec
      2. Verify SIP registration
      3. Check the DSP presets
  - name: dsp-preset-export.json
    content_type: application/json
    content: '{"preset":"conference","gain":-6,"aec":true}'
  - name: codec-firmware-2.1.4.txt
    content_type: text/plain
    content: "placeholder firmware notes for the Cisco codec, release 2.1.4"
  - name: integrator-quote-confidential.txt
    content_type: text/plain
    content: "CONFIDENTIAL competitive bid, integrator A"
    sensitive: true

# Product contract lines: one property the dev estate adds to the Samsung QM55's
# declared-property contract, on top of the ones the boot seed ships
# (serial-number, firmware-version, and model-number with a default). It shows an
# operator-extended contract in the editor, and `mac-address` carries no default,
# so the effective-properties panel shows a default-vs-plain contrast. The product
# and the property both come from the boot seed catalogs.
product_properties:
  - product: samsung-qm55
    property: mac-address

# Components: example devices placed in the estate, so the Components directory
# comes up populated. Not one of them names itself: each asks the platform for a
# name, which mints it from the product's resolved component_type stem and the
# lowest free ordinal in its own room. So the huddle display, the first boardroom
# panel and the auditorium display are ALL called `display-1`, one per room,
# which is the placement-scoped name index doing its job; nothing here has to
# spell out where it is in order to be unique.
#
# The huddle display sits under the west building, whose subtree also carries the
# environment=staging tag override, so a single component teaches both the
# property contract and the tag cascade. The auditorium display sits under a
# DIFFERENT top (east), which is what makes the forest consequential: it is
# outside the west binding's subtree, so its environment resolves to the platform
# value (prod) while the huddle display reads staging. Same key, two rungs,
# because a binding at a top covers that top only and no location binding can
# cover the whole estate.
components:
  - key: huddle-display
    product: samsung-qm55
    location: huddle
  # The lobby's signage endpoint, deliberately in no system: the display is on
  # the wall and nobody has commissioned it, so the canvas draws the room as a
  # hole with a device already waiting in it.
  - key: lobby-display
    product: samsung-qm55
    location: lobby
  # The shared bar lives physically in room A and serves both halves of the
  # divisible boardroom (assignments, below).
  - key: shared-bar
    product: cisco-room-bar
    location: boardroom-a
  - key: bar-a
    product: cisco-room-bar
    location: boardroom-a
  - key: panel-a
    product: samsung-qm55
    location: boardroom-a
  - key: panel-b
    product: samsung-qm55
    location: boardroom-b
  # No product on purpose: it classifies as generic-device, a type no role's
  # accepted_types names, so no role can want it. It is in the room and
  # accounted for, and nothing more, which is exactly the case membership
  # exists to carry. It is also the one component that keeps a typed label:
  # with no product there is no classification for the rule to read, so the
  # rendered label would be "Generic Device 1", and the operator's own words
  # are the only thing that says what the box is.
  - key: power
    label: Power Conditioner
    location: boardroom-a
  - key: auditorium-display
    product: samsung-qm55
    location: auditorium
  - key: auditorium-display-b
    product: samsung-qm55
    location: auditorium
  - key: auditorium-bar
    product: cisco-room-bar
    location: auditorium
  - key: auditorium-bar-b
    product: cisco-room-bar
    location: auditorium
  - key: auditorium-mic
    product: shure-mxa920
    location: auditorium
  - key: auditorium-touch
    product: crestron-tss-1070
    location: auditorium

  # The huddle room's bar staffs the video-bar leg of the choice-bearing
  # huddle-room standard (systems, below); the touch panel is in the room and
  # accounted for, filling no role.
  - key: huddle-bar
    product: cisco-room-bar
    location: huddle
  - key: huddle-touch
    product: crestron-tss-1070
    location: huddle

  - key: briefing-bar
    product: cisco-room-bar
    location: briefing
  - key: briefing-bar-b
    product: cisco-room-bar
    location: briefing
  - key: briefing-display
    product: samsung-qm55
    location: briefing

  - key: bay-1-bar
    product: cisco-room-bar
    location: bay-1
  - key: bay-1-bar-b
    product: cisco-room-bar
    location: bay-1
  - key: bay-1-display
    product: samsung-qm55
    location: bay-1
  - key: bay-1-mic
    product: shure-mxa920
    location: bay-1

  # A central recording service, a member of systems in TWO different tops. A
  # shared box inside one room already had a fixture (the shared bar); this is
  # the case the estate canvas exists to show, where two bands an operator
  # would never read together depend on one thing. It draws once as owned in
  # its primary cluster and as a ghost in the other, so the estate never
  # counts it twice. No location: it is a service, not a box in a room.
  - key: recording-service
    label: Estate Recording Service
    product: generic-service

# Property values: two overrides the huddle display declares over its product's
# contract, so the effective-properties panel teaches direct-vs-inherited.
# `model-number` stays unset and resolves to the product default ("QM55"), and
# `mac-address` stays unset with no default, showing the other two states.
property_values:
  - component: huddle-display
    property: serial-number
    value: SN-1183
  - component: huddle-display
    property: firmware-version
    value: 2.1.4

# The two halves of a divisible boardroom, one system per ROOM. The shared room
# bar sits physically in A and feeds BOTH halves, so it is a member of each: the
# case a single system pointer on a component could never express, and the
# reason membership is many-valued. The other mics and displays belong to one
# half only.
#
# Neither system names itself: each is the first `board` system in its own room,
# so the platform mints `boardroom` in each bucket (the first of its stem in a
# bucket carries no ordinal, ADR-0101). Same name, two rooms, which is the
# placement-scoped name index doing for systems what display-1-per-room does
# for components. The same-BUCKET siblings that demonstrate the ordinal (#693)
# live in the media lab now (below), since an air wall makes two rooms, not two
# boardrooms inside one.
systems:
  - key: boardroom-a
    standard: meeting-room
    system_type: board
    location: boardroom-a
  - key: boardroom-b
    standard: meeting-room
    system_type: board
    location: boardroom-b

  # A huddle room on the choice-bearing standard: it is built all-in-one, so
  # the component-build alternate stays unstaffed WITHOUT impairing the room
  # (#626): a losing alternate's roles contribute nothing.
  - key: huddle-north
    standard: huddle-room
    system_type: huddle
    location: huddle

  # Fully staffed and quiet, until an alarm (below) knocks one of its two
  # microphones out: a REAL failure beside the commissioning gaps, which is the
  # contrast the estate canvas exists to draw.
  - key: auditorium-av
    standard: meeting-room
    system_type: meeting
    location: auditorium

  # Racked, cabled, and not yet commissioned: two training pods conforming to a
  # standard with nothing assigned to any role either declares. Both read
  # INCOMPLETE, the verdict #631 added, and nothing in this seed produced it
  # before. Most of a real estate looks like this for months, which is the
  # whole reason that verdict is not outage.
  #
  # They are also the estate's same-BUCKET same-type siblings, the pair that
  # demonstrates the ordinal the system rule reads (#693): two `class` systems
  # in one room mint `classroom` and `classroom-2`, rendering "Classroom" and
  # "Classroom 2". The divisible boardroom used to carry this demo and cannot
  # any more, its halves being two rooms now (one bucket each).
  - key: lab-pod-a
    standard: meeting-room
    system_type: class
    location: lab
  - key: lab-pod-b
    standard: meeting-room
    system_type: class
    location: lab

  # One microphone short of its quorum of two, with the one it has healthy
  # (assignments, below): short-staffed, not broken, so it reads incomplete.
  - key: briefing-av
    standard: meeting-room
    system_type: meeting
    location: briefing

  # Fully staffed, and the room its warning-level alarm (below) does NOT
  # impair: the component degrades and keeps its slot.
  - key: bay-1-av
    standard: meeting-room
    system_type: meeting
    location: bay-1

# Membership without a job. The shared bar staffs the microphone role in both halves
# (below, through assignment), but the power conditioner fills no declared role at
# all: it is in the room, it is accounted for, and no role wants it. A model that
# only knew about staffing would lose it.
members:
  - system: boardroom-a
    component: power
  # One service, two tops. No role wants it, so it is membership and nothing
  # more, which is exactly what the many-valued binding is for.
  - system: auditorium-av
    component: recording-service
  - system: briefing-av
    component: recording-service
  # In the room and accounted for, filling no role.
  - system: huddle-north
    component: huddle-touch
  - system: auditorium-av
    component: auditorium-touch

# Staffing, which creates the membership as a side effect. boardroom-a is fully
# staffed and reads healthy; boardroom-b is one microphone short of its quorum of
# two, so it reads degraded and the Health panel names the reason.
role_assignments:
  - system: boardroom-a
    role: room-mic
    component: shared-bar
  - system: boardroom-a
    role: room-mic
    component: bar-a
  - system: boardroom-a
    role: main-display
    component: panel-a
  - system: boardroom-b
    role: room-mic
    component: shared-bar
  - system: boardroom-b
    role: main-display
    component: panel-b

  # Huddle North, built all-in-one: the video-bar alternate is staffed and the
  # component build is left alone, so the room reads healthy on one leg.
  - system: huddle-north
    role: conf-bar
    component: huddle-bar

  # The auditorium is fully staffed. The critical alarm (below) takes one of
  # its two microphones down, so the room drops on a real failure.
  - system: auditorium-av
    role: room-mic
    component: auditorium-bar
  - system: auditorium-av
    role: room-mic
    component: auditorium-bar-b
  - system: auditorium-av
    role: main-display
    component: auditorium-display

  # The briefing room is one microphone short of its quorum of two, with the
  # one it has healthy: short-staffed, not broken.
  - system: briefing-av
    role: room-mic
    component: briefing-bar
  - system: briefing-av
    role: main-display
    component: briefing-display

  # Bay 1 is fully staffed.
  - system: bay-1-av
    role: room-mic
    component: bay-1-bar
  - system: bay-1-av
    role: room-mic
    component: bay-1-bar-b
  - system: bay-1-av
    role: main-display
    component: bay-1-display

# Something actually wrong, so the estate is not all healthy-and-incomplete. A
# CRITICAL alarm takes its component's own verdict to outage, which stops it
# occupying the roles it fills (#626); a lesser one degrades the component while
# it keeps its slot. Both appear here because the difference is exactly what an
# operator has to be able to read off a screen.
#
# auditorium-bar going down leaves the auditorium's room-mic role holding one of
# the two it wants, so the room drops to degraded on a REAL failure, beside the
# briefing room sitting at incomplete on a gap. Same arithmetic, different
# cause, different colour: that contrast is the estate canvas's whole argument.
alarms:
  - component: auditorium-bar
    severity: critical
    message: No route to host on the primary interface
    dedup_key: unreachable
  # A warning that costs nothing structural: the component reads degraded and
  # keeps its slot, so the room above it stays healthy. Worth seeding because
  # "this box is unhappy but the room is fine" is a state operators distrust
  # until they have seen the platform draw it correctly.
  - component: bay-1-display
    severity: warning
    message: Lamp hours approaching end of life
    dedup_key: lamp-hours
