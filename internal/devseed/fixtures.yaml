# Membership without a job. The audio rack staffs dsp and amplifier in both
# halves (below, through assignment), but the power conditioner fills no declared
# role at all: it is in the room, it is accounted for, and no role wants it. A
# model that only knew about staffing would lose it. The depot's service stock
# (the spare bars, mics, and displays racked in the bays) deliberately joins NO
# system: stock relates to the bay it sits in, not to the bay's signage, so it
# is roomed and unbound, like the lobby's uncommissioned endpoint above.
members:
  - system: boardroom-a
    component: power
  # One service, two tops. No role wants it, so it is membership and nothing
  # more, which is exactly what the many-valued binding is for.
  - system: auditorium-av
    component: recording-service
  - system: briefing-av
    component: recording-service
  # In the room and accounted for, filling no role.
  - system: huddle-north
    component: huddle-touch
  - system: auditorium-av
    component: auditorium-touch
  # The house spare: a ceiling mic racked in the hall, in the room and
  # accounted for, filling no role.
  - system: auditorium-av
    component: auditorium-mic

# Staffing, which creates the membership as a side effect. Both boardroom halves
# are fully staffed (#785: a deployed room fills every role; the one-mic-short
# teaching case is briefing-av, below): the ONE audio rack in room A counts
# toward both halves' dsp and amplifier quorums, and everything else is per-half.
role_assignments:
  # The divisible pair (#802): each side fully staffed on its own bar,
  # displays, mics, and panels, while the ONE audio rack in room A satisfies
  # BOTH sides' dsp and amplifier slots: the shared-component quorum case,
  # standing where the physically impossible shared video bar used to.
  - system: boardroom-a
    role: video-bar
    component: bar-a
  - system: boardroom-a
    role: main-display
    component: panel-a
  - system: boardroom-a
    role: main-display
    component: panel-a2
  - system: boardroom-a
    role: room-mic
    component: mic-a1
  - system: boardroom-a
    role: room-mic
    component: mic-a2
  - system: boardroom-a
    role: touch-control
    component: touch-a
  - system: boardroom-a
    role: scheduling-panel
    component: sched-a
  - system: boardroom-a
    role: dsp
    component: div-dsp
  - system: boardroom-a
    role: amplifier
    component: div-amp
  - system: boardroom-b
    role: video-bar
    component: bar-b
  - system: boardroom-b
    role: main-display
    component: panel-b
  - system: boardroom-b
    role: main-display
    component: panel-b2
  - system: boardroom-b
    role: room-mic
    component: mic-b1
  - system: boardroom-b
    role: room-mic
    component: mic-b2
  - system: boardroom-b
    role: touch-control
    component: touch-b
  - system: boardroom-b
    role: scheduling-panel
    component: sched-b
  - system: boardroom-b
    role: dsp
    component: div-dsp
  - system: boardroom-b
    role: amplifier
    component: div-amp
  # Huddle North, built all-in-one: the video-bar alternate is staffed and the
  # component build is left alone, so the room reads healthy on one leg.
  - system: huddle-north
    role: conf-bar
    component: huddle-bar
  - system: huddle-north
    role: main-display
    component: huddle-display
  # The auditorium is fully staffed on its hall-scale chain (#802). The
  # critical alarm (below) takes the DSP down, so the hall drops on a real
  # failure in the middle of the signal path.
  - system: auditorium-av
    role: projection
    component: auditorium-projector
  - system: auditorium-av
    role: confidence-display
