# Property values: two overrides the huddle display declares over its product's
# contract, so the effective-properties panel teaches direct-vs-inherited.
# `model-number` stays unset and resolves to the product default ("QM55"), and
# `mac-address` stays unset with no default, showing the other two states.
property_values:
  - component: huddle-display
    property: serial-number
    value: SN-1183
  - component: huddle-display
    property: firmware-version
    value: 2.1.4

# The two halves of a divisible boardroom, one system per ROOM. The shared room
# bar sits physically in A and feeds BOTH halves, so it is a member of each: the
# case a single system pointer on a component could never express, and the
# reason membership is many-valued. The other mics and displays belong to one
# half only.
#
# Neither system names itself: each is the first `board` system in its own room,
# so the platform mints `boardroom` in each bucket (the first of its stem in a
# bucket carries no ordinal, ADR-0101). Same name, two rooms, which is the
# placement-scoped name index doing for systems what display-1-per-room does
# for components. The same-BUCKET siblings that demonstrate the ordinal (#693)
# live in the media lab now (below), since an air wall makes two rooms, not two
# boardrooms inside one.
systems:
  - key: boardroom-a
    standard: divisible-conference
    system_type: board
    location: boardroom-a
  - key: boardroom-b
    standard: divisible-conference
    system_type: board
    location: boardroom-b

  # A huddle room on the choice-bearing standard: it is built all-in-one, so
  # the component-build alternate stays unstaffed WITHOUT impairing the room
  # (#626): a losing alternate's roles contribute nothing.
  - key: huddle-north
    standard: huddle-room
    system_type: huddle
    location: huddle

  # Fully staffed and quiet, until an alarm (below) knocks one of its two
  # microphones out: a REAL failure beside the commissioning gaps, which is the
  # contrast the fleet canvas exists to draw.
  - key: auditorium-av
    standard: auditorium
    system_type: auditorium
    location: auditorium

  # The lab pods, fully staffed like everything else: the ruling is that every
  # system carries all of its components (broken is fine, absent is not), with
  # briefing-av below the ONE provisioning exception. The pods keep their other
  # job: the fleet's same-BUCKET same-type siblings, the pair that demonstrates
  # the ordinal the system rule reads (#693): two `class` systems in one room
  # mint `classroom` and `classroom-2`, rendering "Classroom" and "Classroom 2".
  - key: lab-pod-a
    standard: classroom
    system_type: class
    location: lab
  - key: lab-pod-b
    standard: classroom
    system_type: class
    location: lab

  # The fleet's ONE provisioning system (ruled: every other system is fully
  # staffed): deployed except the scheduling panel nobody has installed yet,
  # short-staffed rather than broken, so it reads incomplete and #631's
  # verdict still appears on screen somewhere.
  - key: briefing-av
    standard: mr65
    system_type: meeting
    location: briefing

  # Fully staffed, and the room its warning-level alarm (below) does NOT
  # impair: the component degrades and keeps its slot.
  - key: bay-1-av
    standard: ds55
    system_type: sign
    location: bay-1


  # Volume systems (mass for the canvas), staffed to quorum: a deployed fleet
