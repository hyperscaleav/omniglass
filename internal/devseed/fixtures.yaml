# Dev-only example estate, applied by `make dev` (via `omniglass seed-dev`) so a
# fresh dev environment comes up populated instead of empty: a few campuses (a
# multi-site estate), a few users, and their grants. Idempotent: re-running leaves
# anything that already exists untouched.
#
# This is NOT the boot seed (internal/seed, ship-with reference data that runs on
# every server start in every environment) and it must NEVER run in production:
# these are operator rows. It references reference data (location types, roles) by
# id, so the boot seed must run first.
#
# # key, name, display_name: three fields, three owners
#
# Every location, component and system carries a `key`. The key is LOCAL to this
# document: it is how one fixture row references another (`parent: west`,
# `location: boardroom`), it is never written to the database, and it is NOT the
# row's name. It cannot be, because most of this estate does not know its own
# name until the platform mints one.
#
# `name` is optional, and its absence is the whole point of this fixture (#657):
# a row with no name asks the platform to name it, so what comes up demonstrates
# the generator rather than a list of names somebody typed. A row that DOES carry
# a name is one the platform cannot name: a campus, a building and a room have
# real-world names an operator already knows and no rule can produce.
#
# `display_name` is the LABEL, and setting one takes the pen from the platform
# (#682), so it is set only where an operator override is the point:
#
#   - locations, all of them: the shipped location label rule is deliberately
#     empty (internal/seed/label_rules.yaml says why), so the label an operator
#     types is the only label a location has;
#   - the two floors, which is the sharpest case in the estate: the platform
#     allocates the NAME (a floor's ordinal within its building), and the
#     real-world designation ("Level 2") is a fact only the operator has;
#   - the power conditioner, which carries no product, so the component rule can
#     only render "Generic Device 1" and says nothing about what the thing is;
#   - the two boardroom halves, because which half is A and which is B is a fact
#     about the air wall, not about the system.
#
# Everything else lets the rule render: a component reads "Display 1", "Video Bar
# 2" and so on, from the shipped component rule over its resolved type and the
# ordinal the generator allocated.
#
# The estate is a FOREST: three unparented tops (hq, east, airport), never one
# root. There is no root location and no "bind this to every location", so a
# binding at hq covers hq and nothing else, and a fourth site added next year
# starts uncovered. The install-wide `platform` tier is the only rung that reaches
# all of them, which is why the seed places devices under two different tops (see
# components, below): with everything under one top, a binding there would look
# like it covered the estate.
#
# LABELS. The shipped location rule reads a location's own name as words and
# titles it (#657), so most of these rows need no display_name at all: a room
# named `boardroom` renders "Boardroom" from the rule, and pinning that same
# string would hide the feature behind a hand-typed copy of its own output. A
# display_name survives here only where it says something the NAME cannot, and
# each survivor states which. `TestFixturesKeepLabelsOnlyWhereTheOverrideIsThePoint`
# pins the set by key.
locations:
  # Headquarters: the deepest site (campus -> building -> floor -> rooms).
  #
  # Pinned: the rule would render "Hq". The word an operator says is
  # "Headquarters", and no dictionary entry turns a name into a longer word.
  - key: hq
    name: hq
    display_name: Headquarters
    type: campus
  # Pinned: the name is a bearing, the label is the building. `west` renders
  # "West", which is a direction rather than a place.
  - key: west
    name: west
    display_name: West Building
    type: building
    parent: hq
  # The one seeded location type the platform can name: `floor` ships positional
  # (internal/seed/location_types.yaml), so this row's name is the ordinal the
  # generator allocates among this building's own floors, and it is `1` because
  # it is the first floor seeded here. The building's real-world designation for
  # it is Level 2, which is a fact about the signage and not about allocation, so
  # it lives in the label. The two deliberately disagree, and the floor under
  # Innovation Hall below is the same shape with the two agreeing: one estate,
  # both cases, which is the clearest thing this fixture teaches (ADR-0103).
  #
  # Pinned, and this is the load-bearing pin: the rule would render "1" from the
  # allocated name, which is an address and not a designation. Releasing it is
  # how ADR-0103's worked example disappears.
  - key: west-l2
    display_name: Level 2
    type: floor
    parent: west
  # A room's name is ground truth an operator knows, so the fixture types it. It
  # needs no ancestry in it: names are unique within their parent (not across the
  # estate), so `boardroom` under this floor is a complete name and
  # `hq.west.1.boardroom` is the address that disambiguates it.
  #
  # No display_name: the shipped rule renders "Boardroom" from this name, and a
  # pin restating it would only hide which of the two produced it.
  - key: boardroom
    name: boardroom
    type: room
    parent: west-l2
  # Pinned: "Huddle" is not what anybody calls the room, and the noun is not in
  # the name. Compare the media lab below, whose name carries both words.
  - key: huddle
    name: huddle
    display_name: Huddle Room
    type: room
    parent: west-l2

  # East Campus: a second site.
  #
  # Pinned for the reason `west` is: a bearing is not a place.
  - key: east
    name: east
    display_name: East Campus
    type: campus
  # Pinned: "Innovation" is a fact about this building that its name does not
  # carry and no rule can invent.
  - key: hall
    name: hall
    display_name: Innovation Hall
    type: building
    parent: east
  # The other floor: platform-named `1` in its own building's bucket (two
  # locations named `1`, which is the placement-scoped name index working), and
  # here the allocation order and the real-world designation agree. Pinned for
  # the reason its twin is: the pair is the worked example, and half of it says
  # nothing on its own.
  - key: hall-l1
    display_name: Level 1
    type: floor
    parent: hall
  # No display_name: the rule renders "Auditorium".
  - key: auditorium
    name: auditorium
    type: room
    parent: hall-l1
  # No display_name, and this is the row that shows what the rule actually DOES:
  # a two-word name, which the rule reads as words and titles into "Media Lab".
  # The other rooms are one word, so they show only the casing half.
  - key: lab
    name: media-lab
    type: room
    parent: hall-l1

  # Airport Office: a small third site (campus -> building -> room).
  #
  # Pinned: `airport` is where the site is, "Airport Office" is what it is.
  - key: airport
    name: airport
    display_name: Airport Office
    type: campus
  # No display_name: the rule renders "Annex".
  - key: annex
    name: annex
    type: building
    parent: airport
  # Pinned for the reason the huddle room is: the noun is not in the name.
  - key: briefing
    name: briefing
    display_name: Briefing Room
    type: room
    parent: annex

users:
  # Username convention: a user limited to a region carries that region in its name
  # (viewer-hq, tech-east); an estate-wide user carries none (operator). No `-dev`
  # suffix, since this fixture only ever seeds a dev environment. All share the
  # password `dev`.

  # A broad operator, all-scoped across every site: no region, since the grant is
  # estate-wide. The everyday driver for demos.
  - username: operator
    password: dev
    display_name: Operator
    grants:
      - role: operator
        scope_kind: all
  # A read-only viewer confined to the Headquarters campus.
  - username: viewer-hq
    password: dev
    display_name: HQ Viewer
    grants:
      - role: viewer
        scope_kind: location
        scope_ref: hq
        scope_op: subtree
  # A field tech scoped to the East campus, who builds out rooms under it but cannot
  # touch the campus root itself (exercises subtree_excl_root, on a different site than
  # the viewer, so the seed shows per-site scoping).
  - username: tech-east
    password: dev
    display_name: East Field Tech
    grants:
      - role: deploy
        scope_kind: location
        scope_ref: east
        scope_op: subtree_excl_root

# Platform example variables (macros), so the Variables directory comes up
# populated. Scoped variables are added once the dev estate seeds systems and
# components; these platform ones need no owner.
variables:
  - name: poll-interval
    value_type: int
    value: 60
  - name: base-url
    value_type: string
    value: https://api.hyperscaleav.com
  - name: tls-verify
    value_type: bool
    value: true
  - name: retry-policy
    value_type: json
    value:
      retries: 3
      backoff: 1s

# Tags: a governed key vocabulary plus a couple of example bindings, so the Tags
# directory and the effective-tags cascade come up populated. `environment` is
# universal with a tenant-wide default; `category` is narrowed to components;
# `asset-id` is non-propagating (a flat per-entity label). The scoped binding
# overrides the platform default for the west building's subtree, so a component
# under it teaches the override while a component under another top keeps the
# platform value: the binding stops at its own top.
tags:
  - name: environment
    platform_value: prod
  - name: category
    applies_to: [component]
  - name: asset-id
    propagates: false
tag_bindings:
  - key: environment
    location: west
    value: staging

# Files: a few example handles over the content-addressed blob store, so the
# Files directory comes up populated with both ordinary (shared) files and a
# sensitive one (admin-tier only). Bytes ride inline here; the server hashes and
# deduplicates them on create.
files:
  - name: boardroom-recovery-runbook.md
    content_type: text/markdown
    content: |
      # Boardroom Recovery
      1. Power-cycle the codec
      2. Verify SIP registration
      3. Check the DSP presets
  - name: dsp-preset-export.json
    content_type: application/json
    content: '{"preset":"conference","gain":-6,"aec":true}'
  - name: codec-firmware-2.1.4.txt
    content_type: text/plain
    content: "placeholder firmware notes for the Cisco codec, release 2.1.4"
  - name: integrator-quote-confidential.txt
    content_type: text/plain
    content: "CONFIDENTIAL competitive bid, integrator A"
    sensitive: true

# Product contract lines: one property the dev estate adds to the Samsung QM55's
# declared-property contract, on top of the ones the boot seed ships
# (serial-number, firmware-version, and model-number with a default). It shows an
# operator-extended contract in the editor, and `mac-address` carries no default,
# so the effective-properties panel shows a default-vs-plain contrast. The product
# and the property both come from the boot seed catalogs.
product_properties:
  - product: samsung-qm55
    property: mac-address

# Components: example devices placed in the estate, so the Components directory
# comes up populated. Not one of them names itself: each asks the platform for a
# name, which mints it from the product's resolved component_type stem and the
# lowest free ordinal in its own room. So the huddle display, the first boardroom
# panel and the auditorium display are ALL called `display-1`, one per room,
# which is the placement-scoped name index doing its job; nothing here has to
# spell out where it is in order to be unique.
#
# The huddle display sits under the west building, whose subtree also carries the
# environment=staging tag override, so a single component teaches both the
# property contract and the tag cascade. The auditorium display sits under a
# DIFFERENT top (east), which is what makes the forest consequential: it is
# outside the west binding's subtree, so its environment resolves to the platform
# value (prod) while the huddle display reads staging. Same key, two rungs,
# because a binding at a top covers that top only and no location binding can
# cover the whole estate.
components:
  - key: huddle-display
    product: samsung-qm55
    location: huddle
  - key: shared-bar
    product: cisco-room-bar
    location: boardroom
  - key: bar-a
    product: cisco-room-bar
    location: boardroom
  - key: panel-a
    product: samsung-qm55
    location: boardroom
  - key: panel-b
    product: samsung-qm55
    location: boardroom
  # No product on purpose: it classifies as generic-device, a type no role's
  # accepted_types names, so no role can want it. It is in the room and
  # accounted for, and nothing more, which is exactly the case membership
  # exists to carry. It is also the one component that keeps a typed label:
  # with no product there is no classification for the rule to read, so the
  # rendered label would be "Generic Device 1", and the operator's own words
  # are the only thing that says what the box is.
  - key: power
    display_name: Power Conditioner
    location: boardroom
  - key: auditorium-display
    product: samsung-qm55
    location: auditorium

# Property values: two overrides the huddle display declares over its product's
# contract, so the effective-properties panel teaches direct-vs-inherited.
# `model-number` stays unset and resolves to the product default ("QM55"), and
# `mac-address` stays unset with no default, showing the other two states.
property_values:
  - component: huddle-display
    property: serial-number
    value: SN-1183
  - component: huddle-display
    property: firmware-version
    value: 2.1.4

# Two systems in one room: a divisible boardroom with an air wall down the middle.
# This is the case a single system pointer on a component could never express, and
# it is why membership is many-valued: the shared room bar feeds BOTH halves and is a
# member of each, while the mics and displays belong to one half only.
#
# Neither names itself either: both are `board` systems in the same room, so the
# platform mints `boardroom` for the first (the first of its stem in a bucket
# carries no ordinal, ADR-0101) and `boardroom-2` for the second. Which half is A
# and which is B is a fact about the air wall rather than about the system, so
# that one lives in the label.
systems:
  - key: boardroom-a
    display_name: Boardroom A
    standard: meeting-room
    system_type: board
    location: boardroom
  - key: boardroom-b
    display_name: Boardroom B
    standard: meeting-room
    system_type: board
    location: boardroom

# Membership without a job. The shared bar staffs the microphone role in both halves
# (below, through assignment), but the power conditioner fills no declared role at
# all: it is in the room, it is accounted for, and no role wants it. A model that
# only knew about staffing would lose it.
members:
  - system: boardroom-a
    component: power

# Staffing, which creates the membership as a side effect. boardroom-a is fully
# staffed and reads healthy; boardroom-b is one microphone short of its quorum of
# two, so it reads degraded and the Health panel names the reason.
role_assignments:
  - system: boardroom-a
    role: room-mic
    component: shared-bar
  - system: boardroom-a
    role: room-mic
    component: bar-a
  - system: boardroom-a
    role: main-display
    component: panel-a
  - system: boardroom-b
    role: room-mic
    component: shared-bar
  - system: boardroom-b
    role: main-display
    component: panel-b
