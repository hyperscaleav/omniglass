users:
  # Username convention: a user limited to a region carries that region in its name
  # (viewer-hq, tech-east); a fleet-wide user carries none (operator). No `-dev`
  # suffix, since this fixture only ever seeds a dev environment. All share the
  # password `dev`.

  # A broad operator, all-scoped across every site: no region, since the grant is
  # fleet-wide. The everyday driver for demos.
  - username: operator
    password: dev
    label: Operator
    grants:
      - role: operator
        scope_kind: all
  # A read-only viewer confined to the Headquarters campus.
  - username: viewer-hq
    password: dev
    label: HQ Viewer
    grants:
      - role: viewer
        scope_kind: location
        scope_ref: hq
        scope_op: subtree
  # A field tech scoped to the East campus, who builds out rooms under it but cannot
  # touch the campus root itself (exercises subtree_excl_root, on a different site than
  # the viewer, so the seed shows per-site scoping).
  - username: tech-east
    password: dev
    label: East Field Tech
    grants:
      - role: deploy
        scope_kind: location
        scope_ref: east
        scope_op: subtree_excl_root

# Platform example variables (macros), so the Variables directory comes up
# populated. Scoped variables are added once the dev fleet seeds systems and
# components; these platform ones need no owner.
variables:
  - name: poll-interval
    value_type: int
    value: 60
  - name: base-url
    value_type: string
    value: https://api.hyperscaleav.com
  - name: tls-verify
    value_type: bool
    value: true
  - name: retry-policy
    value_type: json
    value:
      retries: 3
      backoff: 1s

# Tags: a governed key vocabulary plus a couple of example bindings, so the Tags
# directory and the effective-tags cascade come up populated. `environment` is
# universal with a tenant-wide default; `category` is narrowed to components;
# `asset-id` is non-propagating (a flat per-entity label). The scoped binding
# overrides the platform default for the west building's subtree, so a component
# under it teaches the override while a component under another top keeps the
# platform value: the binding stops at its own top.
tags:
  - name: environment
    platform_value: prod
  - name: category
    applies_to: [component]
  - name: asset-id
    propagates: false
tag_bindings:
  - key: environment
    location: west
    value: staging

# Files: a few example handles over the content-addressed blob store, so the
# Files directory comes up populated with both ordinary (shared) files and a
# sensitive one (admin-tier only). Bytes ride inline here; the server hashes and
# deduplicates them on create.
files:
  - name: boardroom-recovery-runbook.md
    content_type: text/markdown
    content: |
      # Boardroom Recovery
      1. Power-cycle the codec
      2. Verify SIP registration
      3. Check the DSP presets
  - name: dsp-preset-export.json
    content_type: application/json
    content: '{"preset":"conference","gain":-6,"aec":true}'
  - name: codec-firmware-2.1.4.txt
    content_type: text/plain
    content: "placeholder firmware notes for the Cisco codec, release 2.1.4"
  - name: integrator-quote-confidential.txt
    content_type: text/plain
    content: "CONFIDENTIAL competitive bid, integrator A"
    sensitive: true

# Product contract lines: one property the dev fleet adds to the Boreal Edge 55's
# declared-property contract, on top of the ones the boot seed ships
# (serial-number, firmware-version, and model-number with a default). It shows an
# operator-extended contract in the editor, and `mac-address` carries no default,
# so the effective-properties panel shows a default-vs-plain contrast. The product
# and the property both come from the boot seed catalogs.
product_properties:
  - product: boreal-edge-55
    property: mac-address

# Components: example devices placed in the fleet, so the Components directory
# comes up populated. Not one of them names itself: each asks the platform for a
# name, which mints it from the product's resolved component_type stem and the
# lowest free ordinal in its own room. So the huddle display, the first boardroom
# panel and the auditorium display are ALL called `display-1`, one per room,
# which is the placement-scoped name index doing its job; nothing here has to
# spell out where it is in order to be unique.
#
# The huddle display sits under the west building, whose subtree also carries the
# environment=staging tag override, so a single component teaches both the
# property contract and the tag cascade. The auditorium display sits under a
# DIFFERENT top (east), which is what makes the forest consequential: it is
# outside the west binding's subtree, so its environment resolves to the platform
# value (prod) while the huddle display reads staging. Same key, two rungs,
# because a binding at a top covers that top only and no location binding can
# cover the whole fleet.
components:
  - key: huddle-display
    product: boreal-edge-55
    location: huddle
  # The lobby's signage endpoint, deliberately in no system: the display is on
  # the wall and nobody has commissioned it, so the canvas draws the room as a
  # hole with a device already waiting in it.
