# The official severity levels (#917, ADR-0050): named, labelled, colored,
# and ranked for comparison, spaced so an operator inserts a level between
# two without renumbering. health_effect declares what an open alarm at the
# level does to its own component: none, degraded or outage (#2558). Authoritative: the boot
# seed upserts these on every start, and an operator's own levels are left
# alone.
levels:
  - name: info
    label: Info
    color: gray
    rank: 10
    health_effect: none
  - name: warning
    label: Warning
    color: yellow
    rank: 20
    health_effect: degraded
  - name: average
    label: Average
    color: orange
    rank: 30
    health_effect: degraded
  - name: high
    label: High
    color: red
    rank: 40
    health_effect: outage
  - name: disaster
    label: Disaster
    color: darkred
    rank: 50
    health_effect: outage
