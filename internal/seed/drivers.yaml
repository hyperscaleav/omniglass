# The official drivers, seeded idempotently at boot. A driver is the
# implementation that gets/emits/sets a product's signals; a product points at
# one. The registry lists alphabetically by label. Starter set,
# operator-extensible later; tune freely. Fictional-brand drivers match the
# omniglass-lab device surfaces: Kestrel speaks an HTTP JSON device API,
# Newtron a vendor control protocol, Boreal and the audio rack SNMP.
#
# A driver's `spec` is its declarative body (#813): data, not code, interpreted
# by one generic engine, validated against the catalogs at every seed. A driver
# without one is a stub that cannot be attached yet.
drivers:
  - id: snmp-generic
    label: Generic SNMP
    version: "1.0.0"
    spec:
      version: 1
      transport: snmp
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "161" }
        - { name: community, kind: secret, secret_type: snmp-community, required: true }
      polls:
        - name: scalars
          schedule: { every: 60s }
          # The MIB-II system scalars every v2c agent answers: sysDescr and
          # sysUpTime, the generic driver's whole menu (v2c scalar GET only;
          # walk and discovery are out of the epic's scope).
          request: { get: ["1.3.6.1.2.1.1.1.0", "1.3.6.1.2.1.1.3.0"] }
          emits:
            - { name: model-number, extract: { oid: "1.3.6.1.2.1.1.1.0" } }
            # sysUpTime is timeticks (hundredths); the declared scale lands it
            # in the canon's seconds.
            - { name: uptime, extract: { oid: "1.3.6.1.2.1.1.3.0" }, transform: { scale: 0.01 } }
  - id: kestrel-api
    label: Kestrel Device API
    version: "1.0.0"
    spec:
      version: 1
      # The Kestrel bar answers its JSON API only over https on 443 (#902):
      # its own registry entry over the tls handshake, the bar's self-signed
      # key pinned on first use, every request carrying basic auth.
      transport: https
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "443" }
        - { name: tls-mode, kind: string, default: pin }
        - { name: login, kind: secret, secret_type: basic-auth, required: true }
      session:
        credential: login
        scheme: basic
        # The bar's live feed (#1038), held open as a session behind the
        # same basic auth: every change to the call, the volume, the mute
        # and the power state arrives as an event the moment it happens, so
        # the listeners below land it with no poll. A drop resumes from the
        # last event id; the polls stay requests of their own.
        stream: { path: /api/events }
      listeners:
        # Each event's data names the state path it changed and the new
        # value: a JSON field match claims it, a jsonpath reads the value.
        - name: volume-change
          match: { event: change, field: { path: path, equals: status.audio.volume } }
          emits:
            - { name: volume, extract: { jsonpath: value } }
        - name: mute-change
          match: { event: change, field: { path: path, equals: status.audio.mic_mute } }
          emits:
            - { name: mute, extract: { jsonpath: value } }
        - name: call-change
          match: { event: change, field: { path: path, equals: status.call.active } }
          emits:
            - { name: call-state, extract: { jsonpath: value }, transform: { map: { "true": active, "false": idle } } }
        - name: participants-change
          match: { event: change, field: { path: path, equals: status.call.participants } }
          emits:
            - { name: participant-count, extract: { jsonpath: value } }
        - name: power-change
          match: { event: change, field: { path: path, equals: status.device.power } }
          emits:
            - { name: power-state, extract: { jsonpath: value } }
      polls:
        - name: system
          schedule: { every: 5m }
          request: { path: /api/system }
          emits:
            - { name: model-number, extract: { jsonpath: model } }
            - { name: serial-number, extract: { jsonpath: serial } }
            - { name: firmware-version, extract: { jsonpath: firmware } }
            - { name: uptime, extract: { jsonpath: uptime } }
            - { name: power-state, extract: { jsonpath: power } }
        - name: call
          schedule: { every: 30s }
          request: { path: /api/call }
          emits:
            - { name: call-state, extract: { jsonpath: active }, transform: { map: { "true": active, "false": idle } } }
            - { name: participant-count, extract: { jsonpath: participants } }
        - name: audio
          schedule: { every: 30s }
          request: { path: /api/audio }
          emits:
            - { name: volume, extract: { jsonpath: volume } }
            - { name: mute, extract: { jsonpath: mic_mute } }
      commands:
        # A whole-leaf ${value} keeps the intended value's type: the volume
        # rides as a number. The bar acknowledges with {"ok": true}.
        - command_type: set-volume
          request: { method: POST, path: /api/audio/volume, body: { volume: "${value}" } }
          settle: { from: response, success: { regex: '"ok":\s*true' } }
        - command_type: set-mute
          request: { method: POST, path: /api/audio/mute, body: { mute: "${value}" } }
          settle: { from: response, success: { regex: '"ok":\s*true' } }
        # The standby acknowledgement names the power state it entered,
        # which settles the command against its intent.
        - command_type: set-power
          request: { method: POST, path: /api/system/standby, body: { power: "${value}" } }
          settle: { from: response, extract: { jsonpath: power } }
  - id: kestrel-ws
    label: Kestrel Control Socket
    version: "1.0.0"
    spec:
      version: 1
      # The Kestrel bar's control socket (#1034): a JSON message per text
      # frame over wss on 9443, the bar's self-signed key pinned on first
      # use, the upgrade carrying basic auth. One held socket carries it all:
      # the subscription armed on every connection, the pushes the listeners
      # land, and the polls and commands, each answered by the frame that
      # carries back the id the node mints into it, whatever pushes arrive
      # between.
      transport: wss
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "9443" }
        - { name: tls-mode, kind: string, default: pin }
        - { name: login, kind: secret, secret_type: basic-auth, required: true }
      session:
        credential: login
        scheme: basic
        upgrade: { path: /api/ws }
      listeners:
        # A push names the state path it changed and the new value: a JSON
        # field match claims it, a jsonpath reads the value. The one
        # subscribe, sent on every connection before anything else, rides
        # the first listener.
        - name: call-change
          arm: ['{"type":"subscribe","paths":["status.audio.volume","status.audio.mic_mute","status.call","status.device.power"]}']
          match: { field: { path: path, equals: status.call.active } }
          emits:
            - { name: call-state, extract: { jsonpath: value }, transform: { map: { "true": active, "false": idle } } }
        - name: mute-change
          match: { field: { path: path, equals: status.audio.mic_mute } }
          emits:
            - { name: mute, extract: { jsonpath: value } }
        - name: participants-change
          match: { field: { path: path, equals: status.call.participants } }
          emits:
            - { name: participant-count, extract: { jsonpath: value } }
        - name: power-change
          match: { field: { path: path, equals: status.device.power } }
          emits:
            - { name: power-state, extract: { jsonpath: value } }
        - name: volume-change
          match: { field: { path: path, equals: status.audio.volume } }
          emits:
            - { name: volume, extract: { jsonpath: value } }
      polls:
        # A get is a frame; reply.correlate names the field the node writes
        # a fresh id into, and the answer is the frame carrying it back.
        - name: volume
          schedule: { every: 60s }
          request: { body: { type: get, path: status.audio.volume }, reply: { correlate: id, error: { regex: '"type":"error"' } } }
          emits:
            - { name: volume, extract: { jsonpath: value } }
        - name: mute
          schedule: { every: 60s }
          request: { body: { type: get, path: status.audio.mic_mute }, reply: { correlate: id, error: { regex: '"type":"error"' } } }
          emits:
            - { name: mute, extract: { jsonpath: value } }
        - name: power
          schedule: { every: 60s }
          request: { body: { type: get, path: status.device.power }, reply: { correlate: id, error: { regex: '"type":"error"' } } }
          emits:
            - { name: power-state, extract: { jsonpath: value } }
      commands:
        # A whole-leaf ${value} keeps the intended value's type. The bar
        # pushes the change, then answers with the value it set, which
        # settles the command against its intent.
        - command_type: set-volume
          request: { body: { type: set, path: status.audio.volume, value: "${value}" }, reply: { correlate: id, error: { regex: '"type":"error"' } } }
          settle: { from: response, extract: { jsonpath: value } }
        - command_type: set-mute
          request: { body: { type: set, path: status.audio.mic_mute, value: "${value}" }, reply: { correlate: id, error: { regex: '"type":"error"' } } }
          settle: { from: response, extract: { jsonpath: value } }
  - id: newtron-nvp
    label: Newtron NVP
    version: "1.0.0"
    spec:
      version: 1
      transport: tcp
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "51325" }
      polls:
        - name: status
          schedule: { every: 30s }
          # The reply shape picks GET INPUT's answer out of the EVT pushes
          # sharing the held session (#817); the panel refuses with a -ERR
          # line, which answers the ask as a failure rather than a timeout.
          request: { line: "GET INPUT", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
          emits:
            - { name: video-input, extract: { regex: "^INPUT (\\S+)$" } }
      # The NVP conversation is line-oriented over a held TCP session: the
      # subscribe arms on establish (and re-arms on every recover), and the
      # device pushes EVT lines the listener claims by prefix. The standing
      # listen task is what makes the node hold the endpoint's session (#816):
      # SUBSCRIBE INPUT is sent on every connection before it reads up, the
      # EVT pushes land as video-input samples with no poll involved, and the
      # status poll and set-input command borrow the same connection (#817).
      listeners:
        - name: events
          arm: ["SUBSCRIBE INPUT"]
          match: { prefix: "EVT " }
          emits:
            - { name: video-input, extract: { regex: "^EVT INPUT (\\S+)$" } }
      commands:
        # The panel answers SET INPUT with the input it now shows, so the
        # reply settles the command (ADR-0141).
        - command_type: set-input
          request: { line: "SET INPUT ${value}", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
          settle: { from: response, extract: { regex: "^INPUT (\\S+)$" } }
  - id: newtron-nvp-telnet
    label: Newtron NVP over Telnet
    version: "1.0.0"
    spec:
      version: 1
      transport: telnet
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "23" }
        - { name: login, kind: secret, secret_type: basic-auth, required: true }
      # The same NVP conversation behind the panel's Telnet login (#1033).
      # The login is the session's auth step (#1049): it runs on every
      # connection before anything rides it, its prompts end no line, and
      # the panel's refusal is terminal, so a wrong password is one attempt
      # and the session reads rejected rather than locking the account.
      session:
        login:
          steps:
            - { expect: { regex: "^login: ?$" }, send: "${secret.login.username}" }
            - { expect: { regex: "^Password: ?$" }, send: "${secret.login.password}" }
          ready: { prefix: "Newtron Panel 7 NVP ready" }
        terminal:
          - { class: auth, match: { prefix: "auth rejected" } }
      polls:
        - name: status
          schedule: { every: 30s }
          request: { line: "GET INPUT", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
          emits:
            - { name: video-input, extract: { regex: "^INPUT (\\S+)$" } }
      listeners:
        - name: events
          arm: ["SUBSCRIBE INPUT"]
          match: { prefix: "EVT " }
          emits:
            - { name: video-input, extract: { regex: "^EVT INPUT (\\S+)$" } }
      commands:
        - command_type: set-input
          request: { line: "SET INPUT ${value}", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
          settle: { from: response, extract: { regex: "^INPUT (\\S+)$" } }
  - id: newtron-nvp-ssh
    label: Newtron NVP over SSH
    version: "1.0.0"
    spec:
      version: 1
      transport: ssh
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "22" }
        - { name: login, kind: secret, secret_type: basic-auth, required: true }
      # The same NVP conversation over the panel's SSH shell (#1032). SSH's
      # own userauth is the session's auth step (#1049), with the login
      # secret as the credential; a refused credential and a changed host key
      # are both terminal, and the host key is pinned on first use.
      session:
        credential: login
      polls:
        - name: status
          schedule: { every: 30s }
          request: { line: "GET INPUT", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
          emits:
            - { name: video-input, extract: { regex: "^INPUT (\\S+)$" } }
      listeners:
        - name: events
          arm: ["SUBSCRIBE INPUT"]
          match: { prefix: "EVT " }
          emits:
            - { name: video-input, extract: { regex: "^EVT INPUT (\\S+)$" } }
      commands:
        - command_type: set-input
          request: { line: "SET INPUT ${value}", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
          settle: { from: response, extract: { regex: "^INPUT (\\S+)$" } }
  - id: newtron-nvp-tls
    label: Newtron NVP over TLS
    version: "1.0.0"
    spec:
      version: 1
      transport: tls
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "51326" }
        # The panel self-signs its certificate, so this driver pins the
        # public key on first use rather than verifying it against roots
        # (#1035). An operator may edit the mode in place: verify for gear
        # with a certificate a root vouches for, skip (never a default) for
        # gear whose key changes on every boot.
        - { name: tls-mode, kind: string, default: pin }
      # The same NVP conversation over the panel's TLS port. The handshake is
      # the transport rung: a changed key is a terminal certificate refusal,
      # so nothing (a poll, a command, an arm) reaches a key nobody trusted.
      polls:
        - name: status
          schedule: { every: 30s }
          request: { line: "GET INPUT", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
          emits:
            - { name: video-input, extract: { regex: "^INPUT (\\S+)$" } }
      listeners:
        - name: events
          arm: ["SUBSCRIBE INPUT"]
          match: { prefix: "EVT " }
          emits:
            - { name: video-input, extract: { regex: "^EVT INPUT (\\S+)$" } }
      commands:
        - command_type: set-input
          request: { line: "SET INPUT ${value}", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
          settle: { from: response, extract: { regex: "^INPUT (\\S+)$" } }
  - id: newtron-nvp-udp
    label: Newtron NVP over UDP
    version: "1.0.0"
    spec:
      version: 1
      transport: udp
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "51327" }
        # The local port this endpoint binds, which its requests leave from
        # and the panel's pushes arrive on (#1037). No default: the node
        # binds a port of its own and the panel pushes to the source of
        # SUBSCRIBE INPUT. Set it where the component is configured with a
        # fixed destination, and open the node's firewall for it.
        - { name: listen-port, kind: number }
      # The same NVP conversation as datagrams. An open udp port cannot be
      # detected, so the transport rung is GET INPUT answered: an answer
      # reads responsive, silence reads timed out, and a port the host
      # refuses reads refused. A lost request is re-sent twice (the default)
      # within the endpoint's timeout.
      ladder:
        transport:
          request: { line: "GET INPUT", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
      polls:
        - name: status
          schedule: { every: 30s }
          request: { line: "GET INPUT", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } } }
          emits:
            - { name: video-input, extract: { regex: "^INPUT (\\S+)$" } }
      # SUBSCRIBE INPUT arms when the socket opens and again whenever the
      # request rung recovers (a panel that rebooted forgot its subscriber);
      # the EVT pushes arrive on the endpoint's own port.
      listeners:
        - name: events
          arm: ["SUBSCRIBE INPUT"]
          match: { prefix: "EVT " }
          emits:
            - { name: video-input, extract: { regex: "^EVT INPUT (\\S+)$" } }
      commands:
        # SET INPUT names the input, so sending it twice selects it once:
        # the binding declares retries, which a command never gets by
        # default (a relative step sent twice would step twice).
        - command_type: set-input
          request: { line: "SET INPUT ${value}", reply: { prefix: "INPUT ", error: { prefix: "-ERR" } }, retries: 2 }
          settle: { from: response, extract: { regex: "^INPUT (\\S+)$" } }
  - id: http-json
    label: HTTP JSON
    version: "1.0.0"
    spec:
      version: 1
      # The Tessellate Census answers its JSON API over plain http on 80
      # (#902), every request carrying its api key in the X-Census-Key header.
      transport: http
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "80" }
        - { name: key, kind: secret, secret_type: api-key, required: true }
      session:
        credential: key
        scheme: api-key
        api_key: { in: header, name: X-Census-Key }
      polls:
        - name: status
          schedule: { every: 5m }
          request: { path: /api/status }
          emits:
            - { name: model-number, extract: { jsonpath: device.model } }
            - { name: serial-number, extract: { jsonpath: device.serial } }
            - { name: firmware-version, extract: { jsonpath: device.firmware } }
            - { name: uptime, extract: { jsonpath: device.uptime } }
        - name: occupancy
          schedule: { every: 30s }
          request: { path: /api/occupancy }
          emits:
            - { name: occupancy-state, extract: { jsonpath: vacant }, transform: { map: { "true": vacant, "false": occupied } } }
  - id: newtron-panel-web
    label: Newtron Panel Web
    version: "1.0.0"
    spec:
      version: 1
      # The Newtron panel's https API sits behind its sign-in page (#1114).
      # The login is the session's auth step, carried over to http: one form
      # post naming the login secret's fields, the session cookie the panel
      # sets kept in the node's memory alone, and a redirect back to /login
      # read as the session lapsing, which logs in once more and replays.
      # The panel sending the login itself back to /login is a wrong
      # password: one attempt, and the endpoint reads rejected.
      transport: https
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "443" }
        - { name: tls-mode, kind: string, default: pin }
        - { name: login, kind: secret, secret_type: basic-auth, required: true }
      session:
        login:
          path: /login
          steps:
            - request:
                method: POST
                path: /login
                body_format: form
                body: { username: "${secret.login.username}", password: "${secret.login.password}" }
      polls:
        - name: status
          schedule: { every: 30s }
          request: { path: /api/status }
          emits:
            - { name: model-number, extract: { jsonpath: device.model } }
            - { name: serial-number, extract: { jsonpath: device.serial } }
            - { name: firmware-version, extract: { jsonpath: device.firmware } }
            - { name: uptime, extract: { jsonpath: device.uptime } }
  - id: boreal-edge-web
    label: Boreal Edge Web Admin
    version: "1.0.0"
    spec:
      version: 1
      # The Boreal display's web admin answers HTTP digest (#1114): the
      # password never crosses the wire, only a hash of it with the
      # display's nonce. The node holds the challenge and answers each
      # request preemptively; a nonce the display calls stale is answered
      # afresh, and an answer refused outright is a wrong password.
      transport: http
      inputs:
        - { name: host, kind: string, required: true }
        - { name: port, kind: number, default: "80" }
        - { name: login, kind: secret, secret_type: basic-auth, required: true }
      session:
        credential: login
        scheme: digest
      polls:
        - name: identity
          schedule: { every: 60s }
          request: { path: /api/status }
          emits:
            - { name: model-number, extract: { jsonpath: device.model } }
            - { name: serial-number, extract: { jsonpath: device.serial } }
            - { name: uptime, extract: { jsonpath: device.uptime } }
      commands:
        # The power acknowledgement names the state the display entered,
        # which settles the command against its intent.
        - command_type: set-power
          request: { method: POST, path: /api/display/power, body: { power: "${value}" } }
          settle: { from: response, extract: { jsonpath: power } }
