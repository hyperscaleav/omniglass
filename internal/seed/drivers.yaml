# The official drivers, seeded idempotently at boot. A driver is the
# implementation that gets/emits/sets a product's signals (e.g. "Generic SNMP",
# "Cisco xAPI"); a later product slice will point at one. The registry lists
# alphabetically by label. Starter set, operator-extensible later; tune
# freely.
drivers:
  - id: snmp-generic
    label: Generic SNMP
    version: "1.0.0"
  - id: cisco-xapi
    label: Cisco xAPI
  - id: crestron-cip
    label: Crestron CIP
  - id: http-json
    label: HTTP JSON
    version: "1.0.0"
