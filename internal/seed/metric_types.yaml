# The official metric_type canon, seeded idempotently at boot. A metric type is a
# numeric series key (kebab-case) on the metric lane of the catalog (#587): the
# value is always a number (data_type int|float), and the lane carries the numeric
# facts (unit, precision) the property lane never holds. A probe's result
# (icmp-reachable, tcp-open) is a state, not a number, so it is a property type
# (#1592); only its timing lives here.
metric_types:
  - name: icmp-rtt-avg
    data_type: float
    unit: ms
    label: ICMP RTT (avg)
    description: Average round-trip time over the task's echoes; absent when unreachable.
  - name: tcp-connect-time
    data_type: float
    unit: ms
    label: TCP Connect Time
    description: Time to establish the TCP connection; absent when the port is closed.
  # Collection telemetry (#1369): each endpoint's account of its own
  # collection over a report window (collection.report_seconds), the
  # built-in data every endpoint carries whatever its driver. The node writes
  # the poll and push keys; the server writes the webhook keys.
  - name: poll-duration
    data_type: float
    unit: ms
    label: Poll Duration
    description: Mean time of the endpoint's driver poll runs over the report window, scheduled or run now, answered or failed; absent when no poll ran.
  - name: poll-failure-count
    data_type: int
    label: Poll Failures
    description: The endpoint's driver polls that failed in the report window (faulted and landed nothing, or refused by the endpoint's gate); reported only when nonzero.
  - name: poll-held-count
    data_type: int
    label: Held Polls
    description: The endpoint's due driver polls its gate held in the report window because its probe reads it unreachable; never sent, so not failures; reported only when nonzero.
  - name: poll-due-count
    data_type: int
    label: Due Polls
    description: The endpoint's driver polls that fell due in the report window, each on its own interval, held, refused and skipped ones included; reported only when nonzero.
  - name: poll-skipped-count
    data_type: int
    label: Skipped Polls
    description: The endpoint's due driver polls the node skipped in the report window because the poll's last run was still in flight; counted, never queued; reported only when nonzero.
  - name: push-message-count
    data_type: int
    label: Pushed Messages
    description: Messages the endpoint's held session or udp socket delivered that a listener claimed in the report window; zero when quiet.
  - name: push-unclaimed-count
    data_type: int
    label: Unclaimed Messages
    description: Messages the endpoint delivered that no listener claimed in the report window; reported only when nonzero.
  - name: webhook-post-count
    data_type: int
    label: Webhook Posts
    description: Webhook posts to the endpoint the server accepted in the report window; one zero follows a window with posts, then none while quiet.
  - name: webhook-refusal-count
    data_type: int
    label: Webhook Refusals
    description: Webhook posts to the endpoint the server refused (a bad signature, a missing credential) in the report window; reported only when nonzero.
  # Platform self-monitoring (#1625, #1094): a node's account of its own
  # schedule, spool, sessions and process, landed on the node's component in
  # the platform system under the platform writer class. Only the node (and the
  # server, for checkin-age) may write them; no driver, rule or operator can.
  - name: checkin-age
    data_type: float
    unit: s
    label: Check-in Age
    description: Seconds since the node's last heartbeat reached the server (since its enrollment, before its first), written by the server every platform tick; keeps growing while the node is silent.
  - name: worklist-task-count
    data_type: int
    label: Worklist Tasks
    description: Tasks in the worklist the node installed, sampled on each install.
  - name: tick-duration
    data_type: float
    unit: ms
    label: Tick Duration
    description: The longest pass the node's dispatcher took over one heartbeat window, sampled each heartbeat.
  - name: tick-overrun-count
    data_type: int
    label: Tick Overruns
    description: Dues that met their task's previous run still in flight, so were skipped, over the report window; reported every window, 0 when quiet.
  - name: schedule-lateness
    data_type: float
    unit: ms
    label: Schedule Lateness
    description: The worst gap between a task's due time and its dispatch over one heartbeat window's scheduled runs.
  - name: schedule-gap-excess
    data_type: float
    unit: ms
    label: Schedule Gap Excess
    description: The worst deviation between a task's gap since its previous scheduled start and its interval over one heartbeat window; a poll keeping its interval reads 0, a skipped slot a whole interval.
  - name: schedule-skip-count
    data_type: int
    label: Schedule Skips
    description: Task dues the dispatcher passed over (a run still in flight, a late pass), over the report window; reported every window, 0 when quiet.
  - name: spool-batch-count
    data_type: int
    label: Spool Depth
    description: Batches waiting in the node's spool for the bus, sampled each tick.
  - name: spool-drop-count
    data_type: int
    label: Spool Drops
    description: Batches the spool dropped as full or overflowed, over the report window; reported every window, 0 when quiet.
  - name: publish-failure-count
    data_type: int
    label: Publish Failures
    description: Batches the bus refused, never acknowledged, or the node failed to encode, over the report window; reported every window, 0 when quiet.
  - name: session-held-count
    data_type: int
    label: Sessions Held
    description: Device sessions the node holds, one sample per session state as the instance, sampled each tick.
  - name: process-goroutine-count
    data_type: int
    label: Goroutines
    description: Goroutines the Omniglass process runs, sampled each tick.
  - name: process-heap-size
    data_type: int
    unit: bytes
    label: Heap Size
    description: Bytes of heap the Omniglass process holds in live and unswept objects, sampled each tick.
  - name: process-gc-pause
    data_type: float
    unit: ms
    label: GC Pause
    description: The most recent garbage collection pause of the Omniglass process; absent until the first collection.
  - name: process-cpu-seconds
    data_type: float
    unit: s
    label: CPU Time
    description: CPU time the Omniglass process spent since its previous sample (each tick on a node, each report window on the server), as the Go runtime estimates it rather than the kernel's account; divided by that interval it is the cores the process kept busy.
  - name: process-fd-count
    data_type: int
    label: Open Files
    description: File descriptors the Omniglass process holds open, sockets included; absent where the platform does not expose them.
  # The server's own request and database figures (#1627), landed on the
  # server's component in the platform system each report window. Only the
  # server writes them. An http-request-* sample's instance is the request's
  # method, route template and status class ("GET /api/v1/components/{name}
  # 2xx"), never its path, so the instance set stays as small as the API.
  - name: http-request-count
    data_type: int
    label: HTTP Requests
    description: Requests the server answered for one method, route template and status class over the report window; one zero follows a window with requests, then none while quiet.
  - name: http-request-duration
    data_type: float
    unit: ms
    label: HTTP Request Time
    description: Mean time the server took to answer a request of one method, route template and status class over the report window.
  - name: http-request-duration-max
    data_type: float
    unit: ms
    label: HTTP Request Time (max)
    description: The slowest request of one method, route template and status class over the report window.
  - name: db-slow-query-count
    data_type: int
    label: Slow Queries
    description: Queries that ran past the database slow-query threshold over the report window, each also logged as a warning with its fingerprint; one zero follows a window with slow queries.
  - name: db-pool-acquired
    data_type: int
    label: Pool Connections In Use
    description: Database connections the server's pool had checked out at the end of the report window.
  - name: db-pool-idle
    data_type: int
    label: Pool Connections Idle
    description: Open database connections the server's pool held idle at the end of the report window.
  - name: db-pool-total
    data_type: int
    label: Pool Connections Open
    description: Database connections the server's pool held open, in use or idle, at the end of the report window.
  - name: db-pool-max
    data_type: int
    label: Pool Size
    description: The most connections the server's pool may open; db-pool-total reaching it means a new query waits.
  - name: db-pool-wait-count
    data_type: int
    label: Pool Waits
    description: Connection acquires that found the pool exhausted and waited for a connection, over the report window.
  - name: db-pool-wait-duration
    data_type: float
    unit: ms
    label: Pool Wait Time
    description: Total time acquires spent waiting on an exhausted pool for a connection to free up or open, over the report window.
  # The server's pipeline (#1628), landed on the server's component in the
  # platform system each report window: how far behind ingest is, how deep
  # the queues stand, and whether the bus paths and sweeps fail. Every
  # failure count reads as a share of the count beside it, so zero is
  # healthy.
  - name: ingest-lag
    data_type: float
    unit: s
    label: Ingest Lag
    description: Mean time from a sample's timestamp to its batch's commit on the server, over the newest and oldest sample of each batch landed in the report window; the node's clock stamps the sample, so a skewed node clock reads as lag.
  - name: ingest-lag-max
    data_type: float
    unit: s
    label: Ingest Lag (max)
    description: The oldest sample's lag at commit across every batch landed in the report window.
  - name: ingest-batch-count
    data_type: int
    label: Batches Landed
    description: Telemetry batches the server committed over the report window; a redelivery its receipt held to a no-op landed nothing and counts none.
  - name: ingest-sample-count
    data_type: int
    label: Samples Landed
    description: Samples the server's committed telemetry batches landed over the report window; a node group the fence or the gateway dropped counts none.
  - name: ingest-lane-busy
    data_type: float
    unit: ratio
    label: Ingest Lane Busy
    description: Share of the report window the telemetry lane spent handling batches; near 1 the lane is saturated and the consumer backlog grows.
  - name: bus-consumer-pending
    data_type: int
    label: Telemetry Backlog
    description: Batches on the telemetry stream not yet delivered to the server's consumer, at the end of the report window.
  - name: bus-consumer-ack-pending
    data_type: int
    label: Telemetry In Flight
    description: Batches delivered to the server's telemetry consumer and not yet acknowledged, at the end of the report window.
  - name: bus-consumer-redelivered
    data_type: int
    label: Telemetry Redelivering
    description: Batches the telemetry consumer holds that were delivered more than once, at the end of the report window.
  - name: bus-telemetry-ack-failure-count
    data_type: int
    label: Telemetry Ack Failures
    description: Batch deliveries whose acknowledgement the bus did not confirm over the report window, a redelivery its receipt held included; each is redelivered and its receipt keeps it from landing twice, so this costs work, not rows. As a share of ingest-batch-count, healthy is 0.
  - name: bus-telemetry-drop-count
    data_type: int
    label: Telemetry Drops
    description: Batches the server gave up on over the report window, one sample per reason as the instance (refused, metadata, max-deliver, malformed); over itself plus ingest-batch-count it is the drop ratio.
  - name: bus-worklist-pull-count
    data_type: int
    label: Worklist Pulls
    description: Node worklist pulls the server answered over the report window, one sample per outcome as the instance (served, read-failed, oversize, respond-failed, expired, abandoned, busy).
  - name: bus-worklist-reply-bytes-max
    data_type: int
    unit: bytes
    label: Worklist Reply Size (max)
    description: The largest worklist reply the server holds sized for any node, at the end of the report window; nearing the bus payload limit means a reply will be refused as oversize.
  - name: bus-request-count
    data_type: int
    label: Bus Requests
    description: Node requests the server handled on the bus over the report window, one sample per path as the instance (heartbeat, command-pull, command-report).
  - name: bus-request-failure-count
    data_type: int
    label: Bus Request Failures
    description: Node requests on the bus the server failed to serve over the report window, one sample per path as the instance; a share of bus-request-count.
  - name: calc-pending-depth
    data_type: int
    label: Calc Backlog
    description: The deepest the queue of calculated metrics waiting to be computed stood over the report window.
  - name: calc-served-count
    data_type: int
    label: Calcs Served
    description: Calculated metric rows the server computed over the report window.
  - name: calc-pass-duration
    data_type: float
    unit: ms
    label: Calc Pass Time
    description: Mean time one pass over the calc queue took over the report window.
  - name: outbox-queued-depth
    data_type: int
    label: Outbox Depth
    description: Notifications queued to send, due or waiting out a retry backoff, at the end of the report window.
  - name: outbox-due-age
    data_type: float
    unit: s
    label: Outbox Due Age
    description: How long the oldest due notification has waited past its send time, at the end of the report window; zero when nothing is due.
  - name: sweep-duration
    data_type: float
    unit: ms
    label: Sweep Time
    description: Mean time one pass of a server sweep took over the report window, one sample per sweep as the instance (command-settlement, event-rule).
  - name: sweep-count
    data_type: int
    label: Sweeps
    description: Passes of a server sweep over the report window, one sample per sweep as the instance.
  - name: sweep-failure-count
    data_type: int
    label: Sweep Failures
    description: Passes of a server sweep that failed over the report window, one sample per sweep as the instance; a share of sweep-count.
  # A node's command queue (#1626), on the node's platform component: the
  # server writes all but the pull failures, which the node counts of itself.
  # Each is one observation per sample; a percentile derives from the
  # per-command latencies, never a stored average.
  - name: command-pending-count
    data_type: int
    label: Pending Commands
    description: Commands waiting for the node, the ones its next pull would take and the ones it took that await their execution report, sampled each platform tick.
  - name: command-pending-age
    data_type: float
    unit: s
    label: Oldest Pending Command
    description: Seconds the oldest command waiting for the node has waited since its issue, sampled each platform tick; zero while none waits.
  - name: command-dispatch-latency
    data_type: float
    unit: ms
    label: Command Dispatch Latency
    description: Time from a command's issue to the first time a node took it, one sample per command at that take; a command no node takes writes none and counts as expired.
  - name: command-execution-latency
    data_type: float
    unit: ms
    label: Command Execution Latency
    description: Time from a command's first take to the node's execution report, one sample per command at the report.
  - name: command-redelivery-count
    data_type: int
    label: Command Redeliveries
    description: Commands a pull redelivered (taken again after no report came) over the platform tick's window, read 5 s behind the tick so a take still committing is not missed; reported only when nonzero.
  - name: command-stuck-count
    data_type: int
    label: Stuck Commands
    description: Commands the node took that have had no execution report for longer than the redelivery wait, still inside the delivery window, sampled each platform tick.
  - name: command-expired-count
    data_type: int
    label: Expired Commands
    description: Commands that aged past the delivery window unexecuted over the platform tick's window, instance undelivered (no node took it) or unexecuted (taken, never reported); reported only when nonzero.
  - name: command-pull-failure-count
    data_type: int
    label: Command Pull Failures
    description: Pulls of the node's command queue that failed (no answer, or one it could not read), over the report window; reported every window, 0 when quiet.
  # Room-level series: the first standard-contract metrics (#790). A meeting
  # room's standard declares them, so every conforming system's zoom shows the
  # same KPI tiles; the sensor feeding them is whatever the room's build wires
  # in (a bar's occupancy count, a thermostat's probe).
  - name: room-temperature
    data_type: float
    unit: "C"
    label: Room Temperature
    description: Ambient temperature reported for the space, in degrees Celsius.
  - name: occupancy-count
    data_type: int
    label: Occupancy Count
    description: People detected in the space by the room's occupancy source.
  # A space's bookings, as its scheduling service pushes them (#1370): the
  # lab's simulated booking service pushes them to a system.
  - name: booking-count
    data_type: int
    label: Booking Count
    description: Meetings booked in the space for the rest of the day, the one in progress included, as its scheduling service reports them.
  - name: uptime
    data_type: float
    unit: s
    label: Uptime
    description: How long the device reports it has been running, in seconds (an SNMP sysUpTime scaled from timeticks, or the driver's equivalent).
  # A conferencing component's call and audio, the kestrel-api driver's menu
  # (#902): volume a settable quantity (the set-volume command targets it).
  - name: volume
    data_type: float
    unit: "%"
    label: Volume
    description: >-
      The output volume a component reports, as a percentage of its range. A settable
      quantity: the set-volume command opens an intended volume and settles when the
      component reports it.
  - name: participant-count
    data_type: int
    label: Participant Count
    description: The participants a component reports in its current call; 0 when no call is active.
  # A microphone's input level and a wireless transmitter's battery (#894).
  - name: audio-level
    data_type: float
    unit: dBFS
    label: Audio Level
    description: The audio level a component reports, in decibels relative to digital full scale (0 is the loudest it can carry).
  # Dimensionless, so stored as a ratio (0..1) and shown as a percentage.
  - name: battery-charge
    data_type: float
    unit: ratio
    precision: 3
    label: Battery Charge
    description: How charged a component reports its battery, as a fraction of full (0 to 1).
  # A projector's light source wears by the hour (#899): the number its
  # service interval and replacement are planned from.
  - name: light-source-hours
    data_type: float
    unit: h
    label: Light Source Hours
    description: The hours a component reports its light source (a projector's lamp or laser) has been lit.
  # A component's own thermal state, read off its API (#898): one name per
  # measurement whatever the component, the heatsink of an amplifier or the
  # chassis of a DSP alike.
  - name: temperature
    data_type: float
    unit: "C"
    label: Temperature
    description: The temperature a component reports of itself (its chassis, heatsink or processor), in degrees Celsius.
  - name: fan-speed
    data_type: float
    unit: rpm
    label: Fan Speed
    description: The speed a component reports of its cooling fan, in revolutions per minute.
  # A powered component's electrical state, read off its own meter (#1368).
  - name: voltage
    data_type: float
    unit: V
    label: Voltage
    description: The voltage a component reports at its input, in volts.
  - name: current
    data_type: float
    unit: A
    precision: 2
    label: Current
    description: The total current a component reports drawing, in amperes.
  # A PTZ camera's position and a codec's plugged-in peripherals (#897).
  - name: pan-angle
    data_type: float
    unit: deg
    precision: 1
    label: Pan Angle
    description: How far a camera reports it is panned from its centre, in degrees (negative to the left, positive to the right).
  - name: tilt-angle
    data_type: float
    unit: deg
    precision: 1
    label: Tilt Angle
    description: How far a camera reports it is tilted from level, in degrees (negative down, positive up).
  - name: zoom-level
    data_type: float
    unit: x
    precision: 1
    label: Zoom Level
    description: The magnification a camera reports, as a multiple of its widest view (1 is the widest).
  - name: camera-preset
    data_type: int
    label: Camera Preset
    description: The number of the stored position a camera reports it is on; 0 when it is on none (it was pointed by hand or is tracking).
  - name: peripheral-count
    data_type: int
    label: Peripheral Count
    description: How many peripherals (cameras, microphones, touch panels) a component reports attached to it.
  # A media player's local storage filling as content syncs down (#893).
  # Dimensionless, so stored as a ratio (0..1) and shown as a percentage.
  - name: storage-utilization
    data_type: float
    unit: ratio
    precision: 3
    label: Storage Utilization
    description: How full a component reports its local storage, as a fraction of its capacity (0 to 1).
  # A recording service's work (#1363): the recordings it is writing now and
  # the queue waiting to be written.
  - name: active-recording-count
    data_type: int
    label: Active Recording Count
    description: The recordings a component reports it has in progress now.
  - name: queue-depth
    data_type: int
    label: Queue Depth
    description: The items a component reports waiting in its work queue, not yet picked up.
  - name: http-response-time
    data_type: float
    unit: ms
    label: HTTP Response Time
    description: Time for the probe's HTTP request to draw a response (any status); absent when the API never answered.
  - name: ssh-handshake-time
    data_type: float
    unit: ms
    label: SSH Handshake Time
    description: Time for the SSH key exchange to reach authentication; absent when the daemon never completed it.
  - name: telnet-response-time
    data_type: float
    unit: ms
    label: Telnet Response Time
    description: Time for a telnet port to send its first bytes (an option negotiation or a banner) after the connection opened; absent when the port accepted and stayed silent.
  - name: tls-handshake-time
    data_type: float
    unit: ms
    label: TLS Handshake Time
    description: Time for the TLS handshake to reach the certificate after the connection opened, one observation per probe the component answered; absent when it never answered the handshake.
  - name: udp-response-time
    data_type: float
    unit: ms
    label: UDP Response Time
    description: Time for a udp endpoint's request rung to be answered, from its first send, so a lost datagram's retry shows as time; one observation per probe the component answered, absent when every attempt was lost.
  - name: snmp-response-time
    data_type: float
    unit: ms
    label: SNMP Response Time
    description: Time for an snmp endpoint's request rung, a get of a standard OID, to be answered, one observation per probe the agent answered (an authorizationError included); absent when the get went unanswered.
  - name: tls-certificate-days-left
    data_type: float
    unit: d
    label: TLS Certificate Days Left
    description: Days from the probe to the not-after of the certificate a tls probe accepted, to the hundredth, negative once it has expired; one observation per probe, the number a threshold rule reads (an expression cannot read the clock).
