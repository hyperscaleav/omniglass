# The official event rules (#920, ADR-0144). Authoritative: the boot seed
# upserts these on every start, read-only to operators, who author their own
# alongside. A rule names the event type it writes when its condition starts
# (fire_event_type, required) and ends (clear_event_type, optional), and the
# severity its alarm is raised at (absent: informational, no alarm) (#948).
# Criteria are expressions over the sample (#957): value, key, instance,
# component.name and component.type; an absent clear is !(fire). A rule with
# a sample_window also reads window, the series' points over that span, oldest
# first, so its criteria can judge a trend with slope, growth and span (#1985).
rules:
  # An endpoint that stops answering opens an alarm on its component: one
  # alarm per endpoint, at a level that puts the component in outage, after
  # the verdict has read down for the sustain (so one failed poll does not
  # page). It clears when the endpoint reads up again. It writes the generic
  # condition pair until a semantic one is ruled.
  - name: reachability-lost
    label: Reachability lost
    description: An endpoint stopped answering its reachability probe.
    sample_key: endpoint-reachable
    fire: 'value == "down"'
    fire_sustain: 15s
    clear: 'value == "up"'
    severity: high
    fire_event_type: condition-started
    clear_event_type: condition-ended
  # The server falling behind its fleet (#1094, #1628): the oldest sample
  # landed in a report window is past the threshold for a sustained stretch,
  # so one slow window (a burst, a restart's catch-up) does not page. Raised
  # on the server's own platform component; it clears when the window's
  # oldest landing reads back under the threshold.
  - name: ingest-lag-high
    label: Ingest lag high
    description: The server is landing telemetry more than 30 seconds behind its sample timestamps.
    sample_key: ingest-lag-max
    fire: 'value > 30'
    fire_sustain: 2m
    clear: 'value <= 30'
    severity: warning
    fire_event_type: condition-started
    clear_event_type: condition-ended
  # A claimed node gone quiet (#1094, #1707): the server's check-in timer
  # writes each claimed node's checkin-age every 15 s, and an age past 90 s is
  # three of a node's 30 s heartbeats missed. The age is itself the sustain, so
  # the rule fires on the first reading past it, with no fire_sustain of its
  # own. Raised on the node's platform component; it clears on the first
  # reading back at or under 90, which a node's next heartbeat brings.
  - name: node-silent
    label: Node silent
    description: A claimed node has not checked in for more than 90 seconds, three missed heartbeats.
    sample_key: checkin-age
    fire: 'value > 90'
    clear: 'value <= 90'
    severity: high
    fire_event_type: condition-started
    clear_event_type: condition-ended
  # A node running a stale worklist (#1868): every worklist pull in its report
  # window refused (the bus gave no worklist it could read), so it ran the
  # whole window on its last one, unaware of any edit since. Sustained, so a
  # server restart's brief refusals do not page. Raised on the node's platform
  # component; it clears on the first window with a pull served.
  - name: worklist-stale
    label: Worklist stale
    description: Every worklist pull the node made for two minutes was refused, so it is running its last worklist and misses every change since.
    sample_key: worklist-pull-loss-ratio
    fire: 'value == 1'
    fire_sustain: 2m
    clear: 'value < 1'
    severity: warning
    fire_event_type: condition-started
    clear_event_type: condition-ended
  # The server's data directory nearly out of room (#1094, #1707): the
  # filesystem holding it past 90 percent used for a sustained stretch, so a
  # brief spike (a large temporary file) does not page. It clears only once the
  # disk is back at or under 85 percent, so a disk sitting at the line does not
  # flap. Raised on the server's own platform component.
  - name: disk-nearly-full
    label: Disk nearly full
    description: The filesystem holding the server's data directory is more than 90 percent used.
    sample_key: data-dir-disk-used-ratio
    fire: 'value > 0.9'
    fire_sustain: 2m
    clear: 'value <= 0.85'
    severity: warning
    fire_event_type: condition-started
    clear_event_type: condition-ended
  # A retention lane, or a compaction, that stops short of its window pass
  # after pass opens a warning on the server's platform component (#1629):
  # one alarm per lane, once the flag has read 1 for the sustain. A pass left
  # behind runs again a minute later, so 5m is several catch-up passes that
  # did not catch up. It clears on the first pass that does. A lane whose
  # prune or compaction errors is flagged behind too, since it did not reach
  # its window, and the error counts in retention-pass-failure-count.
  - name: retention-behind
    label: Retention behind
    description: A retention lane or compaction stopped short of its window and stayed behind.
    sample_key: retention-behind
    fire: 'value == 1'
    fire_sustain: 5m
    clear: 'value == 0'
    severity: warning
    fire_event_type: condition-started
    clear_event_type: condition-ended
  # A process whose heap climbs steadily for six hours (#1985), the shape of a
  # leak: the least-squares line through the window rises by more than a
  # quarter of the heap's mean, and the window holds at least five hours of
  # samples, so a process just started (its warm-up) does not judge on a short
  # series. The garbage collector's sawtooth averages out of a six-hour fit;
  # the hour's sustain absorbs a load step. Raised on the platform component
  # of the process that reports it, a node's or the server's; it clears once
  # the fitted rise is back under a tenth.
  - name: process-heap-growing
    label: Process heap growing
    description: An Omniglass process's heap has grown steadily by more than a quarter over six hours.
    sample_key: process-heap-size
    sample_window: 6h
    fire: 'span(window) >= 18000 && growth(window) > 0.25'
    fire_sustain: 1h
    clear: 'growth(window) <= 0.1'
    severity: average
    fire_event_type: condition-started
    clear_event_type: condition-ended
  # A process whose goroutine count climbs steadily for six hours (#1985): a
  # goroutine started per request or per session and never returned. The same
  # shape and thresholds as process-heap-growing.
  - name: process-goroutines-growing
    label: Process goroutines growing
    description: An Omniglass process's goroutine count has grown steadily by more than a quarter over six hours.
    sample_key: process-goroutine-count
    sample_window: 6h
    fire: 'span(window) >= 18000 && growth(window) > 0.25'
    fire_sustain: 1h
    clear: 'growth(window) <= 0.1'
    severity: average
    fire_event_type: condition-started
    clear_event_type: condition-ended
  # A database that keeps growing past what retention trims (#1985): over a
  # day, db-size's fitted rise is more than a quarter of its size, held for
  # six hours. A database at its retention window holds level across a day
  # (a day's metric partition dropped as the next fills), so a quarter is
  # bloat or a lane retention does not reach. A fresh database grows while
  # its windows fill, a day's data on a few days' is past a quarter, so it
  # raises this alarm in its first days. Raised on the server's platform
  # component; it clears once the day's rise is back under a tenth.
  - name: db-size-growing
    label: Database size growing
    description: The Omniglass database has grown by more than a quarter over a day, past what retention trims.
    sample_key: db-size
    sample_window: 24h
    fire: 'span(window) >= 72000 && growth(window) > 0.25'
    fire_sustain: 6h
    clear: 'growth(window) <= 0.1'
    severity: average
    fire_event_type: condition-started
    clear_event_type: condition-ended
