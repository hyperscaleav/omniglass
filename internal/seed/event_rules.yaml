# The official event rules (#920, ADR-0144). Authoritative: the boot seed
# upserts these on every start, read-only to operators, who author their own
# alongside. A rule names the event type it writes when its condition starts
# (fire_event_type, required) and ends (clear_event_type, optional), and the
# severity its alarm is raised at (absent: informational, no alarm) (#948).
# Criteria are expressions over the sample (#957): value, key, instance,
# component.name and component.type; an absent clear is !(fire).
rules:
  # An endpoint that stops answering opens an alarm on its component: one
  # alarm per endpoint, at a level that puts the component in outage, after
  # the verdict has read down for the sustain (so one failed poll does not
  # page). It clears when the endpoint reads up again. It writes the generic
  # condition pair until a semantic one is ruled.
  - name: reachability-lost
    label: Reachability lost
    description: An endpoint stopped answering its reachability probe.
    sample_key: endpoint-reachable
    fire: 'value == "down"'
    fire_sustain: 15s
    clear: 'value == "up"'
    severity: high
    fire_event_type: condition-started
    clear_event_type: condition-ended
  # A retention lane, or a compaction, that stops short of its window pass
  # after pass opens a warning on the server's platform component (#1629):
  # one alarm per lane, once the flag has read 1 for the sustain. A pass left
  # behind runs again a minute later, so 5m is several catch-up passes that
  # did not catch up. It clears on the first pass that does. A lane whose
  # prune or compaction errors is flagged behind too, since it did not reach
  # its window, and the error counts in retention-pass-failure-count.
  - name: retention-behind
    label: Retention behind
    description: A retention lane or compaction stopped short of its window and stayed behind.
    sample_key: retention-behind
    fire: 'value == 1'
    fire_sustain: 5m
    clear: 'value == 0'
    severity: warning
    fire_event_type: condition-started
    clear_event_type: condition-ended
