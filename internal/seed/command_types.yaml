# The ship-with command_type registry (ADR-0063): the driver-owned catalog of what a
# component can be told, the "do" half of the telemetry model. A settleable command
# names one target arm, target_property_type or target_metric_type, never both (it
# opens an intended value and settles when observed matches); a fire-and-forget
# command has no target and just records the invocation. An unregistered or double
# target fails the seed run naming the row. A disruptive command (#1651) also
# names quiet_seconds and hold_seconds, neither of them the settle window.
command_types:
  - name: set-input
    label: Set Input
    description: >-
      Tell a display or switcher which video input to select. A settleable command:
      it opens an intended video-input and settles when the device reports that input
      within the settle window.
    target_property_type: video-input
    settle_window_seconds: 15
  - name: reboot
    label: Reboot
    description: >-
      Tell a component to restart. A fire-and-forget command: it records the
      invocation and a caused event, with no intended value to settle. A
      disruptive one: its delivery closes the gates of the component's
      endpoints on that node, the node runs nothing against them for the
      quiet period, then each reopens on its own first up verdict, with the
      hold as the backstop for one that never reads up.
    settle_window_seconds: 0
    disruptive: true
    quiet_seconds: 15
    hold_seconds: 300
  # The http drivers' actuations (#902).
  - name: set-volume
    label: Set Volume
    description: >-
      Tell a component its output volume, as a percentage. A settleable command: it
      opens an intended volume and settles when the component reports it, or when its
      reply confirms the change.
    target_metric_type: volume
    settle_window_seconds: 15
  - name: set-mute
    label: Set Mute
    description: >-
      Tell a component to mute ("true") or unmute ("false") its audio. A settleable
      command against the mute state.
    target_property_type: mute
    settle_window_seconds: 15
  - name: set-power
    label: Set Power
    description: >-
      Tell a component to turn on, turn off, or enter standby. A settleable command
      against the power state.
    target_property_type: power-state
    settle_window_seconds: 15
