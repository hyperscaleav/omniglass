# The shipped alarm routing (#1987): who is told about Omniglass's own alarms
# by default. A role target reaches everyone holding the role, directly or
# through a group grant, read at each alarm transition; each person is still
# told only about alarms on components they can read. Owner does not inherit
# admin, so the bootstrap owner is reached by a target of their own; a person
# holding both is told once. Both are official: the seed is authoritative on
# what it ships (a target's role and channels, a rule's label, description,
# on, when and shipped targets) on every boot, refuses an edit of those and
# a delete, and leaves the enabled switch, and any target an operator adds,
# to the operator: a disable survives a restart.
#
# Inbox only until a send with no mail relay configured is skipped rather
# than failed (#2016): shipping email would fail a row per person per
# transition on every install without a relay.
notification_targets:
  - name: platform-admins
    label: Platform admins
    kind: role
    role: admin
    channels: [inbox]
  - name: platform-owners
    label: Platform owners
    kind: role
    role: owner
    channels: [inbox]

action_rules:
  - name: platform-alarms-to-admins
    label: Platform alarms to admins
    description: >-
      Tells everyone holding admin or owner, in the console inbox, when one of
      Omniglass's own parts (a server or an outpost, the reserved platform
      system's members) raises or clears an alarm.
    on: [raised, cleared]
    when: platform
    targets: [platform-admins, platform-owners]
