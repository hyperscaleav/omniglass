# The shipped location types, written AUTHORITATIVELY on every boot
# (ON CONFLICT DO UPDATE) as official rows the platform owns (#703). An estate
# still shapes its own place vocabulary: an operator's edit of one of these
# FORKS it into registry_shadow and every read resolves the fork over the row
# (ADR-0095), so re-seeding never reverts an edit, and `:restore` hands the row
# back. What the authoritative write buys is the other direction, which
# insert-if-absent could not do at all: a value REMOVED from this file is
# actually withdrawn from an estate that already seeded it.
#
# The registry lists alphabetically by display_name; that ordering does NOT
# constrain nesting. allowed_parent_types is what does: a set of
# location_type ids and/or the reserved "root" sentinel (may sit at the top,
# no parent) this type may be placed under. Empty means unconstrained; these
# four ship the estate's implied hierarchy so a floor can never sit above a
# room, but "skip a level" (a room straight under a campus) still works.
# icon is a glyph key the console resolves to an SVG and renders as the leading
# glyph on every location of this type; an unknown key falls back to map-pin.
#
# NONE of the four carries a name_rule, so an operator names every location in a
# shipped estate. A campus, a building and a room were never in question: "17c"
# is ground truth an operator holds, not a default a platform can invent. `floor`
# shipped POSITIONAL for two slices (an empty stem, so a nameless floor create
# gave 1, then 2 within its building), and ADR-0103 reversed it. The reason is
# not that allocation was imprecise, it is that a floor's designation is not an
# integer at all: real buildings sign B2, LG, G, M, 1, 12A, P3, and an ordinal
# can spell none of them. That also dissolves the objection people reach for
# first, a basement: nobody signs a floor "-1", they sign it B1, which is already
# a legal name.
#
# The cost is stated rather than hidden: location name generation now ships
# DORMANT, correct and tested but demonstrated by nothing in a shipped estate.
# Inventing a fifth type to keep the demo alive was refused. An operator who
# wants a positional place declares one (a parking deck, a rack row, a berth) and
# the generator is there.
location_types:
  - id: campus
    display_name: Campus
    icon: landmark
    allowed_parent_types: [root]
  - id: building
    display_name: Building
    icon: building
    allowed_parent_types: [root, campus]
  - id: floor
    display_name: Floor
    icon: layers
    allowed_parent_types: [building, campus]
  - id: room
    display_name: Room
    icon: door-open
    allowed_parent_types: [floor, building, campus]
