# The ship-with event_type registry (ADR-0063): the occurrence keyspace, the twin
# of the property_type registry. An event is a discrete happening, not a sampled
# value. A registered name lets an occurrence be promoted from a raw log line into a
# typed event, and gives it a known, inspectable identity.
event_types:
  - name: log.line
    display_name: Log Line
    description: >-
      A device log line, the log-to-event sink's canonical starter type: a caught
      occurrence carrying a message (and optional structured attributes), promoted
      from a raw log rather than sampled as a value. Transport-agnostic: however the
      line arrived (syslog, an SNMP trap, a device event feed) is a source attribute,
      not part of the type.
  - name: call.started
    display_name: Call Started
    description: >-
      A conferencing endpoint entered an active call. A caught occurrence when the
      device reports it (an xAPI event), or a derived one when a rule infers it.
