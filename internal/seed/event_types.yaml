# The ship-with event_type registry (ADR-0063): the occurrence keyspace, the twin
# of the property_type registry. An event is a discrete, semantic happening, a
# component published it natively or a rule derived it (ADR-0066), not a sampled
# value and not a raw log line (raw logs are a separate ingest lane).
event_types:
  - name: call-started
    label: Call Started
    description: >-
      A conferencing endpoint entered an active call. A caught occurrence when the
      device reports it natively (an xAPI event), or a derived one when a rule
      infers it from other signals.
  - name: command-issued
    label: Command Issued
    description: >-
      A command was issued to a component (the caused event a command records). It
      opens the intended value the command sets and is the lineage cause of that
      intended value.
  - name: command-settled
    label: Command Settled
    description: >-
      A command took effect: its reply confirmed it or carried the intended value,
      or an observation of its target matched. Its message says which, and the
      command row keeps the evidence.
  - name: command-failed
    label: Command Failed
    description: >-
      A command did not take effect: its execution failed, its reply contradicted
      it, or the value observed when its settle window closed was another. Its
      message gives the reason.
  - name: command-timed-out
    label: Command Timed Out
    description: >-
      A command's settle window closed with no evidence either way: no reply that
      decided it and no observation of its target. Its message says where it
      stopped (never taken by a node, delivered with no report, or answered with
      nothing observed after).
  - name: call-ended
    label: Call Ended
    description: >-
      A conferencing endpoint left an active call: call-started's closing half,
      caught natively or derived. The pair brackets a session for usage reads.
  - name: input-changed
    label: Input Changed
    description: >-
      A display or switcher moved to a different source input. Caught natively
      where the device reports it; a frequent, benign occurrence that teaches
      the event lane's volume without implying a fault.
  - name: collection-failed
    label: Collection Failed
    description: >-
      A collection task could not use what it had: an unusable config or a
      payload that did not parse. Carries the task identity in its payload, so
      the failure names its work; the alternative is a silent skip nobody sees.
  - name: condition-started
    label: Condition Started
    description: >-
      An event rule's condition came into force on a component: the generic
      fire event for a rule that needs no semantic type of its own. Written
      once at the edge, after the rule's fire sustain, never per sample while
      the condition holds.
  - name: condition-ended
    label: Condition Ended
    description: >-
      An event rule's condition left force: condition-started's closing half,
      written once when the rule's clear criteria has held for its clear
      sustain. The pair brackets how long the condition held.
