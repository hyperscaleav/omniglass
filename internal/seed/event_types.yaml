# The ship-with event_type registry (ADR-0063): the occurrence keyspace, the twin
# of the property_type registry. An event is a discrete, semantic happening, a
# component published it natively or a rule derived it (ADR-0066), not a sampled
# value and not a raw log line (raw logs are a separate ingest lane).
event_types:
  - name: call-started
    label: Call Started
    description: >-
      A conferencing endpoint entered an active call. A caught occurrence when the
      device reports it natively (an xAPI event), or a derived one when a rule
      infers it from other signals.
  - name: command-issued
    label: Command Issued
    description: >-
      A command was issued to a component (the caused event a command records). It
      opens the intended value the command sets and is the lineage cause of that
      intended value.
  - name: call-ended
    label: Call Ended
    description: >-
      A conferencing endpoint left an active call: call-started's closing half,
      caught natively or derived. The pair brackets a session for usage reads.
  - name: input-changed
    label: Input Changed
    description: >-
      A display or switcher moved to a different source input. Caught natively
      where the device reports it; a frequent, benign occurrence that teaches
      the event lane's volume without implying a fault.
  - name: collection-failed
    label: Collection Failed
    description: >-
      A collection task could not use what it had: an unusable config or a
      payload that did not parse. Carries the task identity in its payload, so
      the failure names its work; the alternative is a silent skip nobody sees.
