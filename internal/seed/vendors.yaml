# The official vendors (manufacturers), seeded idempotently at boot. A vendor
# names an organization in the fleet model; products point at one. Each vendor
# carries a kind (manufacturer, integrator, or developer). The registry lists
# alphabetically by label.
#
# The catalog is FICTIONAL by design: the demo fleet is not sponsored, so the
# brands come from the omniglass-lab universe (Boreal displays, Kestrel video,
# Newtron control, Polaris audio processing, Tessellate sensing, Shinra Cloud
# services) plus two in-universe specialists (Lyra microphones, Meridian
# signal distribution). Websites are reserved example domains.
vendors:
  - id: boreal
    label: Boreal
    kind: manufacturer
    website: https://boreal.example
  - id: kestrel
    label: Kestrel
    kind: manufacturer
    website: https://kestrel.example
  - id: lyra
    label: Lyra
    kind: manufacturer
    website: https://lyra.example
  - id: meridian
    label: Meridian
    kind: manufacturer
    website: https://meridian.example
  - id: newtron
    label: Newtron
    kind: manufacturer
    website: https://newtron.example
  - id: polaris
    label: Polaris
    kind: manufacturer
    website: https://polaris.example
  - id: shinra-cloud
    label: Shinra Cloud
    kind: developer
    website: https://shinra-cloud.example
  - id: tessellate
    label: Tessellate
    kind: manufacturer
    website: https://tessellate.example
