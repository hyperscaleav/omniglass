# The official property_type canon, seeded idempotently at boot. A property type
# is a typed, owner-agnostic signal keyed by name (kebab-case) on the property
# lane of the catalog (#587): the non-numeric value domain (string|bool|json) a
# sample observes and a field declares. Numeric signals are metric types
# (metric_types.yaml). validation is a JSON Schema fragment.
property_types:
  - name: endpoint-reachable
    data_type: string
    validation: { enum: [up, down] }
    label: Endpoint Reachable
    description: >-
      Per-endpoint reachability verdict, the AND of the endpoint's probe
      results (up = every applicable probe reached the target). A built-in state:
      availability is time_in_state over it. Unknown/stale are read-time
      derivations, not stored values.
  - name: endpoint-responsive
    data_type: string
    validation: { enum: [up, down] }
    label: Endpoint Responsive
    description: >-
      The layer-7 rung beside endpoint-reachable: the protocol itself answered
      (an HTTP request drew a response, an SSH exchange completed). A port that
      accepts but never answers is reachable and not responsive, which is the
      distinction this verdict exists to draw.
  - name: endpoint-authenticated
    data_type: string
    validation: { enum: [yes, no] }
    label: Endpoint Authenticated
    description: >-
      The auth rung: the credential the probe carried was accepted. Written only
      when a credential was actually tried, so an unauthenticated probe never
      reads as a failed login.
  - name: session-state
    data_type: string
    validation: { enum: [establishing, up, recovering, down, rejected] }
    label: Session State
    description: >-
      A held session's state per endpoint: establishing (the first connection
      is being made), up (the connection is held and polls borrow it),
      recovering (a held connection dropped and the node is reconnecting with
      a bounded, jittered backoff), down (the attempt budget is spent; the node
      keeps retrying at the capped pace), rejected (a refusal retrying cannot
      fix, such as a wrong credential or a changed host key; the node dials no
      more until the endpoint changes or an operator retries). Written on
      transitions only; session-reason carries why.
  - name: session-reason
    data_type: string
    label: Session Reason
    description: >-
      Why a held session is in its state: the reason of its latest
      transition. A rejected session's reason is its class and the component's
      own text (auth: auth rejected), so an event rule can alarm on it.
      Written beside session-state on every transition.
  - name: ssh-host-key
    data_type: string
    label: SSH Host Key
    description: >-
      The SHA256 fingerprint of the host key an ssh session trusts, per
      endpoint. The node records the first key it sees (trust on first use)
      and every connection that matches it; a changed key is refused, and the
      session reads rejected with class host-key naming both fingerprints
      until an operator retries the endpoint with the new key, which lands
      here as the declared value.
  - name: tls-certificate
    data_type: string
    label: TLS Certificate Key
    description: >-
      The SHA256 fingerprint of the public key a tls endpoint pins, per
      endpoint, in the form ssh fingerprints a host key in. In pin mode the
      node records the first key it is offered (trust on first use), and
      records it again while the server does not yet deliver it back as the
      pin; a renewal that keeps the key is no change,
      and a changed key is refused, the session reading rejected with class
      certificate naming both fingerprints, until an operator retries the
      endpoint with the new key, which lands here as the declared value.
  - name: tls-certificate-expiry
    data_type: string
    label: TLS Certificate Expiry
    description: >-
      The not-after of the certificate a tls probe accepted (RFC 3339, UTC),
      per endpoint, stored on change. The days left beside it,
      tls-certificate-days-left, is the number a rule reads.
  - name: endpoint-rejection
    data_type: string
    label: Endpoint Rejection
    description: >-
      An endpoint's gate: the ladder rung a refusal retrying cannot fix holds
      (responsive for a host key, certificate or protocol refusal,
      authenticated for a credential), its class, and the connection
      fingerprint it holds for, or none. While the fingerprint is unchanged
      nothing at or above that rung is attempted again; a changed secret,
      address, port, transport, login declaration or pin, or an operator's
      retry, lifts it. The fingerprint is a digest only. A refusal of a
      changed key (class host-key) appends its evidence, the pinned key and
      the key the component offered instead, each a SHA256 fingerprint.
  - name: health
    data_type: string
    validation: { enum: [healthy, incomplete, degraded, outage] }
    label: Health
    description: >-
      The rolled-up health verdict for a component, system, or location, worst-wins
      over its inputs (a component's active alarms, a system's roles, the systems
      under a location). Recorded transition-only, so the series is the edges: when
      it broke and when it came back, not a sample per check. incomplete ranks
      between healthy and degraded and means a commissioning gap: a role short
      because its hardware was never installed, which no alarm will ever fire for.
  - name: video-input
    data_type: string
    validation: { enum: [hdmi1, hdmi2, hdmi3, dp1, usbc] }
    label: Video Input
    description: >-
      The selected video input on a display or switcher. A settable state: the
      set-input command tells the device which input to select (opening an intended
      value), and the device reports the observed input, so the two reconcile.
  # Settable and observed states the http drivers read (#902).
  - name: power-state
    data_type: string
    validation: { enum: ["on", "off", standby] }
    label: Power State
    description: >-
      Whether a component is on, off, or in standby. A settable state: the set-power
      command tells the component which to enter, and its report settles it.
  - name: mute
    data_type: string
    validation: { enum: ["true", "false"] }
    label: Mute
    description: >-
      Whether a component's audio is muted, as the component reports it ("true" or
      "false"). A settable state: the set-mute command tells the component which.
  - name: call-state
    data_type: string
    validation: { enum: [active, idle] }
    label: Call State
    description: Whether a conferencing component is in a call (active) or not (idle).
  - name: occupancy-state
    data_type: string
    validation: { enum: [occupied, vacant] }
    label: Occupancy State
    description: Whether a space reads occupied or vacant by its occupancy source.
  # Declared attribute properties: the starter set a field draws from.
  - name: serial-number
    data_type: string
    label: Serial number
    description: The manufacturer serial number of the device.
  - name: mac-address
    data_type: string
    validation: { pattern: "^([0-9a-f]{2}:){5}[0-9a-f]{2}$" }
    label: MAC address
    description: The primary hardware (MAC) address, lowercase colon-separated.
  - name: firmware-version
    data_type: string
    label: Firmware version
    description: The installed firmware or software version.
  - name: model-number
    data_type: string
    label: Model number
    description: The manufacturer model number.
