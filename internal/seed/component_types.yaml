    parent_id: mic
  - id: speaker
    label: Speaker
    parent_id: audio-device
    stem: speaker
    abbrev: spk
    icon: speaker
  - id: audio-mixer
    label: Audio Mixer
    parent_id: audio-device
    stem: mixer
    abbrev: mix
    icon: sliders
  - id: dsp
    label: DSP
    parent_id: audio-device
    stem: dsp
    abbrev: dsp
    icon: cpu
  - id: dante-card
    label: Dante Card
    parent_id: dsp
    stem: dante
    abbrev: dc
    icon: network
  - id: amplifier
    label: Amplifier
    parent_id: audio-device
    stem: amp
    abbrev: amp
    icon: speaker
  # ── Video devices (OAVC 2.3) ────────────────────────────────────────────
