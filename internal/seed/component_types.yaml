# The component_type taxonomy: the hierarchical registry a product is
# classified by (partially reverses ADR-0047's retirement of the flat
# component_type registry, recorded as such: the reintroduced shape sits above
# product, not beside component). Official (ON CONFLICT DO UPDATE,
# authoritative), unlike location_types.yaml's seed-if-absent example content.
#
# The tree mirrors the OpenAVCloud AV Device Taxonomy v1.1 (ADR: the category
# roots are OAVC's high-level categories, the mid level its subcategories, and
# the leaves the concrete classes a standard's slot names). Microphone
# subtypes are arranged by FORM FACTOR (ceiling, wireless, gooseneck,
# boundary), never by inner technology: beamforming is a capability a ceiling
# mic may have, not a kind of device. A slot may accept at any level (the
# typed-slot guard matches self or a descendant, #626): "mic" admits every
# form factor, "gooseneck-mic" exactly one.
#
# Every root carries its own stem (the auto-generated component name's
# prefix), abbrev (a compact form), and icon; a child leaves a field blank to
# inherit the parent's, and sets one only to override it. Order matters: a
# child's parent_id must name an id that appears earlier in this list.
component_types:
  # ── Display devices (OAVC 2.1) ──────────────────────────────────────────
  - id: display-device
    label: Display Device
    stem: display
    abbrev: disp
    icon: monitor
  - id: display
    label: Display
    parent_id: display-device
    stem: display
    abbrev: fp
    icon: monitor
  - id: interactive-display
    label: Interactive Display
    parent_id: display
  - id: projector
    label: Projector
    parent_id: display-device
    stem: projector
    abbrev: proj
    icon: projector
  - id: screen
    label: Screen
    parent_id: display-device
    stem: screen
    abbrev: scr
    icon: tv
  - id: video-wall
    label: Video Wall
    parent_id: display-device
    stem: videowall
    abbrev: vw
    icon: grid
  - id: interactive-whiteboard
    label: Interactive Whiteboard
    parent_id: display-device
    stem: whiteboard
    abbrev: iwb
    icon: pencil
  # ── Audio devices (OAVC 2.2) ────────────────────────────────────────────
  - id: audio-device
    label: Audio Device
    stem: audio
    abbrev: aud
    icon: speaker
  - id: mic
    label: Microphone
    parent_id: audio-device
    stem: mic
    abbrev: mic
    icon: mic
  - id: wireless-mic
    label: Wireless Microphone
    parent_id: mic
  - id: ceiling-mic
    label: Ceiling Microphone
    parent_id: mic
  - id: boundary-mic
