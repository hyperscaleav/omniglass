# The five official roles, seeded idempotently at boot (ON CONFLICT DO UPDATE).
# permissions are <resource>:<action> strings; one entry per resource, actions
# comma-separated; a wildcard stands alone. inherits names parent role ids.
# Inheritance, wildcard expansion, and the :read floor are resolved at runtime in
# the role index, not stored expanded here. A release may patch a default here.
# label and description are operator-facing (the Roles view and the
# grant-builder tooltips).
roles:
  - id: viewer
    label: Viewer
    description: Read-only access to everything. The floor every other role inherits.
    permissions:
      - "*:read"
  - id: operator
    label: Operator
    description: >-
      Day-to-day operations: create or edit components, endpoints (retry an
      endpoint's rejected session, or run its poll now), secrets,
      variables, the property, metric, event, command and notification
      catalogs, issue
      commands in scope, preview a driver spec through a node, and impair
      simulated devices.
      Sees and reveals the device secrets in its scope (never the admin-sensitive
      platform credentials). Inherits Viewer.
    inherits: ["viewer"]
    permissions:
      - "component:create,update,rename,move"
      - "endpoint:create,update,retry,run"
      # driver:preview runs a spec's polls once through a node against a target
      # the caller names, storing nothing (#1163). A poll's request is whatever
      # the spec says, so it reaches the component as a command would: it sits
      # with command:issue, and the secrets it hands over must be ones the
      # caller may reveal.
      - "driver:preview"
      - "secret:read,reveal,create,update"
      - "variable:create,update"
      - "property_type:create,update"
      - "metric_type:create,update"
      - "event_type:create,update"
      - "command_type:create,update"
      # notification_type is the outbound message catalog (#618): an operator
      # writes the templates beside the command catalog; renaming and deleting
      # one stay with admin.
      - "notification_type:create,update"
      - "command:issue"
      - "simulation:update"
      # alarm:acknowledge records that a human has seen an alarm. The role that
      # runs the fleet is the role that acknowledges. The verb is spelled out
      # like every other seeded action; `alarm:ack` was only ever fixture and
      # illustrative vocabulary, and a permission string is operator-facing (the
      # Roles view, the grant builder, /auth/me). Deliberately NOT on deploy: an
      # alarm resolves scope on the COMPONENT tier, and a location-scoped deploy
      # grant reaches no component at all (#714), so granting it there would ship
      # a capability that acknowledges nothing in the shape the role is granted in.
      - "alarm:acknowledge"
      # telemetry:push is a WRITE of observations, so it sits with the other
      # operator writes and deliberately outside the viewer read floor. An
      # integration that only reports data needs nothing else: the push scope
      # is enough to see the component it names, and every component outside
      # it is a non-disclosing 404 (ADR-0752).
      - "telemetry:push"
      # files are shared knowledge (not in the sensitive-resource set), so the
      # viewer floor reads ordinary ones; operators upload and delete them. A
      # sensitive file needs the admin tier, which operator does not hold.
      - "file:create,delete"
  - id: deploy
    label: Deploy
    description: >-
      Integrator or field tech: create, update, rename, and move on locations,
      systems, and components, and no delete. A grant of it reaches ONE tier, the
      tier it is scoped at. Granted at a location with the "under only" operator,
      it builds out and edits the rooms under that location, never the location
      itself, plus the secrets those locations own; it reaches no system and no
      component there, not even to read one. Building those out inside a building
      takes a system-scoped and a component-scoped grant of this role beside the
      location one, until a grant's scope can span tiers. Inherits Viewer, whose
      read floor is scoped the same way.
    inherits: ["viewer"]
    permissions:
      - "location:create,update,rename,move"
      - "system:create,update,rename,move"
      - "component:create,update,rename,move"
      - "secret:read,reveal,create,update"
      - "file:create"
  - id: admin
    label: Administrator
    description: >-
      Manages the fleet, users, roles, and grants: full create, update, and
      delete on locations, systems, and components, and on principals,
      credentials, grants, and roles. Deliberately NOT the superuser: it cannot
      grant a role above its own tier, so it cannot make itself owner. Inherits
      Operator.
    inherits: ["operator"]
    permissions:
      - "component:delete"
      - "endpoint:*"
      - "task:*"
      - "system:create,update,delete,rename,move"
      - "location:create,update,delete,rename,move"
      - "principal:*"
      # read (the Users directory) and purge (the irreversible hard delete) are
      # admin-sensitive: three-token permissions that principal:* (two tokens)
      # structurally cannot reach, so only admin (via these explicit grants) and
      # owner (via >) get the directory and the hard delete. Roles and groups gate
      # their directory the same way.
      - "principal:read:admin"
      - "principal:purge:admin"
      # secret:> (not secret:*) so admin reaches the admin-sensitive tier
      # (secret:reveal:admin etc.) a two-token wildcard cannot; an admin-sensitive
      # secret is thus admin/owner-only, while operators hold the two-token actions
      # on the non-sensitive ones.
      - "secret:>"
      # file:> (not file:*) so admin reaches the sensitive tier (file:read:admin
      # etc.) a two-token wildcard cannot; a sensitive file is thus admin/owner-only.
      - "file:>"
      - "variable:*"
      # platform:<action> is install-wide authority: the right to change the value
      # that applies to the WHOLE install (the least-specific cascade tier and the
      # settings overrides), separate from how much of the fleet a grant's scope
      # covers. Admin and owner (via >) hold it; operator and deploy deliberately do
      # not, so an all-scoped operator runs every site without being able to move
      # the install-wide floor under them.
      - "platform:*"
      - "settings:read,update"
      - "principal_grant:*"
      - "principal_group:*"
      - "principal_group:read:admin"
      - "node:*"
      - "role:read:admin"
      - "audit:read:admin"
      - "property_type:*"
      - "metric_type:*"
      - "event_type:*"
      - "severity_level:*"
      - "rule:*"
      - "command_type:*"
      - "notification_type:*"
      - "command:*"
      # rename moves a registry row's handle (#555): its own action, as on the
      # fleet tiers, because it breaks a script or a bookmark that typed the old
      # name even though every reference inside the platform holds the uuid.
      - "location_type:create,update,delete,rename"
      - "component_type:create,update,delete"
      - "system_type:create,update,delete"
      - "vendor:create,update,delete,rename"
      - "driver:create,update,delete,rename"
      - "product:create,update,delete,rename"
      # standard is the system-side counterpart of product (a Catalog entity with
      # its own property contract), so it carries its own permission rather than
      # the type-registry one.
      - "standard:create,update,delete,rename"
      - "tag:*"
  - id: owner
    label: Owner
    description: >-
      Full control of everything, the break-glass superuser (the tail wildcard,
      so it covers every capability at every tier, including admin-sensitive ones
      and future resources). At least one active owner always exists, and an owner
      account cannot be impersonated.
    permissions:
      - ">"
