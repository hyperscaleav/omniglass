# The official products, seeded idempotently at boot. A product is a concrete
# SKU that ties the classification catalogs together: a vendor (who makes it), a
# driver (what talks to it), a kind (device/app/service), and the component_type
# it is classified under (the taxonomy above product; component_types.yaml,
# seeded first). vendor_id, driver_id, and component_type must resolve against
# their catalogs. The registry lists alphabetically by label. Starter
# set, operator-extensible later; tune freely.
#
# The three generics (generic-device/generic-app/generic-service) are the
# fallback every unclassified component and product resolves to (the product
# and component floor): a component with no real product, or a product created
# without an explicit component_type, lands on the generic matching its own
# kind rather than being refused outright by a direct-gateway caller.
products:
  - id: cisco-room-bar
    label: Cisco Room Bar
    vendor_id: cisco
    driver_id: cisco-xapi
    kind: device
    component_type: video-bar
    # The declared-property contract: which properties this product declares and
    # their defaults. An operator overrides one on a component; an unset property
    # resolves to the default here.
    properties:
      - name: serial-number
      - name: firmware-version
      - name: model-number
        default: '"Room Bar"'
  - id: samsung-qm55
    label: Samsung QM55
    vendor_id: samsung
    kind: device
    component_type: display
    properties:
      - name: serial-number
      - name: firmware-version
      - name: model-number
        default: '"QM55"'
  - id: shure-mxa920
    label: Shure MXA920
    vendor_id: shure
    driver_id: snmp-generic
    kind: device
    component_type: ceiling-mic
  - id: crestron-tss-1070
    label: Crestron TSS-1070
    vendor_id: crestron
    driver_id: crestron-cip
    kind: device
    component_type: touch-panel
  - id: generic-device
    label: Generic Device
    kind: device
    component_type: generic-device
  - id: generic-app
    label: Generic App
    kind: app
    component_type: generic-app
  - id: generic-service
    label: Generic Service
    kind: service
    component_type: generic-service
