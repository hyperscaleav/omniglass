# The standard templates (kind standard_template): example standards an
# operator forks (POST /standards:fork, ADR-0071, ADR-0827). The binary
# offers them and inserts nothing: a fork writes one standard the operator
# owns outright, with these roles, choices and contract lines, and nothing
# points back here, so a release can rewrite any of these without touching a
# fleet.
#
# The catalog is written the way an integrator writes space standards (#802):
# a standard is a space type's full signal chain, and a size-serialized family
# (mr55..mr98, ds55/ds75) pins the display SKU per variant while the chain
# stays the parent's. A variant names its parent template, and forks only
# once the operator holds a standard forked from it. Domain rules that shaped
# it: a video bar is the ONE all-in-one conferencing appliance at the front of
# a space, never a microphone and never shared; microphones are typed by form
# factor; a divisible space shares its DSP and amplifier rack, which is what
# the shared-component quorum case teaches. The occupied-space archetypes
# declare the room-temperature and occupancy-count metric contract, so every
# conforming system's zoom carries the KPI tiles; some carry a map, the layout
# a system's Map tab draws (ADR-0128).
templates:
  - kind: standard_template
    name: meeting-room
    label: Meeting Room
    description: >-
      A meeting space's full chain: a video bar at the front, a main display, touch control and a scheduling panel. The parent of the sized variants, with no display pinned.
    standard:
      roles:
        - name: video-bar
          label: Video Bar
          accepted_types: [video-bar]
        - name: main-display
          label: Main Display
          accepted_types: [display]
        - name: touch-control
          label: Touch Control
          accepted_types: [touch-panel]
        - name: scheduling-panel
          label: Scheduling Panel
          accepted_types: [scheduling-panel]
      metrics:
        - { name: room-temperature }
        - { name: occupancy-count }
  - kind: standard_template
    name: mr55
    label: Meeting Room 55
    description: >-
      Meeting Room with its main display pinned to a 55-inch panel. Fork Meeting Room first.
    standard:
      parent: meeting-room
      roles:
        - name: video-bar
          label: Video Bar
          accepted_types: [video-bar]
        - name: main-display
          label: Main Display
          accepted_types: [display]
          pinned_products: [boreal-edge-55]
        - name: touch-control
          label: Touch Control
          accepted_types: [touch-panel]
        - name: scheduling-panel
          label: Scheduling Panel
          accepted_types: [scheduling-panel]
      metrics:
        - { name: room-temperature }
        - { name: occupancy-count }
      map:
        aspect: 1.5
        positions:
          - { role: main-display, position: 1, x: 0.5, y: 0.06 }
          - { role: video-bar, position: 1, x: 0.5, y: 0.14 }
          - { role: touch-control, position: 1, x: 0.5, y: 0.55 }
          - { role: scheduling-panel, position: 1, x: 0.06, y: 0.9 }
