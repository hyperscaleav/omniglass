    label: Huddle Room
    description: >-
      A small space built either of two ways (an all-in-one video bar, or a codec with its own camera, DSP, amplifier and microphone): a choice, and only one alternate need be staffed.
    standard:
      choices:
        - name: conferencing
          label: Conferencing
          alternates:
            - { name: all-in-one, label: All-in-one }
            - { name: component-system, label: Component System }
      roles:
        - name: main-display
          label: Main Display
          accepted_types: [display]
        - name: conf-bar
          label: Conferencing Bar
          quorum: 1
          accepted_types: [video-bar]
          choice: conferencing
          alternate: all-in-one
        - name: conf-codec
          label: Codec
          accepted_types: [codec]
          choice: conferencing
          alternate: component-system
        - name: conf-camera
          label: Camera
          accepted_types: [camera]
          choice: conferencing
          alternate: component-system
        - name: conf-dsp
          label: DSP
          accepted_types: [dsp]
          choice: conferencing
          alternate: component-system
        - name: conf-amp
          label: Amplifier
          accepted_types: [amplifier]
          choice: conferencing
          alternate: component-system
        - name: conf-mic
          label: Microphone
          accepted_types: [mic]
          choice: conferencing
          alternate: component-system
      metrics:
        - { name: room-temperature }
        - { name: occupancy-count }
      map:
        aspect: 1.3
        positions:
          - { role: main-display, position: 1, x: 0.5, y: 0.06 }
          - { role: conf-bar, position: 1, x: 0.5, y: 0.14 }
